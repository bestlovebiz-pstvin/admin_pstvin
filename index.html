<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#202C1D">
<meta name="description" content="Multi-entity bookkeeping for churches, charities, companies and household budgets — all data kept on your own device.">
<link rel="manifest" href="manifest.json">

<!-- iOS home-screen behaviour (Safari doesn't use the manifest for these) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pst Vin Admin">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pst Vin Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ============ Tokens ============ */
  :root{
    --paper:#EEF2E7;
    --paper-deep:#E1E9D6;
    --panel:#F8FAF3;
    --rule:#C3D1B3;
    --rule-strong:#A7BA95;
    --ink:#202C1D;
    --ink-soft:#57654C;
    --ink-faint:#8B9A7E;
    --brass:#9C7024;
    --brass-deep:#7C5A1E;
    --brass-soft:#EADFC3;
    --income:#2E6E4E;
    --income-soft:#DEEBE0;
    --expense:#8C4A3A;
    --expense-soft:#F1E2DA;
    --danger:#B3261E;
    --danger-soft:#F6DEDC;
    --shadow: 0 1px 2px rgba(32,44,29,0.06), 0 6px 20px -8px rgba(32,44,29,0.18);
    --focus: 0 0 0 3px rgba(156,112,36,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141B10;
      --paper-deep:#1B2416;
      --panel:#1E2818;
      --rule:#34432A;
      --rule-strong:#425536;
      --ink:#E7EEDD;
      --ink-soft:#A7B79A;
      --ink-faint:#748367;
      --brass:#D9A94E;
      --brass-deep:#EFC272;
      --brass-soft:#3A2E15;
      --income:#6FC496;
      --income-soft:#1C3126;
      --expense:#DB9679;
      --expense-soft:#33231C;
      --danger:#E88A80;
      --danger-soft:#3A231F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px -8px rgba(0,0,0,0.5);
      --focus: 0 0 0 3px rgba(217,169,78,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141B10;
    --paper-deep:#1B2416;
    --panel:#1E2818;
    --rule:#34432A;
    --rule-strong:#425536;
    --ink:#E7EEDD;
    --ink-soft:#A7B79A;
    --ink-faint:#748367;
    --brass:#D9A94E;
    --brass-deep:#EFC272;
    --brass-soft:#3A2E15;
    --income:#6FC496;
    --income-soft:#1C3126;
    --expense:#DB9679;
    --expense-soft:#33231C;
    --danger:#E88A80;
    --danger-soft:#3A231F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px -8px rgba(0,0,0,0.5);
    --focus: 0 0 0 3px rgba(217,169,78,0.35);
  }

  *{ box-sizing:border-box; }
  /* A <select> in particular sizes itself to its longest option's text by default
     (e.g. a full expense-heading name like "COST OF GOODS SOLD (COGS)") regardless
     of the space actually available — cap every form control at its container's
     width so a long option/value never forces a form (or the page) wider than the
     screen; on inputs/textareas this is a no-op since they already default to a
     sane width. */
  input, select, textarea{ max-width:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:14.5px;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:"Source Serif 4", Georgia, serif;
    font-weight:600;
    color:var(--ink);
    text-wrap:balance;
    margin:0;
  }
  .num, .amount, input[type="number"], input[type="date"], table td.num-col, .stat-value, .stmt-amt{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
  a{ color:var(--brass-deep); }
  ::selection{ background:var(--brass-soft); }
  :focus-visible{ outline:none; box-shadow:var(--focus); border-radius:4px; }

  @media (prefers-reduced-motion: no-preference){
    .view{ animation: rise .28s ease both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  }

  /* ============ App shell ============ */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:236px; flex:none; background:var(--paper-deep); border-right:1px solid var(--rule);
    display:flex; flex-direction:column; padding:22px 16px; gap:18px; overflow-y:auto;
  }
  .brand{ padding:0 6px; }
  .brand .mark{
    display:flex; align-items:center; gap:9px;
    font-family:"Source Serif 4", serif; font-weight:700; font-size:19px; color:var(--ink);
  }
  .brand .mark .seal{
    width:26px; height:26px; border-radius:50%; background:var(--brass); color:var(--paper-deep);
    display:flex; align-items:center; justify-content:center;
    font-family:"Source Serif 4", serif; font-weight:700; font-size:13px; flex:none;
  }
  .brand .period{ margin-top:4px; font-size:11.5px; color:var(--ink-soft); letter-spacing:.02em; }
  .year-label{ display:inline-block; }
  .year-select{
    font:inherit; font-size:11.5px; color:var(--ink-soft); background:transparent; border:1px solid var(--rule);
    border-radius:5px; padding:2px 5px; letter-spacing:.02em; cursor:pointer; max-width:100%;
  }
  .year-select:hover{ border-color:var(--rule-strong); color:var(--ink); }
  /* Hamburger menu toggle — only meaningful on the mobile collapsed layout below;
     the desktop sidebar is always fully expanded, so this never shows there. */
  .nav-toggle{ display:none; }

  nav.primary{ display:flex; flex-direction:column; gap:2px; }
  .navlabel{ font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); margin:10px 6px 4px; }
  .navlink{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px;
    color:var(--ink-soft); text-decoration:none; cursor:pointer;
    border:1px solid transparent; background:none; text-align:left; width:100%;
    font-size:13px; font-weight:500;
  }
  .navlink .ico{ width:17px; text-align:center; flex:none; font-size:13.5px; }
  .navlink:hover{ background:var(--panel); color:var(--ink); }
  .navlink.active{ background:var(--panel); color:var(--ink); border-color:var(--rule); box-shadow:var(--shadow); font-weight:600; }

  .sidebar-foot{ margin-top:auto; padding-top:12px; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--rule); }
  .filelink{ margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--rule); }
  .filelink-row{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; word-break:break-word; }
  .filelink-ok .filelink-row{ color:var(--income); }
  .filelink-warn .filelink-row{ color:var(--expense); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding:22px 30px 18px; border-bottom:1px solid var(--rule); background:var(--paper);
  }
  .topbar h1{ font-size:22px; }
  .topbar .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:3px; }
  .content{ padding:26px 30px 60px; max-width:1180px; }

  /* ============ Cards / panels ============ */
  .panel{ background:var(--panel); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); }
  .panel-pad{ padding:18px 20px; }
  .panel + .panel{ margin-top:18px; }

  /* ============ Stat tiles ============ */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; }
  .stat{ padding:16px 18px; }
  .stat .label{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
  .stat .stat-value{ font-size:24px; font-weight:600; margin-top:6px; }
  .stat.income .stat-value{ color:var(--income); }
  .stat.expense .stat-value{ color:var(--expense); }
  .stat .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

  /* ============ Forms ============ */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; font-weight:600; color:var(--ink-soft); letter-spacing:.01em; }
  .field input, .field select, .field textarea{
    background:var(--paper); border:1px solid var(--rule-strong); border-radius:7px;
    padding:9px 11px; color:var(--ink); font-family:inherit; font-size:13px;
  }
  .field textarea{ resize:vertical; line-height:1.5; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--brass); }
  .field .helper{ font-size:11px; color:var(--ink-faint); }

  .entry-form{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 14px; align-items:end; }
  .entry-form .field.wide{ grid-column:1 / -1; }
  .entry-form .field.narrow{ max-width:150px; }
  /* Shown while an existing entry is loaded into the form for editing rather than adding a new
     one — a visible cue that "Record income/expenditure" has temporarily become "Save changes". */
  .panel.editing-active{ box-shadow:inset 3px 0 0 var(--brass); }
  .edit-cancel-link{ background:none; border:none; color:var(--brass); font-size:12px; font-weight:600; cursor:pointer; padding:0; }
  .edit-cancel-link:hover{ color:var(--brass-deep); text-decoration:underline; }

  .btn{
    border-radius:7px; padding:9px 16px; font-weight:600; font-size:13px; cursor:pointer;
    border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .btn-primary{ background:var(--brass); color:#fff8ea; }
  .btn-primary:hover{ background:var(--brass-deep); }
  .btn-ghost{ background:transparent; border-color:var(--rule-strong); color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .btn-sm{ padding:5px 10px; font-size:11.5px; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  /* ============ Table (ledger sheet) ============ */
  .table-wrap{ overflow-x:auto; border-radius:10px; }
  table.ledger{ width:100%; border-collapse:collapse; min-width:640px; }
  table.ledger thead th{
    position:sticky; top:0; background:var(--paper-deep); text-align:left; font-size:10.5px;
    letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);
    padding:10px 14px; border-bottom:1px solid var(--rule-strong); white-space:nowrap;
  }
  table.ledger td{ padding:10px 14px; border-bottom:1px solid var(--rule); font-size:13.5px; vertical-align:middle; }
  table.ledger tbody tr:hover{ background:var(--paper-deep); }
  table.ledger td.num-col{ text-align:right; font-weight:500; }
  table.ledger td.num-col.income{ color:var(--income); }
  table.ledger td.num-col.expense{ color:var(--expense); }
  table.ledger td.actions{ text-align:right; white-space:nowrap; }
  table.ledger .note{ color:var(--ink-soft); font-size:12px; }

  /* Giver Profiles: contact fields edited directly in the table (see fund_engine.js), styled to
     read like plain text until focused, and stripped back to plain text on print entirely. */
  table.profile-table td.profile-name{ font-weight:600; white-space:nowrap; }
  table.profile-table input{ width:100%; min-width:140px; box-sizing:border-box; padding:6px 8px; border:1px solid transparent; border-radius:6px; background:transparent; color:var(--ink); font-size:13px; font-family:inherit; }
  table.profile-table input:hover{ border-color:var(--rule); }
  table.profile-table input:focus{ outline:none; border-color:var(--brass); background:var(--paper); }
  table.profile-table input::placeholder{ color:var(--ink-faint); }
  table.ledger .pill{ font-size:11px; padding:2px 8px; border-radius:20px; background:var(--paper-deep); color:var(--ink-soft); border:1px solid var(--rule); }
  table.ledger tfoot td{ padding:10px 14px; font-weight:700; border-top:2px solid var(--rule-strong); background:var(--paper-deep); }
  table.ledger .budget-input{ width:92px; padding:5px 8px; border-radius:6px; border:1px solid var(--rule-strong); background:var(--paper); text-align:right; }
  table.ledger .status-pill{ font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; }
  table.ledger .status-pill.good{ background:var(--income-soft); color:var(--income); }
  table.ledger .status-pill.over{ background:var(--danger-soft); color:var(--danger); }
  table.ledger .status-pill.flat{ background:var(--paper-deep); color:var(--ink-faint); }

  /* Invoice/receipt status pill — same look as .status-pill above but not scoped to
     table.ledger, since it's also used on the standalone document view/print page. */
  .pill-status{ font-size:10.5px; padding:3px 10px; border-radius:20px; font-weight:600; display:inline-block; }
  .pill-status.good{ background:var(--income-soft); color:var(--income); }
  .pill-status.over{ background:var(--danger-soft); color:var(--danger); }
  .pill-status.flat{ background:var(--paper-deep); color:var(--ink-faint); }

  /* Invoices & Receipts — line-item editor (documents form) and the single-document
     view/print page (see the shared documents module at the end of shell.js). */
  table.ledger.doc-items input{ width:100%; box-sizing:border-box; border:1px solid var(--rule-strong); border-radius:6px; padding:6px 8px; background:var(--paper); color:var(--ink); font-family:inherit; font-size:13px; }
  table.ledger.doc-items input:focus{ outline:none; border-color:var(--brass); }
  table.ledger.doc-items td.num-col input{ text-align:right; }
  .doc-view-top{ display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .doc-view-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .doc-view-value{ font-size:15px; font-weight:600; margin-top:2px; }
  .doc-view-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .doc-view-actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }

  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .search-box{ position:relative; flex:1; min-width:180px; max-width:340px; }
  .search-box input{ width:100%; padding:8px 12px 8px 30px; border-radius:7px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink); }
  .search-box::before{ content:"⌕"; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px; }
  .count-badge{ font-size:12px; color:var(--ink-faint); }

  .empty{ padding:34px 20px; text-align:center; color:var(--ink-soft); }
  .empty .big{ font-size:26px; margin-bottom:6px; }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .section-title h2{ font-size:16.5px; }
  .section-title .desc{ font-size:12px; color:var(--ink-soft); }

  /* minmax(0, ...) rather than a bare 1fr/270px floor — a plain fr track (or one
     whose minimum exceeds the viewport) refuses to shrink below its content's own
     width, which is what pushes wide content like a table past the screen edge
     and forces the whole page to scroll sideways on a phone instead of just the
     table itself scrolling inside its own .table-wrap. */
  .two-col{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width:820px){ .two-col{ grid-template-columns:minmax(0,1fr); } }
  .three-col{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr)); gap:18px; align-items:start; }

  .chiplist{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--rule); border-radius:20px; padding:6px 8px 6px 13px; font-size:12.5px; }
  .chip .idx{ color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:11px; }
  .chip button{ border:none; background:var(--danger-soft); color:var(--danger); border-radius:50%; width:18px; height:18px; line-height:1; cursor:pointer; font-size:11px; }
  .chip.custom{ border-color:var(--brass); }
  .chip.custom .idx{ color:var(--brass-deep); }

  /* Per-heading, reorderable expense category rows (Categories page) */
  .cat-group-label{ font-weight:600; font-size:12.5px; color:var(--ink-soft); margin:14px 0 6px; }
  .cat-order-row{ display:flex; align-items:center; gap:8px; padding:5px 4px; border-bottom:1px solid var(--rule); font-size:12.5px; }
  .cat-order-row:last-child{ border-bottom:none; }
  .cat-order-row.custom{ border-left:3px solid var(--brass); padding-left:7px; }
  .cat-order-name{ flex:1; border:none; background:transparent; font:inherit; color:inherit; padding:2px 4px; border-radius:4px; }
  .cat-order-name:hover, .cat-order-name:focus{ background:var(--rule); outline:none; }
  .cat-order-row .idx{ color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:11px; }
  .btn-reorder{ border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink); border-radius:5px; width:22px; height:22px; line-height:1; cursor:pointer; font-size:10px; padding:0; }
  .btn-reorder:disabled{ opacity:.3; cursor:default; }
  .btn-reorder:hover:not(:disabled){ background:var(--rule-strong); }
  .row-del-btn{ border:none; background:var(--danger-soft); color:var(--danger); border-radius:50%; width:18px; height:18px; line-height:1; cursor:pointer; font-size:11px; flex-shrink:0; }

  .banner{ padding:12px 16px; border-radius:8px; font-size:12.5px; display:flex; gap:10px; align-items:flex-start; }
  .banner.warn{ background:var(--danger-soft); color:var(--danger); }
  .banner.info{ background:var(--brass-soft); color:var(--brass-deep); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:20px;
    font-size:12.5px; box-shadow:var(--shadow); z-index:50; opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  /* ============ Statements ============ */
  .statement{ max-width:520px; }
  .statement.with-prior-year{ max-width:660px; }
  .stmt-section-title{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:18px 0 6px; }
  .stmt-section-title:first-child{ margin-top:0; }
  .stmt-row{ display:flex; justify-content:space-between; gap:14px; padding:6px 0; border-bottom:1px dashed var(--rule); font-size:13.5px; }
  .stmt-row .stmt-label{ color:var(--ink-soft); flex:1 1 auto; min-width:0; }
  .stmt-row .stmt-amt{ flex:0 0 110px; text-align:right; }
  .stmt-row.sub{ font-weight:600; border-bottom:1px solid var(--rule-strong); margin-top:2px; }
  .stmt-row.sub .stmt-label{ color:var(--ink); }
  .stmt-row.total{ font-weight:700; border-top:2px solid var(--ink); border-bottom:3px double var(--ink); padding:9px 0; margin-top:6px; font-size:15px; }
  .stmt-row.total .stmt-label{ color:var(--ink); }
  .stmt-row.surplus .stmt-amt{ color:var(--income); }
  .stmt-row.deficit .stmt-amt{ color:var(--danger); }

  /* ============ Bar lists ============ */
  .barlist{ display:flex; flex-direction:column; gap:11px; }
  .barrow-head{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; gap:10px; }
  .barrow-head .n{ color:var(--ink-soft); }
  .bar-track{ height:8px; background:var(--paper); border-radius:20px; overflow:hidden; border:1px solid var(--rule); }
  .bar-fill{ height:100%; border-radius:20px; }
  .barrow.expense .bar-fill{ background:var(--expense); }
  .barrow.income .bar-fill{ background:var(--income); }

  .balance-form{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px; }

  /* Removes the ~300ms tap delay and the double-tap-to-zoom gesture on interactive
     elements everywhere (harmless on desktop, noticeably snappier on touch screens). */
  a, button, .navlink, .btn, .btn-reorder, .row-del-btn, .chip, .entity-card, input[type="checkbox"], input[type="radio"], label.type-card{
    touch-action: manipulation;
  }
  /* Momentum (rather than stuttery) scrolling for horizontally/vertically scrollable
     panes on iOS Safari. */
  .table-wrap, .sidebar{ -webkit-overflow-scrolling: touch; }

  /* mobile */
  @media (max-width:780px){
    .app{ flex-direction:column; }
    /* ---- Collapsed top bar: hamburger + entity name/year only ---- */
    .sidebar{
      width:100%; display:flex; flex-direction:row; flex-wrap:wrap; align-items:center;
      padding:12px 14px; gap:10px 14px; overflow-x:hidden; overflow-y:visible; position:relative;
      /* Keeps the top nav bar clear of the notch/Dynamic Island in portrait, once
         installed as a full-screen app (viewport-fit=cover makes env() resolve to
         something other than 0). A flat safe-area-inset-top sits the row right at
         the island's lower edge, which is tight enough to still catch mis-taps —
         the extra +10px gives it real breathing room instead of a hairline gap. */
      padding-top:max(12px, calc(env(safe-area-inset-top) + 10px));
      padding-left:max(14px, env(safe-area-inset-left));
      padding-right:max(14px, env(safe-area-inset-right));
    }
    /* Everything below the collapsed bar is hidden until the hamburger is
       tapped — see body.nav-open below. Ordered so the toggle + entity name
       always sit together on the first line, and each of these, once shown,

    .brand{ flex:1 1 auto; min-width:0; order:2; }

    /* Extra specificity (".sidebar .back-to-home" rather than just ".back-to-home")
       is needed here to reliably beat the base .back-to-home rule declared
       further down this file, outside any media query, at equal specificity
       otherwise — mobile-only overrides win on source order everywhere else in
       this file because their un-prefixed base rules all happen to come earlier,
       but this one doesn't. */

    nav.primary{ display:none; order:4; flex:0 0 100%; }
    .sidebar-foot{ display:none; order:5; flex:0 0 100%; }

    /* ---- Open state: everything reflows into a plain vertical stacked list,
       pushing the page content below it down rather than overlaying on top of
       it (no backdrop/positioning tricks needed) — capped and independently
       scrollable so a long nav list never forces the whole page taller than
       the screen. Picking a page (or "← All entities") closes this again;
       see the delegated click handler in boot.js. ---- */

    body.nav-open .back-to-home{ display:flex; }
    body.nav-open nav.primary{ display:flex; flex-direction:column; gap:2px; }
    body.nav-open .navlabel{ display:block; }
    body.nav-open .navlink{ justify-content:flex-start; width:100%; }
    body.nav-open .navlink span.label{ display:inline; margin-left:10px; }
    body.nav-open .sidebar-foot{
      display:flex; flex-direction:column; align-items:stretch;
      margin-top:12px; padding-top:12px; border-top:1px solid var(--rule);
    }
    body.nav-open .sidebar-foot > div:last-child{ display:block; }
    body.nav-open .backup-actions, body.nav-open .filelink{ display:block; margin:0; padding:0; border:none; }
    body.nav-open .backup-actions .btn, body.nav-open .filelink .btn{ width:100% !important; margin-bottom:6px !important; white-space:normal; }
    body.nav-open .filelink-row{ display:block; }

    /* Taller, wider tap targets — the icon-only collapsed state is otherwise the
       smallest set of buttons on the busiest, most-used screen on a phone (once
       open, the list is full-width rows instead, so this mainly matters there
       for comfortable vertical spacing). */

    .content{
      padding:18px 16px 50px;
      padding-bottom:max(50px, calc(env(safe-area-inset-bottom) + 24px));

    /* Form fields at 16px stop iOS Safari auto-zooming the page in when you tap
       into one (anything under 16px triggers it) — desktop keeps the tighter 13px. */
    .field input, .field select, .field textarea, table.profile-table input{ font-size:16px; padding:11px 12px; }

    /* The small reorder/delete icon buttons scattered through Categories, Budget
       and the giver register are comfortably clickable with a mouse but too small
       to reliably tap — enlarge just the tappable area, not the visual weight. */
    .btn-reorder{ width:34px; height:34px; font-size:13px; }
    .row-del-btn{ width:26px; height:26px; font-size:13px; }

    /* .chip button above (for the small × remove buttons in a chip) is more specific
       than .btn-reorder alone, so it would otherwise win over the heading ▲▼ buttons
       that also live inside a .chip on the Categories page — restate it here at
       matching specificity so those keep the larger 34px tap target too. */
    .chip .btn-reorder{ width:32px; height:32px; }

       place left where content could otherwise start right under the notch/Dynamic
       Island once installed as a full-screen app. */
    .home-wrap{ padding-top:max(48px, calc(env(safe-area-inset-top) + 20px)); }

       fits, and let the name itself wrap/truncate rather than the row overflow. */

      (printable ? '<button class="btn btn-ghost btn-sm no-print" type="button" style="align-self:center;" data-action="print-page">🖨 Print</button>' : '') +
      '</div>' +
      (printable ? '<div class="print-only print-header"><div class="print-org">'+esc(entName)+' <span style="font-weight:400;">— '+esc(cfg.label)+'</span></div>' +
        '<div class="print-title">'+esc(title)+(sub?' — '+esc(sub):'')+'</div>' +
        '<div class="print-date">Printed '+new Date().toLocaleString('en-GB')+'</div></div>' : '');
  }
  function stat(label, value, hint, kind){
    return '<div class="panel stat'+(kind?' '+kind:'')+'"><div class="label">'+esc(label)+'</div>' +
      '<div class="stat-value">'+esc(value)+'</div>' + (hint?'<div class="hint">'+esc(hint)+'</div>':'') + '</div>';
  }
  function renderUnavailable(){
    return topbar('Storage unavailable','This browser is blocking local storage') +
      '<div class="content"><div class="panel panel-pad"><div class="banner warn">' +
      '⚠ This browser (or a private/incognito window) is blocking local storage, so entries won’t be saved once you close this page. ' +
      'Try a normal browser window, or check your browser’s site-data settings, then reload this file.' +
      '</div></div></div>';
  }

  /* ================== Invoices & Receipts (shared documents module) ==================
     One shared feature used identically by BusinessEngine, PersonalEngine and FundEngine —
     lives here rather than inside any one engine so all three entity kinds get it for free.
     Each entity keeps its own "documents" collection (namespaced like everything else via
     ns('documents')); each engine just needs to: subscribe that collection in its own
     subscribeAll(), add a nav item + 'documents'/'documentForm'/'documentView' entries to its
     render() dispatch table, and call bindDocumentHandlers() at the end of its own
     bindHandlers(). A document is either a "receipt" (money already received — no workflow,
     just a record) or an "invoice" (a bill requesting future payment — draft → sent → paid). */

  function docNumberPrefix(kind){ return kind==='invoice' ? 'INV-' : 'RCT-'; }
  /* Numbers per kind, per entity — scans this entity's own state.documents (never global),
     so Bizcentre's INV-0001 and BEST's INV-0001 are unrelated numbers in unrelated books. */
  function nextDocNumber(kind){
    var max = 0;
    state.documents.forEach(function(d){
      if(d.kind !== kind) return;
      var m = /(\d+)\s*$/.exec(String(d.number||''));
      if(m){ var n = parseInt(m[1],10); if(n>max) max = n; }
    });
    return docNumberPrefix(kind) + ('0000'+(max+1)).slice(-4);
  }
  function computeDocTotals(items, taxRate){
    var subtotal = sumBy(items||[], function(it){ return (Number(it.qty)||0) * (Number(it.unitPrice)||0); });
    var taxAmount = subtotal * (Number(taxRate)||0);
    return { subtotal:subtotal, taxAmount:taxAmount, total:subtotal+taxAmount };
  }
  function docStatusMeta(status){
    return { draft:{label:'Draft', cls:'flat'}, sent:{label:'Sent', cls:'over'},
      paid:{label:'Paid', cls:'good'}, issued:{label:'Issued', cls:'good'} }[status] || {label:status, cls:'flat'};
  }
  function renderDocStatusPill(status){
    var m = docStatusMeta(status);
    return '<span class="pill-status '+m.cls+'">'+esc(m.label)+'</span>';
  }

  /* ---- starting a draft (fresh, or pre-filled from an existing income entry) ---- */
  function startNewDocument(kind){
    state.docForm = {
      id:null, kind:kind, number:nextDocNumber(kind),
      date:todayISO(), dueDate:'',
      billTo:'', billToAddress:'', billToEmail:'',
      items:[{ desc:'', qty:1, unitPrice:0 }],
      taxRate:0, notes:'',
      status: kind==='invoice' ? 'draft' : 'issued',
      linkedIncomeId:null
    };
    state.editingDocId = null;
    state.view = 'documentForm';
    render();
  }
  /* Called from each engine's income-row "🧾" quick action. Deliberately takes plain values
     (billTo/description/amount/date) rather than the raw entry object, since each engine's
     income entries carry different fields (e.g. only FundEngine's have a giverName) — the
     calling engine picks the right fields, this stays engine-agnostic. */
  function startDocFromEntry(kind, opts){
    opts = opts || {};
    state.docForm = {
      id:null, kind:kind, number:nextDocNumber(kind),
      date: opts.date || todayISO(), dueDate:'',
      billTo: opts.billTo || '', billToAddress:'', billToEmail:'',
      items:[{ desc: opts.description || (kind==='invoice'?'Invoice item':'Payment received'), qty:1, unitPrice: Number(opts.amount)||0 }],
      taxRate:0, notes:'',
      status: kind==='invoice' ? 'draft' : 'issued',
      linkedIncomeId: opts.linkedIncomeId || null
    };
    state.editingDocId = null;
    state.view = 'documentForm';
    render();
  }
  function startEditDocument(id){
    var doc = state.documents.find(function(d){ return d.id===id; });
    if(!doc) return;
    state.docForm = Object.assign({}, doc, { items:(doc.items||[]).map(function(it){ return Object.assign({}, it); }) });
    state.editingDocId = id;
    state.view = 'documentForm';
    render();
  }
  function cancelDocumentForm(){
    state.docForm = null; state.editingDocId = null;
    state.view = 'documents';
    render();
  }
  function addDocLineItem(){
    if(!state.docForm) return;
    state.docForm.items.push({ desc:'', qty:1, unitPrice:0 });
    render();
  }
  function removeDocLineItem(idx){
    if(!state.docForm) return;
    state.docForm.items.splice(idx,1);
    if(!state.docForm.items.length) state.docForm.items.push({ desc:'', qty:1, unitPrice:0 });
    render();
  }
  /* Recomputes the per-row amount + totals directly in the DOM, without a full render() —
     called on every keystroke in a line-item field. A full render() there would rebuild the
     whole form from innerHTML and drop focus/cursor position mid-keystroke (the same class of
     bug the giverProfiles reactive-render guard exists to avoid elsewhere in this app). */
  function recomputeDocFormTotals(){
    var f = state.docForm;
    if(!f) return;
    Array.prototype.forEach.call(app.querySelectorAll('.doc-item-row'), function(row){
      var idx = Number(row.getAttribute('data-item-idx'));
      var it = f.items[idx];
      if(!it) return;
      var amount = (Number(it.qty)||0) * (Number(it.unitPrice)||0);
      var cell = row.querySelector('.doc-item-amount');
      if(cell) cell.textContent = fmtMoney(amount);
    });
    var totals = computeDocTotals(f.items, f.taxRate);
    var subCell = document.getElementById('doc-subtotal-cell'); if(subCell) subCell.textContent = fmtMoney(totals.subtotal);
    var taxCell = document.getElementById('doc-tax-cell'); if(taxCell) taxCell.textContent = fmtMoney(totals.taxAmount);
    var totCell = document.getElementById('doc-total-cell'); if(totCell) totCell.innerHTML = '<strong>'+fmtMoney(totals.total)+'</strong>';
  }
  function saveDocumentForm(){
    var f = state.docForm;
    if(!f) return;
    var date = document.getElementById('doc-date').value;
    var dueDateEl = document.getElementById('doc-duedate');
    var dueDate = dueDateEl ? dueDateEl.value : '';
    var billTo = document.getElementById('doc-billto').value.trim();
    var billToAddress = document.getElementById('doc-billto-address').value.trim();
    var billToEmail = document.getElementById('doc-billto-email').value.trim();
    var taxRate = (parseFloat(document.getElementById('doc-taxrate').value)||0) / 100;
    var notes = document.getElementById('doc-notes').value.trim();
    var items = f.items
      .map(function(it){ return { desc:String(it.desc||'').trim(), qty:Number(it.qty)||0, unitPrice:Number(it.unitPrice)||0 }; })
      .filter(function(it){ return it.desc || (it.qty>0 && it.unitPrice>0); });
    if(!date || !billTo || !items.length){ toast('Add a date, who this is for, and at least one line item.'); return; }
    var totals = computeDocTotals(items, taxRate);
    var record = {
      kind:f.kind, number:f.number, date:date, dueDate:dueDate,
      billTo:billTo, billToAddress:billToAddress, billToEmail:billToEmail,
      items:items, taxRate:taxRate, notes:notes,
      subtotal:totals.subtotal, taxAmount:totals.taxAmount, total:totals.total,
      status:f.status, linkedIncomeId: f.linkedIncomeId || null,
      updatedAt:new Date().toISOString()
    };
    function done(label){
      toast((f.kind==='invoice'?'Invoice ':'Receipt ')+f.number+' '+label+'.');
      state.docForm = null; state.editingDocId = null; state.view = 'documents';
      render();
    }
    if(f.id){
      col.documents.doc(f.id).update(record).then(function(){ done('updated'); }).catch(function(){ toast('Could not save — try again.'); });
    } else {
      record.createdAt = new Date().toISOString();
      col.documents.add(record).then(function(){ done('saved'); }).catch(function(){ toast('Could not save — try again.'); });
    }
  }
  function deleteDocument(id){
    if(!confirm('Delete this document? This cannot be undone.')) return;
    col.documents.doc(id).delete().then(function(){
      if(state.editingDocId===id){ state.docForm = null; state.editingDocId = null; }
      if(state.viewingDocId===id){ state.viewingDocId = null; state.view = 'documents'; }
      toast('Deleted.');
    }).catch(function(){ toast('Could not delete — try again.'); });
  }
  function setDocStatus(id, status){
    col.documents.doc(id).update({ status:status, updatedAt:new Date().toISOString() })
      .then(function(){ toast('Marked as '+docStatusMeta(status).label.toLowerCase()+'.'); })
      .catch(function(){ toast('Could not update — try again.'); });
  }
  function viewDocument(id){
    state.viewingDocId = id;
    state.view = 'documentView';
    render();
  }

  /* ---- list ---- */
  function renderDocumentsList(){
    var q = (state.docSearch||'').trim().toLowerCase();
    var typeFilter = state.docTypeFilter || '';
    var statusFilter = state.docStatusFilter || '';
    var list = state.documents.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''); });
    if(typeFilter) list = list.filter(function(d){ return d.kind===typeFilter; });
    if(statusFilter) list = list.filter(function(d){ return d.status===statusFilter; });
    if(q) list = list.filter(function(d){ return (d.number||'').toLowerCase().indexOf(q)>-1 || (d.billTo||'').toLowerCase().indexOf(q)>-1; });
    var outstanding = sumBy(state.documents.filter(function(d){ return d.kind==='invoice' && d.status!=='paid'; }), function(d){ return d.total; });

    var rows = list.length ? list.map(function(d){
      return '<tr>' +
        '<td>'+esc(d.number)+'</td>' +
        '<td><span class="pill">'+(d.kind==='invoice'?'Invoice':'Receipt')+'</span></td>' +
        '<td>'+fmtDate(d.date)+'</td>' +
        '<td>'+esc(d.billTo||'—')+'</td>' +
        '<td class="num-col">'+fmtMoney(d.total)+'</td>' +
        '<td>'+renderDocStatusPill(d.status)+'</td>' +
        '<td class="actions">' +
          '<button class="btn btn-ghost btn-sm" type="button" data-view-doc="'+d.id+'">View</button> ' +
          (d.kind==='invoice' && d.status==='draft' ? '<button class="btn btn-ghost btn-sm" type="button" data-edit-doc="'+d.id+'">Edit</button> ' : '') +
          '<button class="btn btn-ghost btn-sm" type="button" data-del-doc="'+d.id+'">Delete</button>' +
        '</td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="7"><div class="empty">'+(q||typeFilter||statusFilter?'No documents match.':'No invoices or receipts yet — create one below, or generate a receipt straight from an income entry.')+'</div></td></tr>';

    return topbar('Invoices & Receipts', list.length+' document'+(list.length===1?'':'s')+(outstanding>0.005?' · '+fmtMoney(outstanding)+' outstanding':'')) +
      '<div class="content">' +
        '<div class="panel panel-pad no-print">' +
          '<div class="toolbar">' +
            '<button class="btn btn-primary btn-sm" type="button" data-action="new-invoice">＋ New Invoice</button>' +
            '<button class="btn btn-ghost btn-sm" type="button" data-action="new-receipt">＋ New Receipt</button>' +
            '<div class="search-box"><input type="text" id="doc-search" placeholder="Search number or name…" value="'+esc(state.docSearch||'')+'"></div>' +
            '<select id="doc-type-filter"><option value=""'+(!typeFilter?' selected':'')+'>All types</option><option value="invoice"'+(typeFilter==='invoice'?' selected':'')+'>Invoices</option><option value="receipt"'+(typeFilter==='receipt'?' selected':'')+'>Receipts</option></select>' +
            '<select id="doc-status-filter"><option value=""'+(!statusFilter?' selected':'')+'>All statuses</option><option value="draft"'+(statusFilter==='draft'?' selected':'')+'>Draft</option><option value="sent"'+(statusFilter==='sent'?' selected':'')+'>Sent</option><option value="paid"'+(statusFilter==='paid'?' selected':'')+'>Paid</option><option value="issued"'+(statusFilter==='issued'?' selected':'')+'>Issued</option></select>' +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:14px;"><div class="panel-pad">' +
          '<div class="table-wrap"><table class="ledger"><thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Billed To</th><th style="text-align:right;">Total</th><th>Status</th><th></th></tr></thead>' +
          '<tbody>'+rows+'</tbody></table></div>' +
        '</div></div>' +
      '</div>';
  }

    var totals = computeDocTotals(f.items, f.taxRate);
    var itemRows = f.items.map(function(it, idx){
      var amount = (Number(it.qty)||0) * (Number(it.unitPrice)||0);
      return '<tr class="doc-item-row" data-item-idx="'+idx+'">' +
        '<td><input type="text" class="doc-item-desc" data-idx="'+idx+'" placeholder="Description" value="'+esc(it.desc||'')+'"></td>' +
        '<td><input type="number" class="doc-item-qty" data-idx="'+idx+'" min="0" step="0.01" value="'+esc(it.qty)+'" style="width:72px;"></td>' +
        '<td><input type="number" class="doc-item-price" data-idx="'+idx+'" min="0" step="0.01" value="'+esc(it.unitPrice)+'" style="width:100px;"></td>' +
        '<td class="num-col doc-item-amount">'+fmtMoney(amount)+'</td>' +
        '<td class="actions"><button type="button" class="btn btn-ghost btn-sm" data-remove-item="'+idx+'">✕</button></td>' +

    return topbar((f.id?'Edit ':'New ')+(isInvoice?'Invoice':'Receipt')+' — '+esc(f.number)) +

            '<div class="table-wrap"><table class="ledger doc-items"><thead><tr><th>Description</th><th>Qty</th><th style="text-align:right;">Unit price</th><th style="text-align:right;">Amount</th><th></th></tr></thead>' +
            '<tbody>'+itemRows+'</tbody>' +
            '<tfoot>' +
              '<tr><td colspan="3">Subtotal</td><td class="num-col" id="doc-subtotal-cell">'+fmtMoney(totals.subtotal)+'</td><td></td></tr>' +
              '<tr><td colspan="3">Tax</td><td class="num-col" id="doc-tax-cell">'+fmtMoney(totals.taxAmount)+'</td><td></td></tr>' +
              '<tr><td colspan="3"><strong>Total</strong></td><td class="num-col" id="doc-total-cell"><strong>'+fmtMoney(totals.total)+'</strong></td><td></td></tr>' +
            '</tfoot></table></div>' +

              '<button class="btn btn-ghost" type="button" data-action="cancel-doc-form">Cancel</button>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>';
  }

  /* ---- single document view / print ---- */
  function renderDocumentView(){

  /* ---- handlers — called once at the end of every engine's own bindHandlers() ---- */
  function bindDocumentHandlers(){
    var newInvBtn = app.querySelector('[data-action="new-invoice"]');
    if(newInvBtn) newInvBtn.addEventListener('click', function(){ startNewDocument('invoice'); });
    var newRcptBtn = app.querySelector('[data-action="new-receipt"]');
    if(newRcptBtn) newRcptBtn.addEventListener('click', function(){ startNewDocument('receipt'); });

    var docSearch = document.getElementById('doc-search');
    if(docSearch){
      docSearch.addEventListener('input', function(){
        state.docSearch = docSearch.value; render();
        var el = document.getElementById('doc-search');
        if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
      });
    }
    var docTypeFilter = document.getElementById('doc-type-filter');
    if(docTypeFilter){ docTypeFilter.addEventListener('change', function(){ state.docTypeFilter = docTypeFilter.value; render(); }); }
    var docStatusFilter = document.getElementById('doc-status-filter');
    if(docStatusFilter){ docStatusFilter.addEventListener('change', function(){ state.docStatusFilter = docStatusFilter.value; render(); }); }

    Array.prototype.forEach.call(app.querySelectorAll('[data-view-doc]'), function(btn){
      btn.addEventListener('click', function(){ viewDocument(btn.getAttribute('data-view-doc')); });
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-edit-doc]'), function(btn){
      btn.addEventListener('click', function(){ startEditDocument(btn.getAttribute('data-edit-doc')); });
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-del-doc]'), function(btn){
      btn.addEventListener('click', function(){ deleteDocument(btn.getAttribute('data-del-doc')); });
    });
    var markSent = app.querySelector('[data-action="mark-sent"]');
    if(markSent) markSent.addEventListener('click', function(){ setDocStatus(markSent.getAttribute('data-doc-id'), 'sent'); });
    var markPaid = app.querySelector('[data-action="mark-paid"]');
    if(markPaid) markPaid.addEventListener('click', function(){ setDocStatus(markPaid.getAttribute('data-doc-id'), 'paid'); });
    var backToDocs = app.querySelector('[data-action="back-to-docs"]');
    if(backToDocs) backToDocs.addEventListener('click', function(){ state.view = 'documents'; render(); });

    var docForm = document.getElementById('doc-form');
    if(docForm){ docForm.addEventListener('submit', function(ev){ ev.preventDefault(); saveDocumentForm(); }); }
    var cancelDocForm = app.querySelector('[data-action="cancel-doc-form"]');
    if(cancelDocForm) cancelDocForm.addEventListener('click', function(){ cancelDocumentForm(); });
    var addDocItem = app.querySelector('[data-action="add-doc-item"]');
    if(addDocItem) addDocItem.addEventListener('click', function(){ addDocLineItem(); });
    Array.prototype.forEach.call(app.querySelectorAll('[data-remove-item]'), function(btn){
      btn.addEventListener('click', function(){ removeDocLineItem(Number(btn.getAttribute('data-remove-item'))); });
    });
    var docItemsTable = app.querySelector('table.doc-items');
    if(docItemsTable){
      docItemsTable.addEventListener('input', function(ev){
        var idx = ev.target.getAttribute('data-idx');
        if(idx==null || !state.docForm) return;
        idx = Number(idx);
        var it = state.docForm.items[idx];
        if(!it) return;
        if(ev.target.classList.contains('doc-item-desc')) it.desc = ev.target.value;
        else if(ev.target.classList.contains('doc-item-qty')) it.qty = ev.target.value;
        else if(ev.target.classList.contains('doc-item-price')) it.unitPrice = ev.target.value;
        recomputeDocFormTotals();
      });
    }
    var taxRateInput = document.getElementById('doc-taxrate');
    if(taxRateInput){
      taxRateInput.addEventListener('input', function(){
        if(state.docForm) state.docForm.taxRate = (parseFloat(taxRateInput.value)||0) / 100;
        recomputeDocFormTotals();
      });
    }
    /* Keep every other top-level field of the form synced into state.docForm as the user
       types too — not just read at submit time — because clicking "+ Add line" or a line's
       "✕" (addDocLineItem/removeDocLineItem) does a full render() to rebuild the item rows,
       which rebuilds this WHOLE form from state.docForm and would otherwise blank out
       whatever had been typed into these plain fields (they're only pre-filled from
       state.docForm on the initial render, same pattern as the rest of this app's forms). */
    ['doc-date','doc-duedate','doc-billto','doc-billto-address','doc-billto-email','doc-notes'].forEach(function(id){
      var field = { 'doc-date':'date', 'doc-duedate':'dueDate', 'doc-billto':'billTo',
        'doc-billto-address':'billToAddress', 'doc-billto-email':'billToEmail', 'doc-notes':'notes' }[id];
      var el = document.getElementById(id);
      if(el){ el.addEventListener('input', function(){ if(state.docForm) state.docForm[field] = el.value; }); }
    });

    /* The "🧾" quick action on an income row (added by each engine's own renderIncome) —
       bound generically here, by reading whatever fields the row's data attributes carry,
       so this one handler works the same for all three engines' differently-shaped entries. */
    Array.prototype.forEach.call(app.querySelectorAll('[data-receipt-from]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-receipt-from');
        var entry = state.incomeEntries.find(function(e){ return e.id===id; });
        if(!entry) return;
        startDocFromEntry('receipt', {
          billTo: entry.giverName || entry.description || '',
          description: entry.description || entry.categoryName || 'Payment received',
          amount: entry.amount, date: entry.date, linkedIncomeId: entry.id
        });
      });
    });
  }
  /* ================== BusinessEngine ==================
     Drives both "company" and "soleTrader" entities. Every place the two types differ (equity
     model, Corporation Tax, labels) is read from entityConfig(state.currentEntityType) — nothing
     here is hardcoded to one type. Fiscal year start month is configurable per entity
     (state.settings.main.fyStartMonth, 1-12) rather than fixed, so any year-end works. */
  var BusinessEngine = (function(){

    var MONTH_NAMES_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function fyStartMonthIdx(){ return (Number(state.settings.main.fyStartMonth)||1) - 1; }
    function fiscalYearKey(iso){
      var d = new Date(iso+'T00:00:00');
      if(isNaN(d)) return String(new Date().getFullYear());
      var y = d.getFullYear(), m = d.getMonth();
      var startIdx = fyStartMonthIdx();
      return String(m>=startIdx ? y : y-1);
    }
    function fyStart(key){ return key+'-'+pad2(fyStartMonthIdx()+1)+'-01'; }
    function fyEnd(key){ return dayBefore(fyStart(String(Number(key)+1))); }
    function fiscalYearLabel(key){
      var idx = fyStartMonthIdx(), y = Number(key);
      if(idx===0) return key;
      var endIdx = (idx+11)%12;
      return MONTH_NAMES_SHORT[idx]+' '+y+' – '+MONTH_NAMES_SHORT[endIdx]+' '+(y+1);
    }
    function availableYears(){
      var keys = {}; keys[fiscalYearKey(todayISO())] = true;
      state.incomeEntries.forEach(function(e){ if(e.date) keys[fiscalYearKey(e.date)] = true; });
      state.expenseEntries.forEach(function(e){ if(e.date) keys[fiscalYearKey(e.date)] = true; });
      state.assets.forEach(function(a){ if(a.dateAcquired) keys[fiscalYearKey(a.dateAcquired)] = true; });
      state.loanTransactions.forEach(function(t){ if(t.date) keys[fiscalYearKey(t.date)] = true; });
      state.equityEntries.forEach(function(e){ if(e.date) keys[fiscalYearKey(e.date)] = true; });
      return Object.keys(keys).sort(function(a,b){ return Number(a)-Number(b); });
    }
    function latestYear(){ var ys = availableYears(); return ys[ys.length-1] || fiscalYearKey(todayISO()); }
    function currentYear(){ return state.selectedYear || latestYear(); }
    function asAtLabel(year){ return year===fiscalYearKey(todayISO()) ? 'today' : fmtDate(fyEnd(year)); }
    function entriesInYear(list, year){ return list.filter(function(e){ return fiscalYearKey(e.date)===year; }); }
    function fiscalYearsBefore(year){ return availableYears().filter(function(y){ return Number(y) < Number(year); }); }
    function prevYearKey(year){ return String(Number(year)-1); }

    function catListFor(kind){ return kind==='income'?state.incomeCats:state.expenseCats; }
    function catColFor(kind){ return kind==='income'?col.incomeCats:col.expenseCats; }
    function entriesFor(kind){ return kind==='income'?state.incomeEntries:state.expenseEntries; }
    function groupsFor(kind){ return kind==='income'?BUSINESS_INCOME_GROUPS:BUSINESS_EXPENSE_GROUPS; }

    function categoryRows(entries, cats){
      var byId = {};
      cats.forEach(function(c){ byId[c.id] = { id:c.id, name:c.name, group:c.group||'', order:c.order||0, total:0 }; });
      entries.forEach(function(e){
        var row = byId[e.categoryId];
        if(!row){ row = byId[e.categoryId] = { id:e.categoryId, name:(e.categoryName||'Unfiled')+' (removed)', group:'', order:9999, total:0 }; }
        row.total += Number(e.amount)||0;
      });
      return Object.keys(byId).map(function(k){ return byId[k]; }).sort(function(a,b){ return a.order-b.order; });
    }
    function groupTotalsFor(entries, cats, groupList){
      var catById = {};
      cats.forEach(function(c){ catById[c.id] = c; });
      var totals = {};
      groupList.forEach(function(g){ totals[g] = 0; });
      entries.forEach(function(e){
        var c = catById[e.categoryId];
        var g = c ? c.group : null;
        if(g && totals.hasOwnProperty(g)) totals[g] += Number(e.amount)||0;
      });
      return groupList.map(function(g){ return { group:g, total:totals[g] }; });
    }
    function groupTotal(entries, cats, groupName){
      var rows = groupTotalsFor(entries, cats, [groupName]);
      return rows[0] ? rows[0].total : 0;
    }
    function ledgerCategoryAccounts(kind, year){
      var cats = catListFor(kind);
      var entries = entriesInYear(entriesFor(kind), year);
      var byId = {};
      entries.forEach(function(e){ (byId[e.categoryId] = byId[e.categoryId]||[]).push(e); });
      var groups = groupsFor(kind);
      return groups.map(function(g){
        var accounts = cats.filter(function(c){ return c.group===g && byId[c.id] && byId[c.id].length; })
          .map(function(c){
            var list = byId[c.id].slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
            return { name:c.name, entries:list, total: sumBy(list, function(e){ return e.amount; }) };
          }).sort(function(a,b){ return a.name.localeCompare(b.name); });
        return { group:g, accounts:accounts, total: sumBy(accounts, function(a){ return a.total; }) };
      }).filter(function(g){ return g.accounts.length; });
    }

    /* ---------------- Fixed Assets & depreciation ---------------- */
    function depRateFor(category){ return Number((state.settings.main.depreciationRates||{})[category])||0; }
    function monthsBetweenInclusive(startISO, endISO){
      var s = new Date(startISO+'T00:00:00'), e = new Date(endISO+'T00:00:00');
      if(isNaN(s)||isNaN(e)||e<s) return 0;
      return (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth()) + 1;
    }
    function assetAnnualDep(asset){ return (Number(asset.cost)||0) * depRateFor(asset.category); }
    function assetMonthlyDep(asset){ return assetAnnualDep(asset)/12; }
    function assetAccumDepThrough(asset, asOfISO){
      if(!asset.dateAcquired || asOfISO < asset.dateAcquired) return 0;
      var months = monthsBetweenInclusive(asset.dateAcquired, asOfISO);
      var accum = assetMonthlyDep(asset) * months;
      return Math.min(accum, Number(asset.cost)||0);
    }
    function assetNBVThrough(asset, asOfISO){ return Math.max(0, (Number(asset.cost)||0) - assetAccumDepThrough(asset, asOfISO)); }
    function assetDepInYear(asset, year){
      return assetAccumDepThrough(asset, fyEnd(year)) - assetAccumDepThrough(asset, dayBefore(fyStart(year)));
    }
    function totalFixedAssetsNBV(asOfISO){ return sumBy(state.assets, function(a){ return assetNBVThrough(a, asOfISO); }); }
    function totalDepreciationInYear(year){ return sumBy(state.assets, function(a){ return assetDepInYear(a, year); }); }
    function assetsByCategoryNBV(asOfISO){
      return ASSET_CATEGORIES.map(function(cat){
        var list = state.assets.filter(function(a){ return a.category===cat; });
        return { category:cat, cost: sumBy(list, function(a){return a.cost;}), nbv: sumBy(list, function(a){ return assetNBVThrough(a, asOfISO); }) };
      });
    }

    /* ---------------- Loans ---------------- */
    function loanTxsFor(loanId){ return state.loanTransactions.filter(function(t){ return t.loanId===loanId; }); }
    function loanBalanceThrough(loan, asOfISO){
      var bal = Number(loan.openingBalance)||0;
      loanTxsFor(loan.id).filter(function(t){ return t.date && t.date<=asOfISO; }).forEach(function(t){
        if(t.type==='drawdown') bal += Number(t.capitalAmount)||0;
        else bal -= Number(t.capitalAmount)||0;
      });
      return bal;
    }
    function totalLoanBalanceThrough(asOfISO){ return sumBy(state.loans, function(l){ return loanBalanceThrough(l, asOfISO); }); }
    function loanTxsInYear(year, type){
      return state.loanTransactions.filter(function(t){ return t.type===type && fiscalYearKey(t.date)===year; });
    }
    function loanDrawdownsInYear(year){ return sumBy(loanTxsInYear(year,'drawdown'), function(t){ return t.capitalAmount; }); }
    function loanRepaymentsCapitalInYear(year){ return sumBy(loanTxsInYear(year,'repayment'), function(t){ return t.capitalAmount; }); }
    function loanInterestInYear(year){ return sumBy(loanTxsInYear(year,'repayment'), function(t){ return t.interestAmount; }); }

    /* ---------------- Equity / Capital Account ----------------
       Which type names are "contributions" vs "withdrawals" comes from entityConfig — a Private
       Company's Dividend Paid and a Sole Proprietorship's Drawings are the same mechanic
       (money leaving to the owner(s)), just under a different name. */
    function isWithdrawal(type){ return currentConfig().withdrawalTypes.indexOf(type) > -1; }
    function equityByType(type, throughISO){
      return sumBy(state.equityEntries.filter(function(e){ return e.type===type && (!throughISO || e.date<=throughISO); }), function(e){ return e.amount; });
    }
    function equityInYear(type, year){
      return sumBy(state.equityEntries.filter(function(e){ return e.type===type && fiscalYearKey(e.date)===year; }), function(e){ return e.amount; });
    }

    /* ---------------- unified cash-transaction feed (General Ledger & Bank Reconciliation) ---------------- */
    function cashAsOf(asOfISO){
      var c = Number(state.settings.main.openingCash)||0;
      c += sumBy(state.incomeEntries.filter(function(e){ return e.date<=asOfISO; }), function(e){ return e.amount; });
      c -= sumBy(state.expenseEntries.filter(function(e){ return e.date<=asOfISO; }), function(e){ return e.amount; });
      c -= sumBy(state.assets.filter(function(a){ return a.dateAcquired && a.dateAcquired<=asOfISO; }), function(a){ return a.cost; });
      state.loanTransactions.filter(function(t){ return t.date && t.date<=asOfISO; }).forEach(function(t){
        if(t.type==='drawdown') c += Number(t.capitalAmount)||0;
        else c -= (Number(t.capitalAmount)||0) + (Number(t.interestAmount)||0);
      });
      state.equityEntries.filter(function(e){ return e.date && e.date<=asOfISO; }).forEach(function(e){
        if(isWithdrawal(e.type)) c -= Number(e.amount)||0;
        else c += Number(e.amount)||0;
      });
      return c;
    }
    function allCashMovements(){
      var out = [];
      state.incomeEntries.forEach(function(e){
        out.push({ date:e.date, colName:'incomeEntries', id:e.id, cleared:!!e.cleared,
          label:'Income — '+(e.categoryName||'Unfiled')+(e.description?' ('+e.description+')':''),
          amount: Number(e.amount)||0 });
      });
      state.expenseEntries.forEach(function(e){
        out.push({ date:e.date, colName:'expenseEntries', id:e.id, cleared:!!e.cleared,
          label:'Expenditure — '+(e.categoryName||'Unfiled')+(e.payee?' ('+e.payee+')':(e.description?' ('+e.description+')':'')),
          amount: -(Number(e.amount)||0) });
      });
      state.assets.forEach(function(a){
        if(!a.dateAcquired) return;
        out.push({ date:a.dateAcquired, colName:'assets', id:a.id, cleared:!!a.cleared,
          label:'Fixed asset purchase — '+(a.description||a.category), amount: -(Number(a.cost)||0) });
      });
      state.loanTransactions.forEach(function(t){
        var loan = state.loans.find(function(l){ return l.id===t.loanId; });
        var lender = loan ? loan.lender : 'Loan';
        if(t.type==='drawdown'){
          out.push({ date:t.date, colName:'loanTransactions', id:t.id, cleared:!!t.cleared,
            label:'Loan drawdown — '+lender, amount: Number(t.capitalAmount)||0 });
        } else {
          out.push({ date:t.date, colName:'loanTransactions', id:t.id, cleared:!!t.cleared,
            label:'Loan repayment — '+lender+' (capital + interest)',
            amount: -((Number(t.capitalAmount)||0) + (Number(t.interestAmount)||0)) });
        }
      });
      state.equityEntries.forEach(function(e){
        var amt = isWithdrawal(e.type) ? -(Number(e.amount)||0) : (Number(e.amount)||0);
        out.push({ date:e.date, colName:'equityEntries', id:e.id, cleared:!!e.cleared,
          label:e.type+(e.note?' ('+e.note+')':''), amount: amt });
      });
      return out.filter(function(m){ return m.date; }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    }
    function cashMovementsThrough(asOfISO){ return allCashMovements().filter(function(m){ return m.date<=asOfISO; }); }
    function bankRecFor(statementDate){
      var bookBalance = cashAsOf(statementDate);
      var outstanding = cashMovementsThrough(statementDate).filter(function(m){ return !m.cleared; });
      var unclearedReceipts = sumBy(outstanding.filter(function(m){ return m.amount>0; }), function(m){ return m.amount; });
      var unclearedPayments = sumBy(outstanding.filter(function(m){ return m.amount<0; }), function(m){ return -m.amount; });
      var expectedBankBalance = bookBalance - unclearedReceipts + unclearedPayments;
      return { statementDate:statementDate, bookBalance:bookBalance, outstanding:outstanding,
        unclearedReceipts:unclearedReceipts, unclearedPayments:unclearedPayments, expectedBankBalance:expectedBankBalance };
    }

    /* ---------------- Profit & Loss ---------------- */
    function plFor(year){
      var cfg = currentConfig();
      var incEntries = entriesInYear(state.incomeEntries, year);
      var expEntries = entriesInYear(state.expenseEntries, year);
      var incGroupTotals = groupTotalsFor(incEntries, state.incomeCats, BUSINESS_INCOME_GROUPS);
      var totalRevenue = sumBy(incGroupTotals, function(g){ return g.total; });
      var cogs = groupTotal(expEntries, state.expenseCats, 'COST OF GOODS SOLD (COGS)');
      var grossProfit = totalRevenue - cogs;
      var opexTotals = groupTotalsFor(expEntries, state.expenseCats, OPEX_GROUPS);
      var totalOpex = sumBy(opexTotals, function(g){ return g.total; });
      var ebitda = grossProfit - totalOpex;
      var depreciation = totalDepreciationInYear(year);
      var ebit = ebitda - depreciation;
      var financeCostsManual = groupTotal(expEntries, state.expenseCats, 'FINANCE & BANKING');
      var loanInterest = loanInterestInYear(year);
      var totalFinanceCosts = financeCostsManual + loanInterest;
      var pbt = ebit - totalFinanceCosts;
      var corpTax = cfg.hasCorpTax ? Math.max(0,pbt) * (Number(state.settings.main.corpTaxRate)||0) : 0;
      var netProfit = pbt - corpTax;
      return {
        year: year, incGroupTotals: incGroupTotals, totalRevenue: totalRevenue,
        cogs: cogs, grossProfit: grossProfit,
        opexTotals: opexTotals, totalOpex: totalOpex, ebitda: ebitda,
        depreciation: depreciation, ebit: ebit,
        financeCostsManual: financeCostsManual, loanInterest: loanInterest, totalFinanceCosts: totalFinanceCosts,
        pbt: pbt, corpTax: corpTax, netProfit: netProfit
      };
    }
    /* Rolls every PRIOR fiscal year's profit and equity movements into one opening figure —
       for a Company this is "Retained Earnings brought forward" (share capital/premium/other
       reserves keep their OWN separate running balance, added on top in balanceSheetFor); for a
       Sole Proprietorship this IS the whole Capital Account brought forward, since a sole
       trader has no separate "share capital" concept — capital introduced simply folds straight in. */
    function retainedEarningsBF(year){
      var cfg = currentConfig();
      var opening = Number(state.settings.main.openingRetainedEarnings)||0;
      return opening + sumBy(fiscalYearsBefore(year), function(y){
        var p = plFor(y);
        var withdrawn = sumBy(cfg.withdrawalTypes, function(t){ return equityInYear(t, y); });
        var contributed = cfg.equityModel==='capitalAccount' ? sumBy(cfg.contributionTypes, function(t){ return equityInYear(t, y); }) : 0;
        return p.netProfit - withdrawn + contributed;
      });
    }

    /* ---------------- Balance Sheet ---------------- */
    function balancesFor(year){
      return state.balances && state.balances._year===year ? state.balances : {
        tradeDebtors:0, prepayments:0, stockWIP:0, vatReceivable:0, otherDebtors:0,
        tradeCreditors:0, accruals:0, vatPayable:0, payeNicPayable:0, corpTaxPayable:0, otherCurrentLiabilities:0
      };
    }
    function balanceSheetFor(year){
      var cfg = currentConfig();
      var yEnd = fyEnd(year);
      var fixedAssetsNBV = totalFixedAssetsNBV(yEnd);
      var assetBreakdown = assetsByCategoryNBV(yEnd);
      var cash = cashAsOf(yEnd);
      var b = balancesFor(year);
      var totalCurrentAssets = cash + (Number(b.tradeDebtors)||0) + (Number(b.prepayments)||0) + (Number(b.stockWIP)||0) + (Number(b.vatReceivable)||0) + (Number(b.otherDebtors)||0);
      var totalCurrentLiabilities = (Number(b.tradeCreditors)||0) + (Number(b.accruals)||0) + (Number(b.vatPayable)||0) + (Number(b.payeNicPayable)||0) + (cfg.hasCorpTax?(Number(b.corpTaxPayable)||0):0) + (Number(b.otherCurrentLiabilities)||0);
      var totalLongTermLiabilities = totalLoanBalanceThrough(yEnd);
      var netAssets = fixedAssetsNBV + totalCurrentAssets - totalCurrentLiabilities - totalLongTermLiabilities;
      var pl = plFor(year);
      var retainedBF = retainedEarningsBF(year);
      var profitForPeriod = pl.netProfit;
      var thisYearWithdrawn = sumBy(cfg.withdrawalTypes, function(t){ return equityInYear(t, year); });
      var thisYearContributed = sumBy(cfg.contributionTypes, function(t){ return equityInYear(t, year); });
      var shareCapital=0, sharePremium=0, otherReserves=0, totalEquity;
      if(cfg.equityModel==='shareCapital'){
        shareCapital = equityByType('Share Capital Issued', yEnd);
        sharePremium = equityByType('Share Premium', yEnd);
        otherReserves = equityByType('Other Reserve Movement', yEnd);
        totalEquity = shareCapital + sharePremium + retainedBF + profitForPeriod - thisYearWithdrawn + otherReserves;
      } else {
        totalEquity = retainedBF + profitForPeriod + thisYearContributed - thisYearWithdrawn;
      }
      return {
        year: year, fixedAssetsNBV: fixedAssetsNBV, assetBreakdown: assetBreakdown, cash: cash, b: b,
        totalCurrentAssets: totalCurrentAssets, totalCurrentLiabilities: totalCurrentLiabilities,
        totalLongTermLiabilities: totalLongTermLiabilities, netAssets: netAssets,
        shareCapital: shareCapital, sharePremium: sharePremium, otherReserves: otherReserves,
        retainedBF: retainedBF, profitForPeriod: profitForPeriod,
        dividendsThisYear: thisYearWithdrawn, capitalIntroducedThisYear: thisYearContributed,
        totalEquity: totalEquity, variance: netAssets-totalEquity
      };
    }

    /* ---------------- Cash Flow Statement (direct method) ---------------- */
    function cashFlowFor(year){
      var cfg = currentConfig();
      var yStart = fyStart(year), yEnd = fyEnd(year), before = dayBefore(yStart);
      var opening = cashAsOf(before);
      var closing = cashAsOf(yEnd);
      var incEntries = entriesInYear(state.incomeEntries, year);
      var expEntries = entriesInYear(state.expenseEntries, year);
      var incByGroup = groupTotalsFor(incEntries, state.incomeCats, BUSINESS_INCOME_GROUPS);
      var totalReceipts = sumBy(incByGroup, function(g){ return g.total; });
      var operatingExpenseGroups = ['COST OF GOODS SOLD (COGS)'].concat(OPEX_GROUPS).concat(['FINANCE & BANKING','TAX & COMPLIANCE']);
      var expByGroup = groupTotalsFor(expEntries, state.expenseCats, operatingExpenseGroups);
      var totalPayments = sumBy(expByGroup, function(g){ return g.total; });
      var netOperating = totalReceipts - totalPayments;
      var depreciation = totalDepreciationInYear(year);
      var pl = plFor(year);
      var capex = sumBy(state.assets.filter(function(a){ return a.dateAcquired && fiscalYearKey(a.dateAcquired)===year; }), function(a){ return a.cost; });
      var netInvesting = -capex;
      var loanDraw = loanDrawdownsInYear(year), loanRepayCap = loanRepaymentsCapitalInYear(year), loanRepayInt = loanInterestInYear(year);
      var contributedIn = sumBy(cfg.contributionTypes, function(t){ return equityInYear(t, year); });
      var withdrawnOut = sumBy(cfg.withdrawalTypes, function(t){ return equityInYear(t, year); });
      var netFinancing = loanDraw - loanRepayCap - loanRepayInt + contributedIn - withdrawnOut;
      var netMovement = netOperating + netInvesting + netFinancing;
      return {
        year: year, opening: opening, closing: closing,
        incByGroup: incByGroup, totalReceipts: totalReceipts,
        expByGroup: expByGroup, totalPayments: totalPayments, netOperating: netOperating,
        depreciation: depreciation, ebit: pl.ebit,
        capex: capex, netInvesting: netInvesting,
        loanDraw: loanDraw, loanRepayCap: loanRepayCap, loanRepayInt: loanRepayInt,
        contributedIn: contributedIn, withdrawnOut: withdrawnOut, netFinancing: netFinancing,
        netMovement: netMovement, computedClosingCheck: opening + netMovement
      };
    }

    /* ---------------- Budget vs Actual ---------------- */
    function budgetDocId(year, kind, groupName){ return year+'_'+kind+'_'+groupName; }
    function budgetFor(kind, groupName, year){
      year = year || currentYear();
      var id = budgetDocId(year, kind, groupName);
      return state.budgets.find(function(b){ return b.id===id; });
    }
    function budgetedAmt(kind, groupName, year){ var b = budgetFor(kind, groupName, year); return b ? Number(b.target)||0 : 0; }
    function copyBudgetsForward(){
      var year = currentYear();
      var prevYear = String(Number(year)-1);
      var prevBudgets = state.budgets.filter(function(b){ return b.fiscalYear===prevYear; });
      if(!prevBudgets.length){ toast('No budget found for '+fiscalYearLabel(prevYear)+' to copy.'); return; }
      prevBudgets.forEach(function(b){
        col.budgets.doc(budgetDocId(year, b.kind, b.groupName)).set({
          kind:b.kind, groupName:b.groupName, target:b.target, fiscalYear:year, updatedAt:new Date().toISOString()
        });
      });
      toast('Copied '+prevBudgets.length+' budget line(s) from '+fiscalYearLabel(prevYear)+'.');
    }

    /* ---------------- render dispatch ---------------- */
    function render(){
      var nav = renderNav();
      var page;
      if(!state.dbAvailable){ page = renderUnavailable(); }
      else {
        page = ({
          overview: renderOverview, income: renderIncome, expense: renderExpense,
          assets: renderAssets, loans: renderLoans, equity: renderEquity,
          pl: renderPL, balance: renderBalanceSheet, cashflow: renderCashFlow, trial: renderTrialBalance,
          ledger: renderGeneralLedger, bankrec: renderBankRec,

    function renderYearSelect(){
      var years = availableYears();
      /* availableYears() always includes today's real-world fiscal year (even with
         no entries in it yet) plus every year that actually has data — but if the
         most recent year WITH data isn't today's fiscal year (e.g. FY2024 has
         filed accounts, it's now FY2026, and FY2025 sits empty in between,
         un-started), those two aren't adjacent and a plain "one before, one
         after" range leaves that empty year unreachable in the dropdown. Filling
         the whole span from one before the earliest to one after the latest
         guarantees every year in between — started or not — is always selectable. */
      var minY = Number(years[0]) - 1, maxY = Number(years[years.length-1]) + 1;
      var allYears = [];
      for(var y = minY; y <= maxY; y++) allYears.push(String(y));
      var sel = currentYear();
      if(allYears.indexOf(sel)===-1) allYears.push(sel);
      var opts = allYears.slice().reverse().map(function(y){
        var isNew = years.indexOf(y)===-1;
        var label = isNew ? '+ Start '+fiscalYearLabel(y) : fiscalYearLabel(y);
        return '<option value="'+y+'"'+(y===sel?' selected':'')+'>'+esc(label)+'</option>';
      }).join('');
      return '<select id="year-select" class="year-select" title="Switch financial year">'+opts+'</select>';
    }

      return topbar('Loans', state.loans.length + ' loan(s) · ' + fmtMoney(totalBalance) + ' outstanding as at ' + asAtLabel(year)) +
        '<div class="content">' +
          '<div class="panel panel-pad">' +
            '<div class="section-title"><h2>Add a loan</h2><span class="desc">Bank loans, finance leases and similar facilities</span></div>' +
            '<form class="entry-form" id="loan-form" autocomplete="off">' +
              '<div class="field wide"><label for="loan-lender">Lender</label><input type="text" id="loan-lender" placeholder="e.g. Lloyds Bank — Business Loan" required></div>' +

              '<div class="field"><label for="loan-start">Start date</label><input type="date" id="loan-start" required value="'+todayISO()+'"></div>' +
              '<div class="field wide"><label for="loan-note">Note (optional)</label><input type="text" id="loan-note" placeholder="e.g. term, rate"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">＋ Add loan</button></div>' +
