            '<form class="entry-form" id="loantx-form" autocomplete="off">' +
              '<div class="field"><label for="loantx-loan">Loan</label><select id="loantx-loan" required><option value="" disabled selected>Choose…</option>'+loanOptions+'</select></div>' +
              '<div class="field"><label for="loantx-type">Type</label><select id="loantx-type" required><option value="drawdown">Drawdown</option><option value="repayment">Repayment</option></select></div>' +
              '<div class="field"><label for="loantx-date">Date</label><input type="date" id="loantx-date" required value="'+todayISO()+'"></div>' +
              '<div class="field"><label for="loantx-capital">Capital (£)</label><input type="number" id="loantx-capital" min="0" step="0.01" placeholder="0.00" required></div>' +
              '<div class="field"><label for="loantx-interest">Interest, if repayment (£)</label><input type="number" id="loantx-interest" min="0" step="0.01" placeholder="0.00"></div>' +
              '<div class="field wide"><label for="loantx-note">Note (optional)</label><input type="text" id="loantx-note" placeholder="e.g. monthly instalment 7 of 36"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">＋ Record</button></div>' +
            '</form>' +
          '</div>' : '') +
          '<div class="panel panel-pad no-print" style="margin-top:16px;"><input type="text" id="loan-search" placeholder="Search lenders…" value="'+esc(state.loanSearch)+'"></div>' +
          loanRows +
        '</div>';
    }

    /* ---------------- Equity / Capital Account ---------------- */
    function renderEquity(){
      var cfg = currentConfig();
      var year = currentYear();
      var yEnd = fyEnd(year);
      var q = state.equitySearch.trim().toLowerCase();
      var list = state.equityEntries.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      if(q) list = list.filter(function(e){ return (e.type||'').toLowerCase().indexOf(q)>-1 || (e.note||'').toLowerCase().indexOf(q)>-1; });
      var typeOptions = cfg.equityTypeOptions.map(function(t){ return '<option value="'+esc(t)+'">'+esc(t)+'</option>'; }).join('');

      var statsRow;
      if(cfg.equityModel==='shareCapital'){
        statsRow = '<div class="stat-row">' +
          stat('Share Capital', fmtMoney(equityByType('Share Capital Issued', yEnd))) +
          stat('Share Premium', fmtMoney(equityByType('Share Premium', yEnd))) +
          stat('Dividends Paid (all time)', fmtMoney(equityByType('Dividend Paid', yEnd))) +
          stat('Other Reserves', fmtMoney(equityByType('Other Reserve Movement', yEnd))) +
        '</div>';
      } else {
        var bs = balanceSheetFor(year);
        statsRow = '<div class="stat-row">' +
          stat('Capital Introduced (all time)', fmtMoney(sumBy(cfg.contributionTypes, function(t){ return equityByType(t, yEnd); }))) +
          stat('Drawings (all time)', fmtMoney(sumBy(cfg.withdrawalTypes, function(t){ return equityByType(t, yEnd); }))) +
          stat('Closing Capital', fmtMoney(bs.totalEquity), 'as at '+asAtLabel(year)) +
        '</div>';
      }

      var rows = list.length ? list.map(function(e){
        return '<tr>' +
          '<td>'+fmtDate(e.date)+'</td>' +
          '<td><span class="pill">'+esc(e.type)+'</span></td>' +
          '<td class="num-col'+(cfg.withdrawalTypes.indexOf(e.type)>-1?' expense':' income')+'">'+fmtMoney(e.amount)+'</td>' +
          '<td class="note">'+esc(e.note||'')+'</td>' +
          '<td class="actions"><button class="btn btn-ghost btn-sm" data-del-equity="'+e.id+'">Delete</button></td>' +
          '</tr>';
      }).join('') : '<tr><td colspan="5"><div class="empty">No movements recorded yet.</div></td></tr>';

      return topbar(cfg.equityLabel, cfg.equityModel==='shareCapital' ? 'Share capital, premium and dividends · as at ' + asAtLabel(year) : 'Capital introduced and drawings · as at ' + asAtLabel(year)) +
        '<div class="content">' +
          statsRow +
          '<div class="panel panel-pad" style="margin-top:16px;">' +
            '<div class="section-title"><h2>Record a movement</h2></div>' +
            '<form class="entry-form" id="equity-form" autocomplete="off">' +
              '<div class="field"><label for="equity-type">Type</label><select id="equity-type" required>'+typeOptions+'</select></div>' +
              '<div class="field"><label for="equity-date">Date</label><input type="date" id="equity-date" required value="'+todayISO()+'"></div>' +
              '<div class="field"><label for="equity-amount">Amount (£)</label><input type="number" id="equity-amount" min="0" step="0.01" placeholder="0.00" required></div>' +
              '<div class="field wide"><label for="equity-note">Note (optional)</label><input type="text" id="equity-note" placeholder="e.g. interim dividend"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">＋ Record</button></div>' +
            '</form>' +
          '</div>' +
          '<div class="panel" style="margin-top:18px;"><div class="panel-pad">' +
            '<div class="toolbar"><div class="search-box"><input type="text" id="equity-search" placeholder="Search type or note…" value="'+esc(state.equitySearch)+'"></div>' +
            '<span class="count-badge">'+list.length+' of '+state.equityEntries.length+'</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Type</th><th style="text-align:right;">Amount</th><th>Note</th><th></th></tr></thead>' +
            '<tbody>'+rows+'</tbody></table></div>' +
          '</div></div>' +
        '</div>';
    }

    /* ---------------- P&L Account ---------------- */
    function renderPL(){
      var cfg = currentConfig();
      var year = currentYear();
      var prevYear = prevYearKey(year);
      var p = plFor(year);
      var pp = plFor(prevYear);
      function findGroup(list, name){ var m = list.find(function(g){return g.group===name;}); return m ? m.total : 0; }
      function row(label, value, prevValue, cls, bold){
        return '<div class="stmt-row'+(bold?' total':'')+'"><span class="stmt-label">'+esc(label)+'</span>' +
          '<span class="stmt-amt'+(cls?(' '+cls):'')+'">'+fmtMoney(value)+'</span>' +
          '<span class="stmt-amt" style="color:var(--ink-soft);">'+fmtMoney(prevValue)+'</span></div>';
      }
      var revLines = p.incGroupTotals.filter(function(g){return g.total>0.005;}).map(function(g){ return row(g.group, g.total, findGroup(pp.incGroupTotals, g.group), 'income'); }).join('');
      var opexLines = p.opexTotals.filter(function(g){return g.total>0.005;}).map(function(g){ return row(g.group, g.total, findGroup(pp.opexTotals, g.group), 'expense'); }).join('');
      return topbar('P&L Account', fiscalYearLabel(year) + ' · vs ' + fiscalYearLabel(prevYear), true) +
        '<div class="content">' +
          '<div class="panel panel-pad"><div class="statement with-prior-year">' +
            '<div class="stmt-row" style="font-weight:600;color:var(--ink-soft);"><span class="stmt-label"></span><span class="stmt-amt">'+esc(fiscalYearLabel(year))+'</span><span class="stmt-amt">'+esc(fiscalYearLabel(prevYear))+'</span></div>' +
            '<div class="stmt-section-title">Revenue</div>' +
            (revLines || '<div class="stmt-row"><span class="stmt-label">No income recorded yet</span><span class="stmt-amt">£0.00</span><span class="stmt-amt"></span></div>') +
            row('Total Revenue', p.totalRevenue, pp.totalRevenue, null, true) +
            '<div class="stmt-section-title">Cost of Goods Sold</div>' +
            row('Cost of Goods Sold', p.cogs, pp.cogs, 'expense') +
            row('★ Gross Profit', p.grossProfit, pp.grossProfit, null, true) +
            '<div class="stmt-section-title">Operating Expenses</div>' +
            (opexLines || '<div class="stmt-row"><span class="stmt-label">No operating expenses recorded yet</span><span class="stmt-amt">£0.00</span><span class="stmt-amt"></span></div>') +
            row('Total Operating Expenses', p.totalOpex, pp.totalOpex, 'expense', true) +
            row('★ EBITDA', p.ebitda, pp.ebitda, null, true) +
            '<div class="stmt-section-title">Depreciation &amp; Amortisation</div>' +
            row('Depreciation (from Fixed Assets)', p.depreciation, pp.depreciation, 'expense') +
            row('★ Operating Profit (EBIT)', p.ebit, pp.ebit, null, true) +
            '<div class="stmt-section-title">Finance Costs</div>' +
            row('Finance & Banking charges', p.financeCostsManual, pp.financeCostsManual, 'expense') +
            row('Loan interest', p.loanInterest, pp.loanInterest, 'expense') +
            row('Total Finance Costs', p.totalFinanceCosts, pp.totalFinanceCosts, 'expense', true) +
            row('★ Profit Before Tax (PBT)', p.pbt, pp.pbt, null, true) +
            (cfg.hasCorpTax ? (
              '<div class="stmt-section-title">Taxation</div>' +
              row('Corporation Tax ('+fmtPct(state.settings.main.corpTaxRate)+' of PBT)', p.corpTax, pp.corpTax, 'expense')
            ) : '') +
            row('★ Net Profit / (Loss) After Tax', p.netProfit, pp.netProfit, p.netProfit>=0?'income':'expense', true) +
          '</div></div>' +
          '<div class="panel panel-pad" style="margin-top:16px;">' +
            '<div class="section-title"><h2>Key Performance Ratios</h2></div>' +
            '<div class="stat-row">' +
              stat('Gross Profit Margin', fmtPct(p.totalRevenue?p.grossProfit/p.totalRevenue:null)) +
              stat('EBITDA Margin', fmtPct(p.totalRevenue?p.ebitda/p.totalRevenue:null)) +
              stat('Operating Margin', fmtPct(p.totalRevenue?p.ebit/p.totalRevenue:null)) +
              stat('Net Profit Margin', fmtPct(p.totalRevenue?p.netProfit/p.totalRevenue:null)) +
            '</div>' +
          '</div>' +
          (cfg.hasCorpTax ? '<div class="banner info" style="margin-top:16px;">◈ Tax &amp; Compliance expenditure (VAT, PAYE/NIC, business rates and tax payments actually made) is tracked on the Cash Flow statement rather than here, so it doesn’t double-count against the Corporation Tax this page computes automatically.</div>' : '') +
        '</div>';
    }

    /* ---------------- Balance Sheet ---------------- */
    function renderBalanceSheet(){
      var cfg = currentConfig();
      var year = currentYear();
      var prevYear = prevYearKey(year);
      var bs = balanceSheetFor(year);
      var bsp = balanceSheetFor(prevYear);
      var b = bs.b, bp = bsp.b;
      function row(label, value, prevValue, bold){
        return '<div class="stmt-row'+(bold?' total':'')+'"><span class="stmt-label">'+esc(label)+'</span>' +
          '<span class="stmt-amt">'+fmtMoney(value)+'</span>' +
          '<span class="stmt-amt" style="color:var(--ink-soft);">'+fmtMoney(prevValue)+'</span></div>';
      }
      function prevAssetFor(category){ var m = bsp.assetBreakdown.find(function(r){return r.category===category;}); return m ? m.nbv : 0; }
      var assetLines = bs.assetBreakdown.filter(function(r){return r.cost>0.005;}).map(function(r){ return row(r.category, r.nbv, prevAssetFor(r.category)); }).join('');
      var okBadge = Math.abs(bs.variance) < 0.5 ? '<span class="status-pill good">Balances</span>' : '<span class="status-pill over">Variance '+fmtMoney(bs.variance)+'</span>';
      var equitySection = cfg.equityModel==='shareCapital' ?
          '<div class="stmt-section-title">Equity / Capital &amp; Reserves</div>' +
          row('Called-Up Share Capital', bs.shareCapital, bsp.shareCapital) +
          row('Share Premium Account', bs.sharePremium, bsp.sharePremium) +
          row('Retained Earnings (brought forward)', bs.retainedBF, bsp.retainedBF) +
          row('Profit / (Loss) for Period', bs.profitForPeriod, bsp.profitForPeriod) +
          row('Dividends Paid This Period', -bs.dividendsThisYear, -bsp.dividendsThisYear) +
          row('Other Reserves', bs.otherReserves, bsp.otherReserves) +
          row('★ Total Equity', bs.totalEquity, bsp.totalEquity, true)
        :
          '<div class="stmt-section-title">Capital Account</div>' +
          row('Capital brought forward', bs.retainedBF, bsp.retainedBF) +
          row('Capital Introduced This Period', bs.capitalIntroducedThisYear, bsp.capitalIntroducedThisYear) +
          row('Profit / (Loss) for Period', bs.profitForPeriod, bsp.profitForPeriod) +
          row('Drawings This Period', -bs.dividendsThisYear, -bsp.dividendsThisYear) +
          row('★ Closing Capital', bs.totalEquity, bsp.totalEquity, true);
      return topbar('Balance Sheet', 'As at '+asAtLabel(year)+' · vs '+fmtDate(fyEnd(prevYear)), true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print">' +
            '<div class="section-title"><h2>Period-end balances</h2><span class="desc">Debtors, creditors, stock and VAT/PAYE/tax positions as at '+asAtLabel(year)+' — enter once reconciled with your invoices/statements</span>' +
              '<button class="btn btn-ghost btn-sm" type="button" data-action="copy-balances-forward" style="margin-left:auto;">⭱ Copy last year forward</button></div>' +
            '<div class="balance-form">' +
              '<div class="field narrow"><label for="bal-debtors">Trade Debtors (£)</label><input type="number" id="bal-debtors" step="0.01" value="'+(b.tradeDebtors||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-prepayments">Prepayments (£)</label><input type="number" id="bal-prepayments" step="0.01" value="'+(b.prepayments||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-stock">Stock / WIP (£)</label><input type="number" id="bal-stock" step="0.01" value="'+(b.stockWIP||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-vatrec">VAT Receivable (£)</label><input type="number" id="bal-vatrec" step="0.01" value="'+(b.vatReceivable||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-otherdeb">Other Debtors (£)</label><input type="number" id="bal-otherdeb" step="0.01" value="'+(b.otherDebtors||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-creditors">Trade Creditors (£)</label><input type="number" id="bal-creditors" step="0.01" value="'+(b.tradeCreditors||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-accruals">Accruals / Deferred Inc. (£)</label><input type="number" id="bal-accruals" step="0.01" value="'+(b.accruals||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-vatpay">VAT Payable (£)</label><input type="number" id="bal-vatpay" step="0.01" value="'+(b.vatPayable||'')+'" placeholder="0.00"></div>' +
              '<div class="field narrow"><label for="bal-payenic">PAYE / NIC Payable (£)</label><input type="number" id="bal-payenic" step="0.01" value="'+(b.payeNicPayable||'')+'" placeholder="0.00"></div>' +
              (cfg.hasCorpTax ? '<div class="field narrow"><label for="bal-ct">Corp. Tax Payable (£)</label><input type="number" id="bal-ct" step="0.01" value="'+(b.corpTaxPayable||'')+'" placeholder="0.00"></div>' : '') +
              '<div class="field narrow"><label for="bal-othercl">Other Current Liab. (£)</label><input type="number" id="bal-othercl" step="0.01" value="'+(b.otherCurrentLiabilities||'')+'" placeholder="0.00"></div>' +
            '</div>' +
            (cfg.hasCorpTax ? '<div class="hint" style="margin-top:6px;">This year’s Corporation Tax charge per the P&amp;L is '+fmtMoney(plFor(year).corpTax)+' — enter what’s actually still payable to HMRC above.</div>' : '') +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="statement with-prior-year">' +
            '<div class="stmt-row" style="font-weight:600;color:var(--ink-soft);"><span class="stmt-label"></span><span class="stmt-amt">'+esc(asAtLabel(year))+'</span><span class="stmt-amt">'+esc(fmtDate(fyEnd(prevYear)))+'</span></div>' +
            '<div class="stmt-section-title">Fixed Assets</div>' +
            (assetLines || '<div class="stmt-row"><span class="stmt-label">None recorded yet</span><span class="stmt-amt">£0.00</span><span class="stmt-amt"></span></div>') +
            row('Total Fixed Assets', bs.fixedAssetsNBV, bsp.fixedAssetsNBV, true) +
            '<div class="stmt-section-title">Current Assets</div>' +
            row('Cash & Bank', bs.cash, bsp.cash) +
            row('Trade Debtors', b.tradeDebtors, bp.tradeDebtors) +
            row('Prepayments & Accrued Income', b.prepayments, bp.prepayments) +
            row('Stock & Work-in-Progress', b.stockWIP, bp.stockWIP) +
            row('VAT Receivable', b.vatReceivable, bp.vatReceivable) +
            row('Other Debtors', b.otherDebtors, bp.otherDebtors) +
            row('Total Current Assets', bs.totalCurrentAssets, bsp.totalCurrentAssets, true) +
            '<div class="stmt-section-title">Current Liabilities</div>' +
            row('Trade Creditors', b.tradeCreditors, bp.tradeCreditors) +
            row('Accruals & Deferred Income', b.accruals, bp.accruals) +
            row('VAT Payable', b.vatPayable, bp.vatPayable) +
            row('PAYE / NIC Payable', b.payeNicPayable, bp.payeNicPayable) +
            (cfg.hasCorpTax ? row('Corporation Tax Payable', b.corpTaxPayable, bp.corpTaxPayable) : '') +
            row('Other Current Liabilities', b.otherCurrentLiabilities, bp.otherCurrentLiabilities) +
            row('Total Current Liabilities', bs.totalCurrentLiabilities, bsp.totalCurrentLiabilities, true) +
            '<div class="stmt-section-title">Long-Term Liabilities</div>' +
            row('Bank Loans / Finance Leases', bs.totalLongTermLiabilities, bsp.totalLongTermLiabilities, true) +
            row('★ Net Assets', bs.netAssets, bsp.netAssets, true) +
            equitySection +
          '</div></div>' +
          '<div class="banner info" style="margin-top:16px;">◈ Net Assets should equal Total '+esc(cfg.equityModel==='shareCapital'?'Equity':'Capital')+' — '+okBadge+'. See Trial Balance for the reconciliation check.</div>' +
        '</div>';
    }

    /* ---------------- Cash Flow Statement ---------------- */
    function renderCashFlow(){
      var cfg = currentConfig();
      var year = currentYear();
      var cf = cashFlowFor(year);
      function row(label, value, bold){
        return '<div class="stmt-row'+(bold?' total':'')+'"><span class="stmt-label">'+esc(label)+'</span><span class="stmt-amt">'+fmtMoney(value)+'</span></div>';
      }
      var recLines = cf.incByGroup.filter(function(g){return g.total>0.005;}).map(function(g){ return row(g.group, g.total); }).join('');
      var payLines = cf.expByGroup.filter(function(g){return g.total>0.005;}).map(function(g){ return row(g.group, g.total); }).join('');
      return topbar('Cash Flow Statement', fiscalYearLabel(year) + ' · direct method', true) +
        '<div class="content">' +
          '<div class="panel panel-pad"><div class="statement">' +
            row('Opening Cash Balance', cf.opening, true) +
            '<div class="stmt-section-title">A. Operating Receipts</div>' +
            (recLines || '<div class="stmt-row"><span class="stmt-label">None recorded yet</span><span class="stmt-amt">£0.00</span></div>') +
            row('Total Operating Receipts', cf.totalReceipts, true) +
            '<div class="stmt-section-title">B. Operating Payments</div>' +
            (payLines || '<div class="stmt-row"><span class="stmt-label">None recorded yet</span><span class="stmt-amt">£0.00</span></div>') +
            row('Total Operating Payments', cf.totalPayments, true) +
            row('★ Net Cash from Operating Activities', cf.netOperating, true) +
            '<div class="stmt-section-title">C. Reconciliation — Non-Cash Items</div>' +
            row('Add back: Depreciation (non-cash)', cf.depreciation) +
            row('Operating Profit per P&L (EBIT)', cf.ebit) +
            '<div class="stmt-section-title">D. Investing Activities</div>' +
            row('Capital Expenditure (Fixed Assets)', -cf.capex) +
            row('★ Net Cash from Investing Activities', cf.netInvesting, true) +
            '<div class="stmt-section-title">E. Financing Activities</div>' +
            row('Loan Drawdowns', cf.loanDraw) +
            row('Loan Repayments — capital', -cf.loanRepayCap) +
            row('Loan Repayments — interest', -cf.loanRepayInt) +
            row(cfg.equityModel==='shareCapital' ? 'Share Capital / Premium Issued' : 'Capital Introduced', cf.contributedIn) +
            row(cfg.equityModel==='shareCapital' ? 'Dividends Paid' : 'Drawings', -cf.withdrawnOut) +
            row('★ Net Cash from Financing Activities', cf.netFinancing, true) +
            row('Net Cash Movement in Period', cf.netMovement, true) +
            row('★ Closing Cash Balance', cf.closing, true) +
          '</div></div>' +
          '<div class="banner info" style="margin-top:16px;">◈ Tax &amp; Compliance payments (VAT, PAYE/NIC, business rates settlements'+(cfg.hasCorpTax?', corporation tax actually paid':'')+', penalties) are included in Operating Payments here'+(cfg.hasCorpTax?', distinct from the Corporation Tax charge on the P&amp;L':'')+'.</div>' +
        '</div>';
    }

    /* ---------------- Trial Balance ---------------- */
    function renderTrialBalance(){
      var cfg = currentConfig();
      var year = currentYear();
      var bs = balanceSheetFor(year);
      var ok = Math.abs(bs.variance) < 0.5;
      var equityBlock = cfg.equityModel==='shareCapital' ?
          '<div class="stmt-section-title">Total Equity (from Balance Sheet)</div>' +
          '<div class="stmt-row"><span class="stmt-label">Share Capital + Premium</span><span class="stmt-amt">'+fmtMoney(bs.shareCapital+bs.sharePremium)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Retained Earnings b/f</span><span class="stmt-amt">'+fmtMoney(bs.retainedBF)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Profit / (Loss) for Period</span><span class="stmt-amt">'+fmtMoney(bs.profitForPeriod)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Dividends Paid</span><span class="stmt-amt">'+fmtMoney(-bs.dividendsThisYear)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Other Reserves</span><span class="stmt-amt">'+fmtMoney(bs.otherReserves)+'</span></div>' +
          '<div class="stmt-row total"><span class="stmt-label">= Total Equity</span><span class="stmt-amt">'+fmtMoney(bs.totalEquity)+'</span></div>'
        :
          '<div class="stmt-section-title">Total Capital (from Balance Sheet)</div>' +
          '<div class="stmt-row"><span class="stmt-label">Capital brought forward</span><span class="stmt-amt">'+fmtMoney(bs.retainedBF)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Capital Introduced</span><span class="stmt-amt">'+fmtMoney(bs.capitalIntroducedThisYear)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Profit / (Loss) for Period</span><span class="stmt-amt">'+fmtMoney(bs.profitForPeriod)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Drawings</span><span class="stmt-amt">'+fmtMoney(-bs.dividendsThisYear)+'</span></div>' +
          '<div class="stmt-row total"><span class="stmt-label">= Total Capital</span><span class="stmt-amt">'+fmtMoney(bs.totalEquity)+'</span></div>';
      return topbar('Trial Balance', 'As at '+asAtLabel(year), true) +
        '<div class="content">' +
          '<div class="two-col">' +
            '<div class="panel panel-pad"><div class="statement">' +
              '<div class="stmt-section-title">Net Assets (from Balance Sheet)</div>' +
              '<div class="stmt-row"><span class="stmt-label">Fixed Assets (NBV)</span><span class="stmt-amt">'+fmtMoney(bs.fixedAssetsNBV)+'</span></div>' +
              '<div class="stmt-row"><span class="stmt-label">Total Current Assets</span><span class="stmt-amt">'+fmtMoney(bs.totalCurrentAssets)+'</span></div>' +
              '<div class="stmt-row"><span class="stmt-label">Total Current Liabilities</span><span class="stmt-amt">'+fmtMoney(-bs.totalCurrentLiabilities)+'</span></div>' +
              '<div class="stmt-row"><span class="stmt-label">Long-Term Liabilities</span><span class="stmt-amt">'+fmtMoney(-bs.totalLongTermLiabilities)+'</span></div>' +
              '<div class="stmt-row total"><span class="stmt-label">= Net Assets</span><span class="stmt-amt">'+fmtMoney(bs.netAssets)+'</span></div>' +
            '</div></div>' +
            '<div class="panel panel-pad"><div class="statement">' + equityBlock + '</div></div>' +
          '</div>' +
          '<div class="banner '+(ok?'info':'warn')+'" style="margin-top:16px;">'+(ok?'✅ Balance (Net Assets − '+(cfg.equityModel==='shareCapital'?'Equity':'Capital')+') = '+fmtMoney(bs.variance)+' — books balance.':'⚠ Variance of '+fmtMoney(bs.variance)+' — Net Assets and Total '+(cfg.equityModel==='shareCapital'?'Equity':'Capital')+' don’t reconcile. Check the period-end balances you entered on the Balance Sheet page, and that every asset, loan and equity movement has been recorded.')+'</div>' +
        '</div>';
    }

    /* ---------------- General Ledger ---------------- */
    function renderGeneralLedger(){
      var year = currentYear();
      var yStart = fyStart(year);
      var cfg = currentConfig();

      function moveRow(date, label, amount, bal){
        return '<tr><td>'+fmtDate(date)+'</td><td>'+esc(label)+'</td>' +
          '<td class="num-col income">'+(amount>0?fmtMoney(amount):'')+'</td>' +
          '<td class="num-col expense">'+(amount<0?fmtMoney(-amount):'')+'</td>' +
          '<td class="num-col"><strong>'+fmtMoney(bal)+'</strong></td></tr>';
      }
      var running = cashAsOf(dayBefore(yStart));
      var cashRows = '<tr><td>'+fmtDate(yStart)+'</td><td>Balance brought forward</td><td></td><td></td><td class="num-col"><strong>'+fmtMoney(running)+'</strong></td></tr>';
      entriesInYear(allCashMovements(), year).forEach(function(m){ running += m.amount; cashRows += moveRow(m.date, m.label, m.amount, running); });

      function catSections(kind){
        var groups = ledgerCategoryAccounts(kind, year);
        if(!groups.length) return '<div class="panel panel-pad" style="margin-top:16px;"><div class="empty">No '+(kind==='income'?'income':'expenditure')+' recorded yet for '+fiscalYearLabel(year)+'.</div></div>';
        return groups.map(function(g){
          var body = g.accounts.map(function(acc){
            var lines = acc.entries.map(function(e){
              return '<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description||e.payee||'—')+(e.note?' — '+esc(e.note):'')+'</td>' +
                '<td class="num-col'+(kind==='income'?' income':' expense')+'">'+fmtMoney(e.amount)+'</td></tr>';
            }).join('');
            return '<div class="stmt-section-title" style="margin-top:12px;">'+esc(acc.name)+
              ' <span style="font-weight:400;color:var(--ink-soft);">— '+fmtMoney(acc.total)+'</span></div>' +
              '<div class="table-wrap"><table class="ledger"><tbody>'+lines+'</tbody></table></div>';
          }).join('');
          return '<div class="panel panel-pad" style="margin-top:16px;">' +
            '<div class="section-title"><h2>'+esc(g.group)+'</h2><span class="desc">Group total '+fmtMoney(g.total)+'</span></div>' +
            body + '</div>';
        }).join('');
      }

      function assetLedger(){
        if(!state.assets.length) return '<div class="empty">No fixed assets recorded yet.</div>';
        var rows = state.assets.slice().sort(function(a,b){ return (a.dateAcquired||'').localeCompare(b.dateAcquired||''); }).map(function(a){
          var dep = assetDepInYear(a, year);
          var nbv = assetNBVThrough(a, fyEnd(year));
          return '<tr><td>'+esc(a.description||'—')+'</td><td><span class="pill">'+esc(a.category)+'</span></td>' +
            '<td>'+fmtDate(a.dateAcquired)+'</td><td class="num-col">'+fmtMoney(a.cost)+'</td>' +
            '<td class="num-col expense">'+fmtMoney(dep)+'</td><td class="num-col"><strong>'+fmtMoney(nbv)+'</strong></td></tr>';
        }).join('');
        return '<div class="table-wrap"><table class="ledger"><thead><tr><th>Asset</th><th>Category</th><th>Acquired</th><th style="text-align:right;">Cost</th><th style="text-align:right;">Dep. this period</th><th style="text-align:right;">NBV</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      }

      function loanLedger(){
        if(!state.loans.length) return '<div class="empty">No loans recorded yet.</div>';
        return state.loans.map(function(l){
          var txs = loanTxsFor(l.id).filter(function(t){ return fiscalYearKey(t.date)===year; }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
          var openBal = loanBalanceThrough(l, dayBefore(yStart));
          var closeBal = loanBalanceThrough(l, fyEnd(year));
          var txRows = txs.map(function(t){
            return '<tr><td>'+fmtDate(t.date)+'</td><td>'+(t.type==='drawdown'?'Drawdown':'Repayment')+'</td>' +
              '<td class="num-col">'+fmtMoney(t.capitalAmount)+'</td><td class="num-col">'+(t.type==='repayment'?fmtMoney(t.interestAmount):'—')+'</td></tr>';
          }).join('');
          return '<div class="stmt-section-title" style="margin-top:12px;">'+esc(l.lender)+
            ' <span style="font-weight:400;color:var(--ink-soft);">— opening '+fmtMoney(openBal)+', closing '+fmtMoney(closeBal)+'</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Type</th><th style="text-align:right;">Capital</th><th style="text-align:right;">Interest</th></tr></thead><tbody>'+(txRows||'<tr><td colspan="4"><div class="empty">No movement this period.</div></td></tr>')+'</tbody></table></div>';
        }).join('');
      }

      function equityLedger(){
        var list = entriesInYear(state.equityEntries, year).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
        if(!list.length) return '<div class="empty">No '+cfg.equityLabel.toLowerCase()+' movements recorded this period.</div>';
        var rows = list.map(function(e){
          return '<tr><td>'+fmtDate(e.date)+'</td><td><span class="pill">'+esc(e.type)+'</span></td>' +
            '<td class="num-col'+(isWithdrawal(e.type)?' expense':' income')+'">'+fmtMoney(e.amount)+'</td><td class="note">'+esc(e.note||'')+'</td></tr>';
        }).join('');
        return '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Type</th><th style="text-align:right;">Amount</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      }

      return topbar('General Ledger', fiscalYearLabel(year) + ' · every nominal account', true) +
        '<div class="content">' +
          '<div class="banner info">◈ One account per category actually used this period, alongside Cash &amp; Bank, Fixed Assets, Loans and '+esc(cfg.equityLabel)+' — the full nominal ledger behind the statutory accounts above.</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Cash &amp; Bank Account</h2><span class="desc">Closing balance '+fmtMoney(running)+' as at '+asAtLabel(year)+'</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right;">Money In</th><th style="text-align:right;">Money Out</th><th style="text-align:right;">Balance</th></tr></thead><tbody>'+cashRows+'</tbody></table></div>' +
          '</div>' +
          '<div class="section-title" style="margin-top:22px;"><h2>Income Accounts</h2></div>' +
          catSections('income') +
          '<div class="section-title" style="margin-top:22px;"><h2>Expenditure Accounts</h2></div>' +
          catSections('expense') +
          '<div class="panel panel-pad" style="margin-top:22px;"><div class="section-title"><h2>Fixed Asset Accounts</h2></div>' + assetLedger() + '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Loan Accounts</h2></div>' + loanLedger() + '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>'+esc(cfg.equityLabel)+' Accounts</h2></div>' + equityLedger() + '</div>' +
        '</div>';
    }

    /* ---------------- Bank Reconciliation ---------------- */
    function renderBankRec(){
      var recs = state.bankReconciliations.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      var selectedId = state.selectedBankRecId && recs.some(function(r){ return r.id===state.selectedBankRecId; }) ? state.selectedBankRecId : (recs[0] ? recs[0].id : null);
      var selected = recs.find(function(r){ return r.id===selectedId; });

      var recOptions = recs.map(function(r){
        return '<option value="'+r.id+'"'+(r.id===selectedId?' selected':'')+'>'+fmtDate(r.date)+' — statement '+fmtMoney(r.statementBalance)+'</option>';
      }).join('');

      var summary;
      if(selected){
        var br = bankRecFor(selected.date);
        var variance = br.expectedBankBalance - Number(selected.statementBalance);
        var ok = Math.abs(variance) < 0.5;
        var outstandingRows = br.outstanding.length ? br.outstanding.map(function(m){
          return '<tr><td>'+fmtDate(m.date)+'</td><td>'+esc(m.label)+'</td>' +
            '<td class="num-col'+(m.amount>0?' income':' expense')+'">'+fmtMoney(m.amount)+'</td>' +
            '<td class="actions no-print"><label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;"><input type="checkbox" data-clear-move data-clear-col="'+m.colName+'" data-clear-id="'+m.id+'"> Cleared</label></td></tr>';
        }).join('') : '<tr><td colspan="4"><div class="empty">Nothing outstanding — every entry up to this date has been ticked off.</div></td></tr>';

        summary =
          '<div class="stat-row">' +
            stat('Balance per Cash Book', fmtMoney(br.bookBalance), 'as at '+fmtDate(selected.date)) +
            stat('Uncleared receipts', fmtMoney(br.unclearedReceipts), 'not yet on the statement') +
            stat('Uncleared payments', fmtMoney(br.unclearedPayments), 'not yet on the statement') +
            stat('Expected Bank Balance', fmtMoney(br.expectedBankBalance), 'cash book adjusted for outstanding items') +
          '</div>' +
          '<div class="banner '+(ok?'info':'warn')+'" style="margin-top:16px;">'+(ok?'✅ Reconciled — the expected bank balance matches the statement balance you entered ('+fmtMoney(selected.statementBalance)+').':'⚠ Variance of '+fmtMoney(variance)+' between the expected bank balance and the statement balance ('+fmtMoney(selected.statementBalance)+') — check for a missing entry, an item ticked off in error, or a mistyped statement balance.')+'</div>' +
          '<div class="panel" style="margin-top:16px;"><div class="panel-pad">' +
            '<div class="section-title"><h2>Outstanding items as at '+fmtDate(selected.date)+'</h2><span class="desc">Recorded in the books but not yet ticked off against the bank statement</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right;">Amount</th><th class="no-print"></th></tr></thead><tbody>'+outstandingRows+'</tbody></table></div>' +
          '</div></div>';
      } else {
        summary = '<div class="panel panel-pad" style="margin-top:16px;"><div class="empty">Add a bank statement below to run your first reconciliation.</div></div>';
      }

      var historyRows = recs.length ? recs.map(function(r){
        var brh = bankRecFor(r.date);
        var v = brh.expectedBankBalance - Number(r.statementBalance);
        var badge = Math.abs(v) < 0.5 ? '<span class="status-pill good">Reconciled</span>' : '<span class="status-pill over">Variance '+fmtMoney(v)+'</span>';
        return '<tr><td>'+fmtDate(r.date)+'</td><td class="num-col">'+fmtMoney(r.statementBalance)+'</td><td>'+badge+'</td><td class="note">'+esc(r.note||'')+'</td>' +
          '<td class="actions no-print"><button class="btn btn-ghost btn-sm" data-del-bankrec="'+r.id+'">Delete</button></td></tr>';
      }).join('') : '<tr><td colspan="5"><div class="empty">No reconciliations recorded yet.</div></td></tr>';

      return topbar('Bank Reconciliation', 'Tick off the cash book against your bank statement', true) +
        '<div class="content">' +
          '<div class="banner info">◈ Enter your bank statement’s closing balance and date below, then tick off each item as it appears on the statement. The Expected Bank Balance is the cash book balance adjusted for anything still outstanding — it should match the statement once everything is ticked.</div>' +
          '<div class="panel panel-pad no-print" style="margin-top:16px;">' +
            '<div class="section-title"><h2>New reconciliation</h2></div>' +
            '<form class="entry-form" id="bankrec-form" autocomplete="off">' +
              '<div class="field"><label for="bankrec-date">Statement date</label><input type="date" id="bankrec-date" required value="'+todayISO()+'"></div>' +
              '<div class="field"><label for="bankrec-balance">Statement closing balance (£)</label><input type="number" id="bankrec-balance" step="0.01" placeholder="0.00" required></div>' +
              '<div class="field wide"><label for="bankrec-note">Note (optional)</label><input type="text" id="bankrec-note" placeholder="e.g. Lloyds current account, sheet 47"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">＋ Save reconciliation</button></div>' +
            '</form>' +
          '</div>' +
          (recs.length>1 ? '<div class="panel panel-pad no-print" style="margin-top:16px;"><div class="field"><label for="bankrec-select">Viewing reconciliation</label><select id="bankrec-select">'+recOptions+'</select></div></div>' : '') +
          summary +
          '<div class="panel" style="margin-top:18px;"><div class="panel-pad">' +
            '<div class="section-title"><h2>Reconciliation history</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Statement date</th><th style="text-align:right;">Statement balance</th><th>Status</th><th>Note</th><th></th></tr></thead><tbody>'+historyRows+'</tbody></table></div>' +
          '</div></div>' +
        '</div>';
    }

    /* ---------------- Budget vs Actual ---------------- */
    function renderBudget(){
      var year = currentYear();
      var pl = plFor(year);
      function budgetRow(kind, groupName, actual){
        var budgeted = budgetedAmt(kind, groupName, year);
        var variance = budgeted - actual;
        var variancePct = budgeted ? (variance/budgeted) : null;
        return '<tr>' +
          '<td>'+esc(groupName)+'</td>' +
          '<td class="num-col"><input type="number" min="0" step="0.01" value="'+(budgeted||'')+'" placeholder="0.00" data-budget-kind="'+kind+'" data-budget-group="'+esc(groupName)+'" style="width:100px; text-align:right;"></td>' +
          '<td class="num-col">'+fmtMoney(actual)+'</td>' +
          '<td class="num-col" style="color:'+(variance>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(variance)+'</td>' +
          '<td class="num-col">'+(variancePct==null?'—':fmtPct(variancePct))+'</td>' +
          '</tr>';
      }
      var incRows = BUSINESS_INCOME_GROUPS.map(function(g){
        var actual = (pl.incGroupTotals.find(function(r){return r.group===g;})||{total:0}).total;
        return budgetRow('income', g, actual);
      }).join('');
      var expRows = BUSINESS_EXPENSE_GROUPS.map(function(g){
        var actual = g==='COST OF GOODS SOLD (COGS)' ? pl.cogs : (pl.opexTotals.find(function(r){return r.group===g;}) || {total: g==='FINANCE & BANKING'?pl.financeCostsManual:0}).total;
        return budgetRow('expense', g, actual);
      }).join('');
      var totalIncBudget = sumBy(BUSINESS_INCOME_GROUPS, function(g){return budgetedAmt('income',g,year);});
      var totalExpBudget = sumBy(BUSINESS_EXPENSE_GROUPS, function(g){return budgetedAmt('expense',g,year);});
      var totalIncActual = pl.totalRevenue;
      var totalExpActual = pl.cogs + pl.totalOpex + pl.financeCostsManual;
      return topbar('Budget vs Actual', fiscalYearLabel(year), true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print" style="margin-bottom:12px;">' +
            '<button class="btn btn-ghost btn-sm" type="button" data-action="copy-budget-forward">⭱ Copy last year’s budget forward</button>' +
          '</div>' +
          '<div class="panel panel-pad"><div class="section-title"><h2>Income</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Group</th><th style="text-align:right;">Budget</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Variance</th><th style="text-align:right;">Var %</th></tr></thead>' +
            '<tbody>'+incRows+'</tbody>' +
            '<tfoot><tr><td>Total Income</td><td class="num-col">'+fmtMoney(totalIncBudget)+'</td><td class="num-col">'+fmtMoney(totalIncActual)+'</td><td class="num-col">'+fmtMoney(totalIncBudget-totalIncActual)+'</td><td></td></tr></tfoot>' +
            '</table></div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:14px;"><div class="section-title"><h2>Expenditure</h2><span class="desc">Depreciation and Capital Expenditure are tracked on the Fixed Assets register, not budgeted here</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Group</th><th style="text-align:right;">Budget</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Variance</th><th style="text-align:right;">Var %</th></tr></thead>' +
            '<tbody>'+expRows+'</tbody>' +
            '<tfoot><tr><td>Total Expenditure</td><td class="num-col">'+fmtMoney(totalExpBudget)+'</td><td class="num-col">'+fmtMoney(totalExpActual)+'</td><td class="num-col">'+fmtMoney(totalExpBudget-totalExpActual)+'</td><td></td></tr></tfoot>' +
            '</table></div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:14px;">' +
            '<div class="stmt-row total"><span class="stmt-label">Net Profit — Budget</span><span class="stmt-amt">'+fmtMoney(totalIncBudget-totalExpBudget)+'</span></div>' +
            '<div class="stmt-row total"><span class="stmt-label">Net Profit — Actual</span><span class="stmt-amt">'+fmtMoney(totalIncActual-totalExpActual)+'</span></div>' +
          '</div>' +
        '</div>';
    }

    /* ---------------- Categories ---------------- */
    function renderCategories(){
      function catBlock(kind, title){
        var groups = groupsFor(kind);
        var cats = catListFor(kind).slice().sort(function(a,b){return a.order-b.order;});
        var groupOptions = groups.map(function(g){ return '<option value="'+esc(g)+'">'+esc(g)+'</option>'; }).join('');
        var groupsHtml = groups.map(function(g){
          var list = cats.filter(function(c){return c.group===g && c.active!==false;});
          if(!list.length) return '';
          var chips = list.map(function(c){
            var used = entriesFor(kind).filter(function(e){return e.categoryId===c.id;}).length;
            return '<div class="chip'+(c.custom?' custom':'')+'"><span>'+esc(c.name)+'</span><span class="idx">'+used+'</span>' +
              '<button data-del-cat="'+c.id+'" data-cat-kind="'+kind+'" title="Remove category">×</button></div>';
          }).join('');
          return '<div style="margin-bottom:10px;"><div class="hint" style="margin-bottom:4px;">'+esc(g)+'</div><div class="chiplist">'+chips+'</div></div>';
        }).join('');
        return '<div class="panel panel-pad" style="margin-top:14px;">' +
          '<div class="section-title"><h2>'+title+'</h2><span class="desc">'+cats.filter(function(c){return c.active!==false;}).length+' categories</span></div>' +
          '<form data-cat-form="'+kind+'" style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;" autocomplete="off">' +
            '<input type="text" placeholder="New category name…" data-cat-input="'+kind+'" style="flex:1; min-width:140px; padding:8px 11px; border-radius:7px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink);" required>' +
            '<select data-cat-group-input="'+kind+'" style="padding:8px 11px; border-radius:7px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink);" required>'+groupOptions+'</select>' +
            '<button class="btn btn-primary btn-sm" type="submit">＋ Add</button>' +
          '</form>' +
          groupsHtml +
        '</div>';
      }
      return topbar('Categories', 'Income and expenditure categories for this entity') +
        '<div class="content">' +
          catBlock('income', 'Income Categories') +
          catBlock('expense', 'Expenditure Categories') +
        '</div>';
    }

    /* ---------------- Settings ---------------- */

      var monthOptions = MONTH_NAMES_SHORT.map(function(m,i){ return '<option value="'+(i+1)+'"'+((Number(s.fyStartMonth)||1)===(i+1)?' selected':'')+'>'+m+'</option>'; }).join('');
      return topbar('Settings', cfg.label + ' details and key assumptions') +
        '<div class="content">' +
          '<div class="panel panel-pad">' +
            '<div class="section-title"><h2>Entity Information</h2></div>' +

              '<div class="field wide"><label for="set-name">'+(cfg.key==='company'?'Company Name':'Business / Trading Name')+'</label><input type="text" id="set-name" value="'+esc(s.companyName||'')+'"></div>' +
              '<div class="field"><label for="set-number">'+(cfg.key==='company'?'Company Number':'Registration / Reference No. (optional)')+'</label><input type="text" id="set-number" value="'+esc(s.companyNumber||'')+'"></div>' +
              '<div class="field wide"><label for="set-address">Address</label><input type="text" id="set-address" value="'+esc(s.registeredAddress||'')+'"></div>' +
              '<div class="field"><label for="set-vatnum">VAT Number (if registered)</label><input type="text" id="set-vatnum" value="'+esc(s.vatNumber||'')+'"></div>' +
              '<div class="field"><label for="set-vatrate">VAT Rate (%)</label><input type="number" id="set-vatrate" step="0.1" value="'+((Number(s.vatRate)||0)*100)+'"></div>' +
              '<div class="field"><label for="set-fystart">Financial year starts</label><select id="set-fystart">'+monthOptions+'</select></div>' +
            '</div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:14px;">' +
            '<div class="section-title"><h2>Key Financial Assumptions</h2></div>' +
            '<div class="entry-form">' +

    /* ---------------- write helpers ---------------- */
    function addIncomeEntry(date, description, catId, amount, note){
      var cat = state.incomeCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      col.incomeEntries.add({
        date:date, description:description||'', categoryId:cat.id, categoryName:cat.name,
        amount:amount, note:note||'', createdAt:new Date().toISOString()
      }).then(function(){ toast('Income recorded.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addExpenseEntry(date, desc, payee, catId, amount, note){
      var cat = state.expenseCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      col.expenseEntries.add({
        date:date, description:desc||'', payee:payee||'', categoryId:cat.id, categoryName:cat.name,
        amount:amount, note:note||'', createdAt:new Date().toISOString()
      }).then(function(){ toast('Expenditure recorded.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    /* Corrects an existing entry in place (wrong amount, wrong category, etc.) rather than
       deleting and re-adding it — see state.editingIncomeId/editingExpenseId and the
       income-form/expense-form submit handlers in bindHandlers, which route here instead of to
       addIncomeEntry/addExpenseEntry while an edit is in progress. Deleting the entry outright
       is still available via the row's Delete button. */
    function updateIncomeEntry(id, date, description, catId, amount, note){
      var cat = state.incomeCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      col.incomeEntries.doc(id).update({
        date:date, description:description||'', categoryId:cat.id, categoryName:cat.name, amount:amount, note:note||''
      }).then(function(){ state.editingIncomeId = null; toast('Income entry updated.'); render(); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function updateExpenseEntry(id, date, desc, payee, catId, amount, note){
      var cat = state.expenseCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      col.expenseEntries.doc(id).update({
        date:date, description:desc||'', payee:payee||'', categoryId:cat.id, categoryName:cat.name, amount:amount, note:note||''
      }).then(function(){ state.editingExpenseId = null; toast('Expenditure entry updated.'); render(); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addCategory(kind, name, group){
      var col2 = catColFor(kind);
      var list = catListFor(kind);
      if(list.some(function(c){ return c.active!==false && byNameCI(c.name, name); })){ toast('That category already exists.'); return; }
      var maxOrder = list.reduce(function(m,c){ return Math.max(m, c.order||0); }, 0);
      var data = { name:name, order:maxOrder+1, custom:true, active:true };
      data.group = group || groupsFor(kind)[0];
      col2.add(data).then(function(){ toast('Category added.'); }).catch(function(){ toast('Could not add category.'); });
    }
    function addAsset(desc, category, cost, dateAcquired, note){
      col.assets.add({
        description:desc, category:category, cost:cost, dateAcquired:dateAcquired||'', note:note||'', createdAt:new Date().toISOString()
      }).then(function(){ toast('Asset added.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addLoan(lender, openingBalance, startDate, note){
      col.loans.add({ lender:lender, openingBalance:openingBalance, startDate:startDate, note:note||'', createdAt:new Date().toISOString() })
        .then(function(){ toast('Loan added.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addLoanTransaction(loanId, type, date, capitalAmount, interestAmount, note){
      col.loanTransactions.add({
        loanId:loanId, type:type, date:date, capitalAmount:capitalAmount, interestAmount: type==='repayment'?(interestAmount||0):0,
        note:note||'', createdAt:new Date().toISOString()
      }).then(function(){ toast('Recorded.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addEquityEntry(type, date, amount, note){
      col.equityEntries.add({ type:type, date:date, amount:amount, note:note||'', createdAt:new Date().toISOString() })
        .then(function(){ toast('Recorded.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addBankReconciliation(date, statementBalance, note){
      col.bankReconciliations.add({ date:date, statementBalance:statementBalance, note:note||'', createdAt:new Date().toISOString() })
        .then(function(res){ state.selectedBankRecId = res.id; toast('Reconciliation saved.'); })
        .catch(function(){ toast('Could not save — try again.'); });
    }

      track(col.assets.onSnapshot(function(snap){ state.assets = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); render(); }));
      track(col.loans.onSnapshot(function(snap){ state.loans = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); render(); }));
      track(col.loanTransactions.onSnapshot(function(snap){ state.loanTransactions = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); render(); }));
      track(col.equityEntries.onSnapshot(function(snap){ state.equityEntries = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); render(); }));

      track(col.documents.onSnapshot(function(snap){ state.documents = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); render(); }));

      col.settings = db.doc(ns('settings')+'/main');
      track(col.settings.onSnapshot(function(snap){
        if(snap.exists) state.settings.main = snap.data();
        render();
      }));

      subscribeBalancesForYear(currentYear());
    }

    var balancesUnsub = null;
    function subscribeBalancesForYear(year){
      if(balancesUnsub){ balancesUnsub(); balancesUnsub = null; }
      col.balances = db.doc(ns('balances')+'/'+balancesDocId(year));
      balancesUnsub = col.balances.onSnapshot(function(snap){
        if(snap.exists){ state.balances = Object.assign({_year:year}, snap.data()); }
        else { state.balances = { _year:year, tradeDebtors:0, prepayments:0, stockWIP:0, vatReceivable:0, otherDebtors:0, tradeCreditors:0, accruals:0, vatPayable:0, payeNicPayable:0, corpTaxPayable:0, otherCurrentLiabilities:0 }; }
        render();
      });
      track(balancesUnsub);
    }
    function balancesDocId(year){ return year; }
    function switchYear(year){
      state.selectedYear = year;
      subscribeBalancesForYear(year);
      render();
    }
    function copyBalancesForward(){
      var year = currentYear();
      var prevYear = String(Number(year)-1);
      db.doc(ns('balances')+'/'+balancesDocId(prevYear)).get().then(function(snap){
        if(!snap.exists){ toast('No balances found for '+fiscalYearLabel(prevYear)+' to copy.'); return; }
        var prev = snap.data();
        col.balances.set(Object.assign({}, prev, {updatedAt:new Date().toISOString()})).then(function(){ toast('Copied balances from '+fiscalYearLabel(prevYear)+'.'); render(); });
      });
    }

    return { render: render, bindHandlers: bindHandlers, subscribeAll: subscribeAll };
  })();
  /* ================== PersonalEngine ==================
     Drives "personal" entities — envelope budgeting ("give every pound a job") on calendar-month
     periods, rather than the fiscal-year statutory engine BusinessEngine runs. Ported faithfully
     from the standalone Personal Budget app (same rollover math, same reports), with one addition:
     a proper tick-off Bank Reconciliation — sharing state.bankReconciliations/selectedBankRecId
     and the same Expected Balance formula as BusinessEngine — replacing the original's free-text
     lodgements/payments version, per the "proper bank reconciliation for all" requirement. */
  var PersonalEngine = (function(){

    var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var DEFAULT_YEAR = String(new Date().getFullYear());
    var DEFAULT_MONTH = new Date().getMonth()+1;

    /* ---------------- calendar month/year helpers ----------------
       Every entry is keyed by its own calendar date; a "period" is just {year, month}. Unlike
       a fiscal year, there's no special baked-in period — every (year, month) is symmetrical,
       so budgets/entries/rollover all key off explicit year+month rather than a magic default. */
    function ymOf(iso){
      if(!iso) return null;
      var d = new Date(iso+'T00:00:00');
      if(isNaN(d)) return null;
      return { y:String(d.getFullYear()), m:d.getMonth()+1 };
    }
    function entriesInMonth(list, year, month){
      return list.filter(function(e){ var ym = ymOf(e.date); return ym && ym.y===String(year) && ym.m===Number(month); });
    }
    function availableYears(){
      var keys = {}; keys[DEFAULT_YEAR] = true; keys[String(state.settings.main.startYear||DEFAULT_YEAR)] = true;
      state.incomeEntries.forEach(function(e){ var ym=ymOf(e.date); if(ym) keys[ym.y]=true; });
      state.expenseEntries.forEach(function(e){ var ym=ymOf(e.date); if(ym) keys[ym.y]=true; });
      state.bankReconciliations.forEach(function(r){ var ym=ymOf(r.date); if(ym) keys[ym.y]=true; });
      state.budgets.forEach(function(b){ if(b.year) keys[String(b.year)]=true; });
      return Object.keys(keys).sort(function(a,b){ return Number(a)-Number(b); });
    }
    function currentYear(){ return state.selectedYear || DEFAULT_YEAR; }
    function currentMonth(){ return state.selectedMonth || DEFAULT_MONTH; }
    function periodLabel(year, month){ return MONTH_NAMES[Number(month)-1]+' '+year; }
    function todayISOWithin(year, month){
      var ym = ymOf(todayISO());
      if(ym && ym.y===String(year) && ym.m===Number(month)) return todayISO();
      return year+'-'+pad2(month)+'-01';
    }
    function prevYM(year, month){ var y=Number(year), m=Number(month)-1; if(m<1){ m=12; y-=1; } return {y:String(y), m:m}; }
    function nextYM(year, month){ var y=Number(year), m=Number(month)+1; if(m>12){ m=1; y+=1; } return {y:String(y), m:m}; }
    function ymCompare(a,b){
      if(Number(a.y)!==Number(b.y)) return Number(a.y)<Number(b.y) ? -1 : 1;
      if(Number(a.m)!==Number(b.m)) return Number(a.m)<Number(b.m) ? -1 : 1;
      return 0;
    }
    /* Inclusive list of {y,m} from the configured start period through the target period —
       the basis for every cumulative figure (category rollover, running account balance,
       Ready to Assign) so none of them need a separately-persisted "carried forward" doc. */
    function monthsFromStartThrough(year, month){
      var start = { y:String(state.settings.main.startYear||DEFAULT_YEAR), m:Number(state.settings.main.startMonth)||1 };
      var target = { y:String(year), m:Number(month) };
      var out = [];
      if(ymCompare(start,target)>0) return out;
      var cur = start, guard = 0;
      while(ymCompare(cur,target)<=0 && guard<2400){
        out.push({y:cur.y,m:cur.m});
        cur = nextYM(cur.y,cur.m);
        guard++;
      }
      return out;
    }

    /* ---------------- categories / budgets ---------------- */
    function entriesFor(kind){ return kind==='income'?state.incomeEntries:state.expenseEntries; }
    function catListFor(kind){ return kind==='income'?state.incomeCats:state.expenseCats; }
    function catColFor(kind){ return kind==='income'?col.incomeCats:col.expenseCats; }
    function categoryList(){ return state.expenseCats.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }); }
    function categoriesByGroup(group){ return categoryList().filter(function(c){ return c.group===group && c.active!==false; }); }
    function incomeCatList(){ return state.incomeCats.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }); }

    /* ---------------- expense category HEADINGS (editable — see renderCategories) ----------------
       Headings ("Housing", "Utilities", ...) used to be a hardcoded constant (PERSONAL_EXPENSE_GROUPS);
       they're now a proper per-entity register, freely renamed/added/removed. Categories still store
       their heading as a plain name string (matching the app's existing pattern elsewhere), so a
       rename cascades to every category carrying the old name, and a delete clears the heading on
       any category that was using it rather than silently hiding that category. */
    function expenseGroupList(){ return state.expenseGroups.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }); }
    function expenseGroupNames(){ return expenseGroupList().map(function(g){ return g.name; }); }
    /* Categories whose heading doesn't match any current heading (blank, or left behind by a
       deleted heading) — grouped views below still show these under an "Uncategorized" bucket
       instead of losing them. */
    function uncategorizedExpenseCats(){
      var names = expenseGroupNames();
      return categoryList().filter(function(c){ return c.active!==false && names.indexOf(c.group)===-1; });
    }
    /* Backfills the expenseGroups register for personal entities created before this register
       existed (freshly-created ones are seeded directly in shell.js's seedEntityCategories).
       Non-destructive: only runs when the register is genuinely empty, and folds in any group
       name already in use on an existing category so nothing already-tagged goes missing. */
    function ensureExpenseGroupsSeeded(){
      if(state.expenseGroups.length) return;
      var names = PERSONAL_EXPENSE_GROUPS.slice();
      state.expenseCats.forEach(function(c){
        var g = (c.group||'').trim();
        if(g && names.indexOf(g)===-1) names.push(g);
      });
      names.forEach(function(name, i){
        col.expenseGroups.add({ name:name, order:i+1, createdAt:new Date().toISOString() });
      });
    }

    function budgetDocId(year, month, catId){ return year+'-'+pad2(month)+'_'+catId; }
    function budgetFor(catId, year, month){
      var id = budgetDocId(year, month, catId);
      return state.budgets.find(function(b){ return b.id===id; });
    }
    function budgetedAmt(catId, year, month){ var b = budgetFor(catId, year, month); return b?(Number(b.target)||0):0; }
    function spentInMonth(catId, year, month){
      return sumBy(entriesInMonth(state.expenseEntries, year, month).filter(function(e){return e.categoryId===catId;}), function(e){return e.amount;});
    }
    function incomeActualInMonth(catId, year, month){
      return sumBy(entriesInMonth(state.incomeEntries, year, month).filter(function(e){return e.categoryId===catId;}), function(e){return e.amount;});
    }
    /* True YNAB rollover: a category's Available balance is the running total, since the
       budget started, of everything assigned to it minus everything spent from it. Underspend
       carries forward as savings; overspend carries forward as a shortfall next month. */
    function availableThrough(catId, year, month){
      var months = monthsFromStartThrough(year, month);
      var total = 0;
      months.forEach(function(ym){ total += budgetedAmt(catId, ym.y, ym.m) - spentInMonth(catId, ym.y, ym.m); });
      return total;
    }

    function totalIncomeActual(year, month){ return sumBy(entriesInMonth(state.incomeEntries, year, month), function(e){return e.amount;}); }
    function totalIncomeBudgeted(year, month){ return sumBy(state.incomeCats, function(c){ return budgetedAmt(c.id, year, month); }); }
    function totalExpenseActual(year, month){ return sumBy(entriesInMonth(state.expenseEntries, year, month), function(e){return e.amount;}); }
    function totalExpenseBudgeted(year, month){ return sumBy(state.expenseCats, function(c){ return budgetedAmt(c.id, year, month); }); }
    function netActual(year, month){ return totalIncomeActual(year,month) - totalExpenseActual(year,month); }
    function netBudgeted(year, month){ return totalIncomeBudgeted(year,month) - totalExpenseBudgeted(year,month); }

    /* Running account balance, computed the same cumulative way as category Available — both
       a "budgeted-track" figure (what the balance would be if you stuck exactly to budget) and
       an "actual-track" figure (what it really is), matching the source spreadsheet's design. */
    function endingBalanceThrough(year, month, track){
      var months = monthsFromStartThrough(year, month);
      var total = Number(state.settings.main.openingBalance)||0;
      months.forEach(function(ym){ total += track==='budgeted' ? netBudgeted(ym.y, ym.m) : netActual(ym.y, ym.m); });
      return total;
    }
    function openingBalanceFor(year, month, track){
      var start = { y:String(state.settings.main.startYear||DEFAULT_YEAR), m:Number(state.settings.main.startMonth)||1 };
      if(ymCompare({y:String(year),m:Number(month)}, start) <= 0) return Number(state.settings.main.openingBalance)||0;
      var prev = prevYM(year, month);
      return endingBalanceThrough(prev.y, prev.m, track);
    }
    function cashBookBalanceAsOf(iso){
      var ym = ymOf(iso);
      if(!ym) return Number(state.settings.main.openingBalance)||0;
      var base = openingBalanceFor(ym.y, ym.m, 'actual');
      var incSoFar = sumBy(entriesInMonth(state.incomeEntries, ym.y, ym.m).filter(function(e){return e.date<=iso;}), function(e){return e.amount;});
      var expSoFar = sumBy(entriesInMonth(state.expenseEntries, ym.y, ym.m).filter(function(e){return e.date<=iso;}), function(e){return e.amount;});
      return base + incSoFar - expSoFar;
    }

    /* "Ready to Assign" (core YNAB concept): money actually received, cumulatively, that
       hasn't yet been given a job in the expense envelopes. */
    function readyToAssignThrough(year, month){
      var months = monthsFromStartThrough(year, month);
      var incomeTotal = 0, assignedTotal = 0;
      months.forEach(function(ym){
        incomeTotal += totalIncomeActual(ym.y, ym.m);
        assignedTotal += totalExpenseBudgeted(ym.y, ym.m);
      });
      return incomeTotal - assignedTotal;
    }

    function copyBudgetsForward(year, month){
      year = year || currentYear(); month = month || currentMonth();
      var existing = state.budgets.filter(function(b){ return String(b.year)===String(year) && Number(b.month)===Number(month); });
      if(existing.length){ toast('This month already has budget amounts set.'); return; }
      var prev = prevYM(year, month);
      var prevBudgets = state.budgets.filter(function(b){ return String(b.year)===prev.y && Number(b.month)===prev.m; });
      if(!prevBudgets.length){ toast('No budget from the previous month to copy.'); return; }
      prevBudgets.forEach(function(b){
        col.budgets.doc(budgetDocId(year, month, b.categoryId)).set({
          categoryId:b.categoryId, kind:b.kind, name:b.name, target:b.target, year:String(year), month:Number(month), updatedAt:new Date().toISOString()
        });
      });
      toast('Copied last month\'s budget forward.');
    }
    function autoCopyBudgetsForward(year, month){
      var existing = state.budgets.filter(function(b){ return String(b.year)===String(year) && Number(b.month)===Number(month); });
      if(existing.length) return;
      var prev = prevYM(year, month);
      var prevBudgets = state.budgets.filter(function(b){ return String(b.year)===prev.y && Number(b.month)===prev.m; });
      if(!prevBudgets.length) return;
      prevBudgets.forEach(function(b){
        col.budgets.doc(budgetDocId(year, month, b.categoryId)).set({
          categoryId:b.categoryId, kind:b.kind, name:b.name, target:b.target, year:String(year), month:Number(month), updatedAt:new Date().toISOString()
        });
      });
    }

    /* ---------------- proper Bank Reconciliation ----------------
       Same tick-off design and Expected Bank Balance formula as BusinessEngine's, adapted to
       Personal's simpler cash model (just income + expense entries — no assets/loans/equity). */
    function allCashMovements(){
      var moves = [];
      state.incomeEntries.forEach(function(e){
        moves.push({ date:e.date, label:(e.description||e.categoryName||'Income'), amount:Number(e.amount)||0, cleared:!!e.cleared, colName:'incomeEntries', id:e.id });
      });
      state.expenseEntries.forEach(function(e){
        moves.push({ date:e.date, label:(e.payee||e.categoryName||'Expense'), amount:-(Number(e.amount)||0), cleared:!!e.cleared, colName:'expenseEntries', id:e.id });
      });
      moves.sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
      return moves;
    }
    function cashMovementsThrough(asOfISO){ return allCashMovements().filter(function(m){ return m.date<=asOfISO; }); }
    function bankRecFor(statementDate){
      var bookBalance = cashBookBalanceAsOf(statementDate);
      var through = cashMovementsThrough(statementDate);
      var outstanding = through.filter(function(m){ return !m.cleared; });
      var unclearedReceipts = sumBy(outstanding.filter(function(m){return m.amount>0;}), function(m){return m.amount;});
      var unclearedPayments = -sumBy(outstanding.filter(function(m){return m.amount<0;}), function(m){return m.amount;});
      var expectedBankBalance = bookBalance - unclearedReceipts + unclearedPayments;
      return { bookBalance:bookBalance, unclearedReceipts:unclearedReceipts, unclearedPayments:unclearedPayments, expectedBankBalance:expectedBankBalance, outstanding:outstanding };
    }

    /* ---------------- render dispatch ---------------- */
    function render(){
      var nav = renderNav();
      var page;
      if(!state.dbAvailable){ page = renderUnavailable(); }
      else {
        page = ({
          overview: renderOverview, income: renderIncome, expense: renderExpense,
          budget: renderBudget, monthly: renderMonthlySummary, annual: renderAnnualSummary,
          compare: renderCompare, reconciliation: renderBankRec,
          ledger: renderGeneralLedger,
          categories: renderCategories, settings: renderSettings,
          documents: renderDocumentsList, documentForm: renderDocumentForm, documentView: renderDocumentView
        }[state.view] || renderOverview)();
      }
      var cfg = currentConfig();
      var ent = state.entities.find(function(e){ return e.id===state.currentEntityId; }) || {};
      app.innerHTML =
        '<aside class="sidebar">' +
          '<button class="nav-toggle" type="button" data-action="toggle-nav" aria-label="Menu" aria-expanded="false"></button>' +
          '<button class="back-to-home" type="button" data-action="close-entity">← All entities</button>' +
          '<div class="brand"><div class="mark"><span class="seal">'+cfg.icon+'</span>'+esc(ent.name||cfg.label)+'</div>' +
          '<div class="period">' + renderPeriodSelect() + '</div></div>' +
          nav +
          '<div class="sidebar-foot">' +
            renderFileLinkBlock() +
            '<div class="backup-actions">' +
              '<button class="btn btn-ghost btn-sm" type="button" data-action="export-data" style="width:100%;margin-bottom:6px;">⭳ Backup data</button>' +
              '<button class="btn btn-ghost btn-sm" type="button" data-action="import-data" style="width:100%;">⭱ Restore data</button>' +
              '<input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">' +
            '</div>' +
            '<div style="margin-top:10px;">'+esc(state.settings.main.name||ent.name||'Personal')+' budget<br>Give every pound a job.<br>' + esc(footerStorageNote()) + '</div>' +
          '</div>' +
        '</aside>' +
        '<div class="main">' + page + '</div>';
      bindHandlers();
    }
    function renderNav(){
      function item(id, icon, label){
        var active = state.view===id || (id==='documents' && (state.view==='documentForm' || state.view==='documentView'));
        var cls = 'navlink' + (active?' active':'');
        return '<button class="'+cls+'" data-nav="'+id+'" title="'+esc(label)+'" aria-label="'+esc(label)+'"><span class="ico">'+icon+'</span><span class="label">'+esc(label)+'</span></button>';
      }
      return '<nav class="primary">' +
        '<div class="navlabel">Ledger</div>' +
        item('overview','◈','Overview') +
        item('income','↧','Income') +
        item('expense','↥','Expenses') +
        '<div class="navlabel">Billing</div>' +
        item('documents','🧾','Invoices & Receipts') +
        '<div class="navlabel">Budget</div>' +
        item('budget','◔','Budget (Envelopes)') +
        '<div class="navlabel">Reports</div>' +
        item('monthly','☰','Monthly Summary') +
        item('annual','▥','Annual Summary') +
        item('compare','⇄','Compare Years') +
        item('ledger','📒','General Ledger') +
        item('reconciliation','🏛','Bank Reconciliation') +
        '<div class="navlabel">Registers</div>' +
        item('categories','▤','Categories') +
        item('settings','⚙','Settings') +
        '</nav>';
    }
    function renderPeriodSelect(){
      var years = availableYears();
      var nextYear = String(Number(years[years.length-1])+1);
      var prevYear = String(Number(years[0])-1);
      var allYears = [prevYear].concat(years).concat([nextYear]);
      var selY = currentYear();
      if(allYears.indexOf(selY)===-1) allYears.push(selY);
      var yOpts = allYears.slice().reverse().map(function(y){
        return '<option value="'+y+'"'+(y===selY?' selected':'')+'>'+y+'</option>';
      }).join('');
      var selM = currentMonth();
      var mOpts = MONTH_NAMES.map(function(name, idx){
        var m = idx+1;
        return '<option value="'+m+'"'+(m===Number(selM)?' selected':'')+'>'+name+'</option>';
      }).join('');
      return '<select id="month-select" class="year-select" title="Switch month" style="margin-bottom:6px;">'+mOpts+'</select>' +
        '<select id="year-select" class="year-select" title="Switch year">'+yOpts+'</select>';
    }

    /* ---------------- Overview ---------------- */
    function renderOverview(){
      var year = currentYear(), month = currentMonth();
      var incAct = totalIncomeActual(year, month), incBud = totalIncomeBudgeted(year,month);
      var expAct = totalExpenseActual(year, month), expBud = totalExpenseBudgeted(year,month);
      var net = incAct - expAct;
      var rta = readyToAssignThrough(year, month);
      var endBal = endingBalanceThrough(year, month, 'actual');

      var overspent = categoryList().filter(function(c){ return c.active!==false; }).map(function(c){
        return { c:c, avail: availableThrough(c.id, year, month) };
      }).filter(function(x){ return x.avail < -0.005; }).sort(function(a,b){ return a.avail-b.avail; });

      var overspentRows = overspent.length ? overspent.slice(0,8).map(function(x){
        return '<tr><td>'+esc(x.c.name)+'</td><td class="num-col expense">'+fmtMoney(x.avail)+'</td></tr>';
      }).join('') : '<tr><td colspan="2"><div class="empty">No categories are overspent — nice work.</div></td></tr>';

      var recent = state.incomeEntries.map(function(e){ return Object.assign({kind:'income'},e); })
        .concat(state.expenseEntries.map(function(e){ return Object.assign({kind:'expense'},e); }))
        .sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''); })
        .slice(0,8);
      var recentRows = recent.length ? recent.map(function(e){
        return '<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.kind==='income'?(e.description||e.categoryName):(e.payee||e.categoryName))+'</td>'+
          '<td><span class="pill">'+esc(e.categoryName)+'</span></td>'+
          '<td class="num-col '+e.kind+'">'+fmtMoney(e.amount)+'</td></tr>';
      }).join('') : '<tr><td colspan="4"><div class="empty">No transactions recorded yet.</div></td></tr>';

      return topbar('Overview', periodLabel(year, month)) +
        '<div class="content">' +
          '<div class="stats">' +
            stat('Ready to Assign', fmtMoney(rta), rta<0 ? 'Budgeted more than received' : 'Money not yet given a job', rta<0?'expense':'income') +
            stat('Income this month', fmtMoney(incAct), 'Budgeted '+fmtMoney(incBud), 'income') +
            stat('Expenses this month', fmtMoney(expAct), 'Budgeted '+fmtMoney(expBud), 'expense') +
            stat('Net this month', fmtMoney(net), net>=0?'Under budget':'Over budget') +
            stat('Account balance', fmtMoney(endBal), 'As at end of '+periodLabel(year,month)) +
          '</div>' +
          '<div class="two-col" style="margin-top:18px;">' +
            '<div class="panel"><div class="panel-pad"><div class="section-title"><h2>Categories overspent</h2><span class="desc">Negative Available — needs a top-up or a smaller budget elsewhere</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Category</th><th style="text-align:right;">Available</th></tr></thead><tbody>'+overspentRows+'</tbody></table></div></div></div>' +
            '<div class="panel"><div class="panel-pad"><div class="section-title"><h2>Recent activity</h2><span class="desc">Last 8 transactions, any month</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'+recentRows+'</tbody></table></div></div></div>' +
          '</div>' +
        '</div>';
    }

    /* ---------------- Income ---------------- */
    function renderIncome(){
      var year = currentYear(), month = currentMonth();
      var activeCats = incomeCatList().filter(function(c){return c.active!==false;});
      var q = state.incomeSearch.trim().toLowerCase();
      var monthRows = entriesInMonth(state.incomeEntries, year, month);
      var rows = monthRows.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''); });
      if(q) rows = rows.filter(function(e){ return (e.categoryName||'').toLowerCase().indexOf(q)>-1 || (e.description||'').toLowerCase().indexOf(q)>-1; });

      var catOptions = activeCats.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('');
      var editing = state.editingIncomeId ? state.incomeEntries.find(function(e){return e.id===state.editingIncomeId;}) : null;

      var tableRows = rows.length ? rows.map(function(e){
        return '<tr>' +
          '<td>'+fmtDate(e.date)+'</td>' + '<td>'+esc(e.description||'—')+'</td>' +
          '<td><span class="pill">'+esc(e.categoryName)+'</span></td>' +
          '<td class="num-col income">'+fmtMoney(e.amount)+'</td>' +
          '<td class="note">'+esc(e.note||'')+'</td>' +

              '<div class="field"><label for="inc-amount">Amount (£)</label><input type="number" id="inc-amount" min="0" step="0.01" placeholder="0.00" required value="'+(editing?esc(editing.amount):'')+'"></div>' +
              '<div class="field wide"><label for="inc-note">Note (optional)</label><input type="text" id="inc-note" placeholder="e.g. bank transfer ref…" value="'+(editing?esc(editing.note||''):'')+'"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">'+(editing?'💾 Save changes':'＋ Add entry')+'</button></div>' +

          '<div class="panel" style="margin-top:18px;"><div class="panel-pad">' +
