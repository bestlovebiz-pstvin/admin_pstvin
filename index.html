    /* ---------------- Bank Reconciliation (proper tick-off, replaces both apps' free-text version) ---------------- */
    function renderBankRec(){
      var recs = state.bankReconciliations.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
      var selectedId = state.selectedBankRecId && recs.some(function(r){ return r.id===state.selectedBankRecId; }) ? state.selectedBankRecId : (recs[0] ? recs[0].id : null);
      var selected = recs.find(function(r){ return r.id===selectedId; });
      var recOptions = recs.map(function(r){ return '<option value="'+r.id+'"'+(r.id===selectedId?' selected':'')+'>'+fmtDate(r.date)+' — statement '+fmtMoney(r.statementBalance)+'</option>'; }).join('');

      var summary;
      if(selected){
        var br = bankRecFor(selected.date);
        var variance = br.expectedBankBalance - Number(selected.statementBalance);
        var ok = Math.abs(variance) < 0.5;
        var outstandingRows = br.outstanding.length ? br.outstanding.map(function(m){
          return '<tr><td>'+fmtDate(m.date)+'</td><td>'+esc(m.label)+'</td>' +
            '<td class="num-col'+(m.amount>0?' income':' expense')+'">'+fmtMoney(m.amount)+'</td>' +
            '<td class="actions no-print"><label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;"><input type="checkbox" data-clear-move data-clear-col="'+m.colName+'" data-clear-id="'+m.id+'"> Cleared</label></td></tr>';
        }).join('') : '<tr><td colspan="4"><div class="empty">Nothing outstanding — every entry up to this date has been ticked off.</div></td></tr>';
        summary =
          '<div class="stat-row">' +
            stat('Balance per Cash Book', fmtMoney(br.bookBalance), 'as at '+fmtDate(selected.date)) +
            stat('Uncleared receipts', fmtMoney(br.unclearedReceipts), 'not yet on the statement') +
            stat('Uncleared payments', fmtMoney(br.unclearedPayments), 'not yet on the statement') +
            stat('Expected Bank Balance', fmtMoney(br.expectedBankBalance), 'cash book adjusted for outstanding items') +
          '</div>' +
          '<div class="banner '+(ok?'info':'warn')+'" style="margin-top:16px;">'+(ok?'✅ Reconciled — the expected bank balance matches the statement balance you entered ('+fmtMoney(selected.statementBalance)+').':'⚠ Variance of '+fmtMoney(variance)+' between the expected bank balance and the statement balance ('+fmtMoney(selected.statementBalance)+') — check for a missing entry, an item ticked off in error, or a mistyped statement balance.')+'</div>' +
          '<div class="panel" style="margin-top:16px;"><div class="panel-pad">' +
            '<div class="section-title"><h2>Outstanding items as at '+fmtDate(selected.date)+'</h2><span class="desc">Recorded in the books but not yet ticked off against the bank statement</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right;">Amount</th><th class="no-print"></th></tr></thead><tbody>'+outstandingRows+'</tbody></table></div>' +
          '</div></div>';
      } else {
        summary = '<div class="panel panel-pad" style="margin-top:16px;"><div class="empty">Add a bank statement below to run your first reconciliation.</div></div>';
      }
      var historyRows = recs.length ? recs.map(function(r){
        var brh = bankRecFor(r.date);
        var v = brh.expectedBankBalance - Number(r.statementBalance);
        var badge = Math.abs(v) < 0.5 ? '<span class="status-pill good">Reconciled</span>' : '<span class="status-pill over">Variance '+fmtMoney(v)+'</span>';
        return '<tr><td>'+fmtDate(r.date)+'</td><td class="num-col">'+fmtMoney(r.statementBalance)+'</td><td>'+badge+'</td><td class="note">'+esc(r.note||'')+'</td>' +
          '<td class="actions no-print"><button class="btn btn-ghost btn-sm" data-del-bankrec="'+r.id+'">Delete</button></td></tr>';
      }).join('') : '<tr><td colspan="5"><div class="empty">No reconciliations recorded yet.</div></td></tr>';

      return topbar('Bank Reconciliation', 'Tick off the cash book against your bank statement', true) +
        '<div class="content">' +
          '<div class="banner info">◈ Enter your bank statement’s closing balance and date below, then tick off each item as it appears on the statement. The Expected Bank Balance is the cash book balance adjusted for anything still outstanding — it should match the statement once everything is ticked.</div>' +
          '<div class="panel panel-pad no-print" style="margin-top:16px;">' +
            '<div class="section-title"><h2>New reconciliation</h2></div>' +
            '<form class="entry-form" id="bankrec-form" autocomplete="off">' +
              '<div class="field"><label for="bankrec-date">Statement date</label><input type="date" id="bankrec-date" required value="'+todayISO()+'"></div>' +
              '<div class="field"><label for="bankrec-balance">Statement closing balance (£)</label><input type="number" id="bankrec-balance" step="0.01" placeholder="0.00" required></div>' +
              '<div class="field wide"><label for="bankrec-note">Note (optional)</label><input type="text" id="bankrec-note" placeholder="e.g. current account, sheet 47"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">＋ Save reconciliation</button></div>' +
            '</form>' +
          '</div>' +
          (recs.length>1 ? '<div class="panel panel-pad no-print" style="margin-top:16px;"><div class="field"><label for="bankrec-select">Viewing reconciliation</label><select id="bankrec-select">'+recOptions+'</select></div></div>' : '') +
          summary +
          '<div class="panel" style="margin-top:18px;"><div class="panel-pad">' +
            '<div class="section-title"><h2>Reconciliation history</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Statement date</th><th style="text-align:right;">Statement balance</th><th>Status</th><th>Note</th><th></th></tr></thead><tbody>'+historyRows+'</tbody></table></div>' +
          '</div></div>' +
        '</div>';
    }

    /* ---------------- event handlers ---------------- */
    function bindHandlers(){
      Array.prototype.forEach.call(app.querySelectorAll('[data-nav]'), function(btn){
        btn.addEventListener('click', function(){ state.view = btn.getAttribute('data-nav'); render(); });
      });
      var backBtn = app.querySelector('[data-action="close-entity"]');
      if(backBtn){ backBtn.addEventListener('click', function(){ closeEntity(); }); }
      var yearSelect = document.getElementById('year-select');
      if(yearSelect){ yearSelect.addEventListener('change', function(){ switchYear(yearSelect.value); }); }

      /* ---- Income ---- */
      var incomeForm = document.getElementById('income-form');
      if(incomeForm){
        incomeForm.addEventListener('submit', function(ev){
          ev.preventDefault();
          var c = cfg();
          var date = document.getElementById('inc-date').value;
          var giverEl = document.getElementById('inc-giver');
          var giverId = giverEl ? giverEl.value : '';
          var catId = document.getElementById('inc-cat').value;
          var desc = document.getElementById('inc-desc').value.trim();
          var note = document.getElementById('inc-note').value.trim();
          var amount, giftAid = 0;
          if(c.hasGiftAid){
            amount = parseFloat(document.getElementById('inc-gross').value);
            giftAid = parseFloat(document.getElementById('inc-giftaid').value) || 0;
          } else {
            amount = parseFloat(document.getElementById('inc-amount').value);
          }
          if(!date || !catId || !(amount>=0) || ((c.hasFunders||c.hasDonors) && !giverId)) return;
          var editingId = incomeForm.getAttribute('data-editing-id');
          if(editingId){ updateIncomeEntry(editingId, date, giverId, catId, desc, amount, giftAid, note); return; }
          addIncomeEntry(date, giverId, catId, desc, amount, giftAid, note);
          incomeForm.reset();
          document.getElementById('inc-date').value = date;
        });
      }
      var cancelEditIncome = app.querySelector('[data-action="cancel-edit-income"]');
      if(cancelEditIncome){ cancelEditIncome.addEventListener('click', function(){ state.editingIncomeId = null; render(); }); }
      var incomeSearch = document.getElementById('income-search');
      if(incomeSearch){
        incomeSearch.addEventListener('input', function(){
          state.incomeSearch = incomeSearch.value; render();
          var el = document.getElementById('income-search');
          if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        });
      }
      Array.prototype.forEach.call(app.querySelectorAll('[data-edit-income]'), function(btn){
        btn.addEventListener('click', function(){
          state.editingIncomeId = btn.getAttribute('data-edit-income'); render();
          var form = document.getElementById('income-form');
          if(form) form.scrollIntoView({behavior:'smooth', block:'start'});
        });
      });
      Array.prototype.forEach.call(app.querySelectorAll('[data-del-income]'), function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-del-income');
          if(state.editingIncomeId===id) state.editingIncomeId = null;
          col.incomeEntries.doc(id).delete().catch(function(){ toast('Could not delete — try again.'); });
        });
      });

      /* ---- Expense ---- */
      var expIsAsset = document.getElementById('exp-is-asset');
      var expAssetCat = document.getElementById('exp-asset-cat');
      if(expIsAsset && expAssetCat){
        expIsAsset.addEventListener('change', function(){ expAssetCat.style.display = expIsAsset.checked ? '' : 'none'; });
      }
      var expenseForm = document.getElementById('expense-form');
      if(expenseForm){
        expenseForm.addEventListener('submit', function(ev){
          ev.preventDefault();
          var c = cfg();
          var date = document.getElementById('exp-date').value;
          var desc = document.getElementById('exp-desc').value.trim();
          var catId = document.getElementById('exp-cat').value;
          var note = document.getElementById('exp-note').value.trim();
          var units = parseFloat(document.getElementById('exp-units').value) || 0;
          var unitLabel = document.getElementById('exp-unitlabel').value.trim();
          var isAsset = document.getElementById('exp-is-asset') ? document.getElementById('exp-is-asset').checked : false;
          var assetCatId = document.getElementById('exp-asset-cat') ? document.getElementById('exp-asset-cat').value : '';
          var amount, vat = 0;
          if(c.hasVAT){
            amount = parseFloat(document.getElementById('exp-gross').value);
            vat = parseFloat(document.getElementById('exp-vat').value) || 0;
          } else {
            amount = parseFloat(document.getElementById('exp-amount').value);
          }
          if(!date || !catId || !(amount>=0)) return;
          var allocations = null;
          if(c.hasFunders){
            allocations = {};
            activeGivers().forEach(function(g){
              var el = document.getElementById('alloc-'+g.id);
              var v = el ? parseFloat(el.value) : NaN;
              if(v>0) allocations[g.id] = v;
            });
          }
          var editingExpId = expenseForm.getAttribute('data-editing-id');
          if(editingExpId){ updateExpenseEntry(editingExpId, date, desc, catId, amount, vat, note, units, unitLabel, isAsset, assetCatId, allocations); return; }
          addExpenseEntry(date, desc, catId, amount, vat, note, units, unitLabel, isAsset, assetCatId, allocations);
          expenseForm.reset();
          document.getElementById('exp-date').value = date;
          if(expAssetCat) expAssetCat.style.display = 'none';
        });
      }
      var cancelEditExpense = app.querySelector('[data-action="cancel-edit-expense"]');
      if(cancelEditExpense){ cancelEditExpense.addEventListener('click', function(){ state.editingExpenseId = null; render(); }); }
      var expenseSearch = document.getElementById('expense-search');
      if(expenseSearch){
        expenseSearch.addEventListener('input', function(){
          state.expenseSearch = expenseSearch.value; render();
          var el = document.getElementById('expense-search');
          if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        });
      }
      Array.prototype.forEach.call(app.querySelectorAll('[data-edit-expense]'), function(btn){
        btn.addEventListener('click', function(){
          state.editingExpenseId = btn.getAttribute('data-edit-expense'); render();
          var form = document.getElementById('expense-form');
          if(form) form.scrollIntoView({behavior:'smooth', block:'start'});
        });
      });
      Array.prototype.forEach.call(app.querySelectorAll('[data-del-expense]'), function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-del-expense');
          if(state.editingExpenseId===id) state.editingExpenseId = null;
          col.expenseEntries.doc(id).delete().catch(function(){ toast('Could not delete — try again.'); });
        });
      });

      /* ---- Givers ---- */
      var giverForm = document.getElementById('giver-form');
      if(giverForm){
        giverForm.addEventListener('submit', function(ev){
          ev.preventDefault();
          var name = document.getElementById('giver-name').value.trim();
          var fundEl = document.getElementById('giver-fundtype');
          var fundType = fundEl ? fundEl.value : cfg().fundTypes[0];
          if(!name) return;
          addGiver(name, fundType);
          giverForm.reset();
        });
      }
      Array.prototype.forEach.call(app.querySelectorAll('[data-giver-active]'), function(cb){
        cb.addEventListener('change', function(){
          col.givers.doc(cb.getAttribute('data-giver-active')).update({ active: cb.checked }).catch(function(){ toast('Could not update — try again.'); });
        });
      });
      Array.prototype.forEach.call(app.querySelectorAll('[data-del-giver]'), function(btn){
        btn.addEventListener('click', function(){
          if(!confirm('Remove this '+cfg().giverNoun.toLowerCase()+'? Existing entries keep their name on file.')) return;
          col.givers.doc(btn.getAttribute('data-del-giver')).delete().catch(function(){ toast('Could not delete — try again.'); });
        });
      });

      /* ---- Giver Profiles (phone/email/address -- separate from the register above) ---- */
      var giverProfileSearch = document.getElementById('giver-profile-search');
      if(giverProfileSearch){
        giverProfileSearch.addEventListener('input', function(){
          state.giverProfileSearch = giverProfileSearch.value; render();
          var el = document.getElementById('giver-profile-search');
          if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        });
      }
      Array.prototype.forEach.call(app.querySelectorAll('[data-giver-field]'), function(inp){
        inp.addEventListener('change', function(){
          var patch = {};
          patch[inp.getAttribute('data-giver-field')] = inp.value.trim();
          col.givers.doc(inp.getAttribute('data-giver-id')).update(patch).catch(function(){ toast('Could not save — try again.'); });
        });
      });
      var giverReportSearch = document.getElementById('giver-report-search');
      if(giverReportSearch){
        giverReportSearch.addEventListener('input', function(){
          state.giverReportSearch = giverReportSearch.value; render();
          var el = document.getElementById('giver-report-search');
          if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
        });
      }
      var donorRankCat = document.getElementById('donor-rank-cat');
      if(donorRankCat){ donorRankCat.addEventListener('change', function(){ state.donorRankCategory = donorRankCat.value; render(); }); }
      var stmtGiver = document.getElementById('stmt-giver');
      if(stmtGiver){ stmtGiver.addEventListener('change', function(){ state.statementGiverId = stmtGiver.value; render(); }); }

    /* ---------------- write helpers ---------------- */
    function addIncomeEntry(date, giverId, catId, desc, amount, giftAid, note){
      var cat = state.incomeCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      var c = cfg();
      var data = { date:date, categoryId:cat.id, categoryName:cat.name, description:desc||'', note:note||'', createdAt:new Date().toISOString() };
      if(c.hasFunders || c.hasDonors){
        var giver = giverById(giverId);
        if(giver){ data.giverId = giver.id; data.giverName = giver.name; data.fundType = giver.fundType || c.fundTypes[0]; }
      }
      if(c.hasGiftAid){ data.giftAid = giftAid||0; data.amount = (Number(amount)||0) + (Number(giftAid)||0); }
      else { data.amount = amount; }
      col.incomeEntries.add(data).then(function(){ toast('Income recorded.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addExpenseEntry(date, desc, catId, amount, vat, note, units, unitLabel, isAsset, assetCatId, allocations){
      var cat = state.expenseCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      var c = cfg();
      var data = { date:date, description:desc||'', categoryId:cat.id, categoryName:cat.name, note:note||'', createdAt:new Date().toISOString() };
      if(c.hasVAT){ data.vat = vat||0; data.amount = (Number(amount)||0) - (Number(vat)||0); }
      else { data.amount = amount; }
      if(units>0){ data.units = units; data.unitLabel = unitLabel||''; }
      if(c.hasFunders && allocations && Object.keys(allocations).length) data.allocations = allocations;
      if(isAsset) data.isAsset = true;
      col.expenseEntries.add(data).then(function(res){
        if(isAsset && assetCatId){
          var assetCat = state.assetCats.find(function(ac){ return ac.id===assetCatId; });
          if(assetCat){
            col.assets.add({ description:desc||cat.name, categoryId:assetCat.id, categoryName:assetCat.name, value:data.amount, dateAcquired:date, note:'Auto-added from expenditure entry', sourceExpenseId:res.id, createdAt:new Date().toISOString() });
          }
        }
        toast('Expenditure recorded.');
      }).catch(function(){ toast('Could not save — try again.'); });
    }
    /* Corrects an existing entry in place (wrong amount, wrong giver, category change from an
       ordinary/expendable category to a fixed asset, etc.) rather than deleting and re-adding
       it. Deleting the entry outright is still available via the row's Delete button. */
    function updateIncomeEntry(id, date, giverId, catId, desc, amount, giftAid, note){
      var cat = state.incomeCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      var c = cfg();
      var data = { date:date, categoryId:cat.id, categoryName:cat.name, description:desc||'', note:note||'' };
      if(c.hasFunders || c.hasDonors){
        var giver = giverById(giverId);
        if(giver){ data.giverId = giver.id; data.giverName = giver.name; data.fundType = giver.fundType || c.fundTypes[0]; }
      }
      if(c.hasGiftAid){ data.giftAid = giftAid||0; data.amount = (Number(amount)||0) + (Number(giftAid)||0); }
      else { data.amount = amount; }
      col.incomeEntries.doc(id).update(data)
        .then(function(){ state.editingIncomeId = null; toast('Income entry updated.'); render(); })
        .catch(function(){ toast('Could not save — try again.'); });
    }
    /* Keeps the auto-linked Fixed Assets record (if any) in sync with an edited expense entry:
       creates one if the entry is newly marked as an asset, updates it if it's still an asset
       but the amount/date/description/category changed, and removes it if the entry is no
       longer marked as an asset (e.g. re-categorised from an expendable item back to a plain
       expense) — exactly the "materials vs fixed asset" correction this is for. */
    function syncLinkedAsset(expenseId, isAsset, assetCatId, desc, catName, amount, date){
      var existing = state.assets.find(function(a){ return a.sourceExpenseId===expenseId; });
      if(isAsset && assetCatId){
        var assetCat = state.assetCats.find(function(ac){ return ac.id===assetCatId; });
        if(!assetCat) return;
        if(existing){
          col.assets.doc(existing.id).update({ description:desc||catName, categoryId:assetCat.id, categoryName:assetCat.name, value:amount, dateAcquired:date });
        } else {
          col.assets.add({ description:desc||catName, categoryId:assetCat.id, categoryName:assetCat.name, value:amount, dateAcquired:date, note:'Auto-added from expenditure entry', sourceExpenseId:expenseId, createdAt:new Date().toISOString() });
        }
      } else if(existing){
        col.assets.doc(existing.id).delete();
      }
    }
    function updateExpenseEntry(id, date, desc, catId, amount, vat, note, units, unitLabel, isAsset, assetCatId, allocations){
      var cat = state.expenseCats.find(function(c){ return c.id===catId; });
      if(!cat) return;
      var c = cfg();
      var data = { date:date, description:desc||'', categoryId:cat.id, categoryName:cat.name, note:note||'' };
      if(c.hasVAT){ data.vat = vat||0; data.amount = (Number(amount)||0) - (Number(vat)||0); }
      else { data.amount = amount; }
      data.units = units>0 ? units : 0;
      data.unitLabel = units>0 ? (unitLabel||'') : '';
      if(c.hasFunders) data.allocations = (allocations && Object.keys(allocations).length) ? allocations : {};
      data.isAsset = !!isAsset;
      col.expenseEntries.doc(id).update(data)
        .then(function(){
          syncLinkedAsset(id, isAsset, assetCatId, desc, cat.name, data.amount, date);
          state.editingExpenseId = null; toast('Expenditure entry updated.'); render();
        })
        .catch(function(){ toast('Could not save — try again.'); });
    }
    function addCategory(kind, name, group){
      var col2 = catColFor(kind);
      var list = catListFor(kind);
      if(list.some(function(c){ return c.active!==false && byNameCI(c.name, name); })){ toast('That category already exists.'); return; }
      var maxOrder = list.reduce(function(m,c){ return Math.max(m, c.order||0); }, 0);
      var data = { name:name, order:maxOrder+1, custom:true, active:true };
      var groups = groupsFor(kind);
      data.group = groups ? (group || groups[0]) : '';
      col2.add(data).then(function(){ toast('Category added.'); }).catch(function(){ toast('Could not add category.'); });
    }
    function addGiver(name, fundType){
      var c = cfg();
      if(state.givers.some(function(g){ return g.active!==false && byNameCI(g.name, name); })){ toast('That '+c.giverNoun.toLowerCase()+' already exists.'); return; }
      var maxOrder = state.givers.reduce(function(m,g){ return Math.max(m, g.order||0); }, 0);
      var data = { name:name, order:maxOrder+1, active:true, createdAt:new Date().toISOString() };
      if(c.hasFundColumns) data.fundType = fundType || c.fundTypes[0];
      col.givers.add(data).then(function(){ toast(c.giverNoun+' added.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addAssetCategory(name){
      if(state.assetCats.some(function(c){ return c.active!==false && byNameCI(c.name, name); })){ toast('That category already exists.'); return; }
      var maxOrder = state.assetCats.reduce(function(m,c){ return Math.max(m, c.order||0); }, 0);
      col.assetCats.add({ name:name, order:maxOrder+1, custom:true, active:true }).then(function(){ toast('Category added.'); }).catch(function(){ toast('Could not add category.'); });
    }
    function addAsset(desc, categoryId, value, dateAcquired, note){
      var assetCat = state.assetCats.find(function(c){ return c.id===categoryId; });
      if(!assetCat) return;
      col.assets.add({ description:desc, categoryId:assetCat.id, categoryName:assetCat.name, value:value, dateAcquired:dateAcquired||'', note:note||'', createdAt:new Date().toISOString() })
        .then(function(){ toast('Asset added.'); }).catch(function(){ toast('Could not save — try again.'); });
    }
    function addBankReconciliation(date, statementBalance, note){
      col.bankReconciliations.add({ date:date, statementBalance:statementBalance, note:note||'', createdAt:new Date().toISOString() })
        .then(function(res){ state.selectedBankRecId = res.id; toast('Reconciliation saved.'); }).catch(function(){ toast('Could not save — try again.'); });
    }

    /* ---------------- subscriptions ---------------- */
    /* LocalDB's notify() (see localdb.txt) fires EVERY onSnapshot listener on ANY save() to ANY
       collection, not just the one that changed — so a single field's save anywhere can trigger
       every one of the re-render calls below. Route them all through this guard so that, while
       the user is on the Giver Profiles page, none of them tear down and rebuild #app mid-edit
       (see the note on the givers listener below for why that matters); every other view keeps
       re-rendering exactly as before. */
    function autoRender(){ if(state.view !== 'giverProfiles') render(); }
    function subscribeAll(){
      col.incomeCats = db.collection(ns('incomeCategories'));
      col.expenseCats = db.collection(ns('expenseCategories'));
      col.incomeEntries = db.collection(ns('incomeEntries'));
      col.expenseEntries = db.collection(ns('expenseEntries'));
      col.givers = db.collection(ns('givers'));
      col.assetCats = db.collection(ns('assetCategories'));
      col.assets = db.collection(ns('assets'));
      col.budgets = db.collection(ns('budgets'));
      col.bankReconciliations = db.collection(ns('bankReconciliations'));
      col.documents = db.collection(ns('documents'));

      track(col.incomeCats.onSnapshot(function(snap){ state.incomeCats = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.expenseCats.onSnapshot(function(snap){ state.expenseCats = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.incomeEntries.onSnapshot(function(snap){ state.incomeEntries = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.expenseEntries.onSnapshot(function(snap){ state.expenseEntries = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.givers.onSnapshot(function(snap){
        state.givers = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());});
        /* Skip the full-page re-render while the user is actively editing the Giver Profiles
           table: that page's inline phone/email/address inputs each save independently on
           'change', and a synchronous full-DOM rebuild triggered by one field's save can race
           the browser's native focus transfer to (or interrupt in-progress typing in) a
           neighbouring field, corrupting or dropping its value. The underlying data is still
           updated above; only the redraw is deferred until the user leaves this view, where a
           fresh render() (from whatever nav/view change follows) will reflect it correctly. */
        autoRender();
      }));
      track(col.assetCats.onSnapshot(function(snap){ state.assetCats = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.assets.onSnapshot(function(snap){ state.assets = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.budgets.onSnapshot(function(snap){ state.budgets = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.bankReconciliations.onSnapshot(function(snap){ state.bankReconciliations = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));
      track(col.documents.onSnapshot(function(snap){ state.documents = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); autoRender(); }));

      col.settings = db.doc(ns('settings')+'/main');
      track(col.settings.onSnapshot(function(snap){ if(snap.exists) state.settings.main = snap.data(); autoRender(); }));

      subscribeBalancesForYear(currentYear());
    }

    var balancesUnsub = null;
    function subscribeBalancesForYear(year){
      if(balancesUnsub){ balancesUnsub(); balancesUnsub = null; }
      col.balances = db.doc(ns('balances')+'/'+year);
      balancesUnsub = col.balances.onSnapshot(function(snap){
        var fields = {}; openingFieldsFor().forEach(function(f){ fields[f]=0; });
        if(snap.exists){ state.balances = Object.assign({_year:year}, fields, snap.data()); }
        else { state.balances = Object.assign({_year:year}, fields); maybeCarryForwardBalance(year); }
        autoRender();
      });
      track(balancesUnsub);
    }
    /* If this year has no opening-balance doc yet but the previous year does, carry its
       closing position forward automatically — matches BEST's/LWNG's own year-end behaviour,
       so a new fiscal year opens with last year's numbers rather than zero. */
    function maybeCarryForwardBalance(year){
      if(state.balances && state.balances.updatedAt) return;
      var prevYear = prevYearKey(year);
      var prevSnap = db.peek(ns('balances')+'/'+prevYear);
      if(!prevSnap.exists) return;
      var prevBal = prevSnap.data();
      var fb = fundBreakdown(prevYear);
      var data = { _year:year, carriedForward:true, updatedAt:new Date().toISOString() };
      openingFieldsFor().forEach(function(f){
        if(cfg().hasFundColumns){
          var ft = f.replace(/^opening/, '');
          data[f] = fundOpeningTotal(prevBal, ft) + (fb[ft] ? fb[ft].net : 0);
        } else {
          data[f] = Number(prevBal[f])||0;
        }
      });
      if(!cfg().hasFundColumns){
        // church: opening bank/cash carried forward as the single closing cash total, kept in openingBank
        var closing = openingTotal(prevBal) + sumBy(entriesInYear(state.incomeEntries, prevYear), function(e){return e.amount;}) - sumBy(entriesInYear(state.expenseEntries, prevYear), function(e){return e.amount;});
        data.openingBank = closing; data.openingCash = 0;
      }
      state.balances = data;
    }
    function switchYear(year){
      state.selectedYear = year;
      subscribeBalancesForYear(year);
      render();
    }
    function copyBalancesForward(){
      var year = currentYear();
      var prevYear = prevYearKey(year);
      db.doc(ns('balances')+'/'+prevYear).get().then(function(snap){
        if(!snap.exists){ toast('No balances found for '+fiscalYearLabel(prevYear)+' to copy.'); return; }
        var prev = snap.data();
        col.balances.set(Object.assign({}, prev, {updatedAt:new Date().toISOString()})).then(function(){ toast('Copied balances from '+fiscalYearLabel(prevYear)+'.'); render(); });
      });
    }

    return { render: render, bindHandlers: bindHandlers, subscribeAll: subscribeAll };
  })();

  /* ================== boot ================== */

  /* See GIVER_PROFILE_PATCH in prelude.txt for why this exists: SEED_DATA only ever reaches a
     brand-new, never-opened copy of this file, so a later delivery of the same file with newly
     matched giver contact details needs its own way to reach someone who has already started
     using an earlier copy. Runs on every boot; a no-op once every patched field has already been
     applied (or was never blank to begin with). */
  function applyGiverProfilePatch(){
    if(typeof GIVER_PROFILE_PATCH === 'undefined') return;
    var ids = Object.keys(GIVER_PROFILE_PATCH);
    if(!ids.length) return;
    var col = LocalDB.collection('ent_lwng_church__givers');
    ids.forEach(function(giverId){
      col.doc(giverId).get().then(function(snap){
        if(!snap.exists) return;
        var cur = snap.data();
        var patch = GIVER_PROFILE_PATCH[giverId];
        var toApply = {};
        var changed = false;
        ['phone','email','address'].forEach(function(f){
          if(patch[f] && !cur[f]){ toApply[f] = patch[f]; changed = true; }
        });
        if(changed) col.doc(giverId).update(toApply);
      });
    });
  }

  /* See BEST_ACCOUNTS_PATCH in prelude.txt. Brings BEST Initiatives' real financial history to a
     copy that's already in use, without ever duplicating or overwriting anything the user has
     entered themselves: custom categories/funders are added only if missing by name/id; income,
     expense, assets and opening balances are only added if those collections are CURRENTLY
     completely empty; settings fields are filled in only where currently blank. Runs on every
     boot; a no-op once already applied (or if the entity's own data has since moved on). */
  function applyBestAccountsPatch(){
    if(typeof BEST_ACCOUNTS_PATCH === 'undefined') return;
    var patch = BEST_ACCOUNTS_PATCH;
    if(!patch || !Object.keys(patch).length) return;
    var entityId = 'best_initiatives';
    function ns(name){ return 'ent_' + entityId + '__' + name; }
    function snapshotOnce(name){
      var result = null;
      var unsub = LocalDB.collection(ns(name)).onSnapshot(function(snap){ result = snap; });
      if(unsub) unsub();
      return result;
    }
    function ensureCategories(collName, extras, isIncome){
      var snap = snapshotOnce(collName);
      var nameToId = {}; var maxOrder = 0;
      snap.docs.forEach(function(d){
        var v = d.data();
        nameToId[String(v.name||'').toLowerCase()] = d.id;
        if(Number(v.order) > maxOrder) maxOrder = Number(v.order);
      });
      var col = LocalDB.collection(ns(collName));
      (extras || []).forEach(function(item){
        var name = isIncome ? item : item[0];
        var group = isIncome ? '' : item[1];
        var key = name.toLowerCase();
        if(nameToId[key]) return;
        maxOrder++;
        var newId = 'best_extra_' + (isIncome ? 'inc' : 'exp') + '_' + maxOrder;
        col.doc(newId).set({ name:name, group:group, order:maxOrder, custom:true, active:true });
        nameToId[key] = newId;
      });
      return nameToId;
    }
    var incomeCatIds = ensureCategories('incomeCategories', patch.incomeCategoriesExtra, true);
    var expenseCatIds = ensureCategories('expenseCategories', patch.expenseCategoriesExtra, false);

    var giverCol = LocalDB.collection(ns('givers'));
    Object.keys(patch.givers || {}).forEach(function(id){
      giverCol.doc(id).get().then(function(snap){
        if(!snap.exists) giverCol.doc(id).set(patch.givers[id]);
      });
    });

    var incEmpty = !(snapshotOnce('incomeEntries').docs.length);
    var expEmpty = !(snapshotOnce('expenseEntries').docs.length);
    var assetsEmpty = !(snapshotOnce('assets').docs.length);
    if(incEmpty && expEmpty && assetsEmpty){
      var incCol = LocalDB.collection(ns('incomeEntries'));
      Object.keys(patch.incomeEntries || {}).forEach(function(id){
        var e = Object.assign({}, patch.incomeEntries[id]);
        e.categoryId = incomeCatIds[String(e.categoryName||'').toLowerCase()] || null;
        incCol.doc(id).set(e);
      });
      var expCol = LocalDB.collection(ns('expenseEntries'));
      Object.keys(patch.expenseEntries || {}).forEach(function(id){
        var e = Object.assign({}, patch.expenseEntries[id]);
        e.categoryId = expenseCatIds[String(e.categoryName||'').toLowerCase()] || null;
        expCol.doc(id).set(e);
      });
      var assetCatSnap = snapshotOnce('assetCategories');
      var assetCatIdByName = {};
      assetCatSnap.docs.forEach(function(d){ var v = d.data(); assetCatIdByName[String(v.name||'').toLowerCase()] = d.id; });
      var assetCol = LocalDB.collection(ns('assets'));
      Object.keys(patch.assets || {}).forEach(function(id){
        var a = Object.assign({}, patch.assets[id]);
        a.categoryId = assetCatIdByName[String(a.categoryName||'').toLowerCase()] || null;
        assetCol.doc(id).set(a);
      });
      var balCol = LocalDB.collection(ns('balances'));
      Object.keys(patch.balances || {}).forEach(function(year){
        balCol.doc(year).get().then(function(snap){
          if(!snap.exists) balCol.doc(year).set(patch.balances[year]);
        });
      });
    }

    if(patch.settingsPatch){
      LocalDB.collection(ns('settings')).doc('main').get().then(function(snap){
        var cur = snap.exists ? snap.data() : {};
        var toApply = {}; var changed = false;
        Object.keys(patch.settingsPatch).forEach(function(f){
          if(patch.settingsPatch[f] && !cur[f]){ toApply[f] = patch.settingsPatch[f]; changed = true; }
        });
        if(changed) LocalDB.collection(ns('settings')).doc('main').update(toApply);
      });
    }
  }

  /* See BIZCENTRE_PATCH in prelude.txt. Adds a brand-new "Bizcentre Ltd" company entity (with its
     real financial history) to a copy that's already in use. Unlike applyBestAccountsPatch(),
     which fills gaps in an entity that already exists, this creates the entity itself -- so the
     guard is simple: if an entity with this id already exists, skip the whole patch (nothing is
     ever re-added or overwritten once it's there, whether the user built on it or a previous
     patch run already created it). Runs on every boot; a no-op once already applied. */
  function applyBizcentrePatch(){
    if(typeof BIZCENTRE_PATCH === 'undefined') return;
    var patch = BIZCENTRE_PATCH;
    if(!patch || !patch.entity) return;
    var entityId = patch.entity.id;
    function ns(name){ return 'ent_' + entityId + '__' + name; }
    LocalDB.collection('entities').doc(entityId).get().then(function(snap){
      if(snap.exists) return; // already added (by the user or an earlier run of this same patch)

      LocalDB.collection('entities').doc(entityId).set({
        name: patch.entity.name, type: patch.entity.type, createdAt: patch.entity.createdAt
      });

      var incomeCol = LocalDB.collection(ns('incomeCategories'));
      var incomeCatIds = {};
      var order = 0;
      (typeof BUSINESS_INCOME_TEMPLATE !== 'undefined' ? BUSINESS_INCOME_TEMPLATE : []).forEach(function(c){
        order++;
        var id = 'c' + order;
        incomeCol.doc(id).set({ name:c.name, group:c.group||'', order:order, custom:false, active:true });
        incomeCatIds[c.name.toLowerCase()] = id;
      });
      (patch.incomeCategoriesExtra || []).forEach(function(item){
        order++;
        var id = 'bc_extra_inc_' + order;
        incomeCol.doc(id).set({ name:item[0], group:item[1]||'', order:order, custom:true, active:true });
        incomeCatIds[item[0].toLowerCase()] = id;
      });

      var expenseCol = LocalDB.collection(ns('expenseCategories'));
      var expenseCatIds = {};
      order = 0;
      (typeof BUSINESS_EXPENSE_TEMPLATE !== 'undefined' ? BUSINESS_EXPENSE_TEMPLATE : []).forEach(function(c){
        order++;
        var id = 'c' + order;
        expenseCol.doc(id).set({ name:c.name, group:c.group||'', order:order, custom:false, active:true });
        expenseCatIds[c.name.toLowerCase()] = id;
      });
      (patch.expenseCategoriesExtra || []).forEach(function(item){
        order++;
        var id = 'bc_extra_exp_' + order;
        expenseCol.doc(id).set({ name:item[0], group:item[1]||'', order:order, custom:true, active:true });
        expenseCatIds[item[0].toLowerCase()] = id;
      });

      var incCol = LocalDB.collection(ns('incomeEntries'));
      Object.keys(patch.incomeEntries || {}).forEach(function(id){
        var e = Object.assign({}, patch.incomeEntries[id]);
        e.categoryId = incomeCatIds[String(e.categoryName||'').toLowerCase()] || null;
        incCol.doc(id).set(e);
      });
      var expCol = LocalDB.collection(ns('expenseEntries'));
      Object.keys(patch.expenseEntries || {}).forEach(function(id){
        var e = Object.assign({}, patch.expenseEntries[id]);
        e.categoryId = expenseCatIds[String(e.categoryName||'').toLowerCase()] || null;
        expCol.doc(id).set(e);
      });
      var loanCol = LocalDB.collection(ns('loans'));
      Object.keys(patch.loans || {}).forEach(function(id){ loanCol.doc(id).set(patch.loans[id]); });
      var loanTxCol = LocalDB.collection(ns('loanTransactions'));
      Object.keys(patch.loanTransactions || {}).forEach(function(id){ loanTxCol.doc(id).set(patch.loanTransactions[id]); });
      var equityCol = LocalDB.collection(ns('equityEntries'));
      Object.keys(patch.equityEntries || {}).forEach(function(id){ equityCol.doc(id).set(patch.equityEntries[id]); });

      var defaultSettings = {
        companyName:'', companyNumber:'', registeredAddress:'', fyStartMonth:1, baseCurrency:'GBP (£)',
        vatNumber:'', vatRate:0.20, corpTaxRate:0.25,
        depreciationRates:{ 'Equipment':0.25, 'Vehicles':0.25, 'Property':0.02, 'Fixtures & Fittings':0.25 },
        openingCash:0, openingRetainedEarnings:0, preparedBy:'', updatedAt:patch.entity.createdAt
      };
      LocalDB.collection(ns('settings')).doc('main').set(Object.assign(defaultSettings, patch.settingsPatch || {}));
    });
  }

  /* Everything the app normally does on load lives in here so the password gate below can hold
     it back entirely until the right password is entered — no entity data is read, rendered, or
     queryable while locked. See APP_LOCK_HASH in prelude.txt for what this protects against
     (a casually-opened file) and does not (a determined person with dev tools). */
  function startApp(){
    render();

    LocalDB.seedIfEmpty();
    applyGiverProfilePatch();
    applyBestAccountsPatch();
    applyBizcentrePatch();
    db = LocalDB;
    state.dbAvailable = LocalDB.isStorageOK();
    state.fileLink.supported = FileLink.isSupported();
    if(state.dbAvailable){
      col.entities = db.collection('entities');
      col.entities.onSnapshot(function(snap){
        state.entities = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        reactiveRender();
      });
    }
    render();

    FileLink.onStatusChange(function(status, msg){
      state.fileLink = status;
      if(msg) toast(msg);
      render();
    });
    FileLink.tryRestore().then(function(status){
      state.fileLink = status;
      render();
    });

    /* ---------------- export / import ---------------- */
    function doExport(){
      try {
        var json = LocalDB.exportJSON();
        var blob = new Blob([json], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var stamp = new Date().toISOString().slice(0,10);
        a.href = url;
        a.download = appSlug() + '-backup-' + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast('Backup downloaded.');
      } catch(e){ toast('Could not export — try again.'); }
    }
    function doImport(file){
      if(!file) return;
      if(!window.confirm('Importing will REPLACE all data currently stored in this browser — every entity — with the contents of the selected file. This cannot be undone. Continue?')) return;
      var reader = new FileReader();
      reader.onload = function(){
        try {
          LocalDB.importJSON(reader.result);
          unsubscribeEntity();
          state.currentEntityId = null; state.currentEntityType = null; state.view = 'home';
          toast('Data imported successfully.');
        } catch(e){ toast('That file could not be read as a valid backup.'); }
      };
      reader.onerror = function(){ toast('Could not read that file.'); };
      reader.readAsText(file);
    }
    function handleFileLinkAction(action){
      if(action === 'new-linked-file'){
        FileLink.startNew().then(function(status){ state.fileLink = status; render(); toast('Now saving to "' + status.name + '".'); })
          .catch(function(err){ if(err && err.name !== 'AbortError') toast('Could not create the linked file.'); });
      } else if(action === 'open-linked-file'){
        FileLink.openExisting().then(function(status){ state.fileLink = status; render(); toast('Linked "' + status.name + '" — its saved data has been loaded.'); })
          .catch(function(err){ if(err && err.name !== 'AbortError') toast('Could not open that file.'); });
      } else if(action === 'reconnect-file'){
        FileLink.reconnect().then(function(status){
          state.fileLink = status;
          render();
          toast(status.connected ? 'Reconnected — auto-saving to "' + status.name + '" again.' : 'Permission was not granted.');
        }).catch(function(){ toast('Could not reconnect — try again.'); });
      } else if(action === 'unlink-file'){
        if(!window.confirm('Stop auto-saving to this file? Your data stays in this browser either way — you can re-link anytime.')) return;
        FileLink.unlink().then(function(status){ state.fileLink = status; render(); toast('File unlinked.'); });
      }
    }

    /* Mobile hamburger menu. Every entity view fully re-renders its sidebar's
       innerHTML on any navigation (state.view change), which would wipe out any
       DOM-attached open/closed state -- so "open" lives as a class on <body>
       instead, which none of those re-renders ever touch, and every check here
       is delegated (not bound to a specific element) so it keeps working across
       every fresh render without re-attaching anything. */
    document.addEventListener('click', function(e){
      var toggleBtn = e.target.closest('[data-action="toggle-nav"]');
      if(toggleBtn){ document.body.classList.toggle('nav-open'); return; }
      // Picking a page, or leaving the entity altogether, should close the menu
      // behind it -- each of those clicks is also separately handled (by the
      // per-engine listener that actually changes the page/entity), so this
      // only ever closes the menu, never interferes with that.
      if(e.target.closest('[data-nav]') || e.target.closest('[data-action="close-entity"]')){
        document.body.classList.remove('nav-open');
      }
      var exportBtn = e.target.closest('[data-action="export-data"]');
      if(exportBtn){ doExport(); return; }
      var importBtn = e.target.closest('[data-action="import-data"]');
      if(importBtn){ var inp = document.getElementById('importFileInput'); if(inp) inp.click(); return; }
      var flBtn = e.target.closest('[data-action="new-linked-file"],[data-action="open-linked-file"],[data-action="reconnect-file"],[data-action="unlink-file"]');
      if(flBtn){ handleFileLinkAction(flBtn.getAttribute('data-action')); return; }
      var printBtn = e.target.closest('[data-action="print-page"]');
      if(printBtn){ window.print(); return; }
    });
    document.addEventListener('change', function(e){
      if(e.target && e.target.id === 'importFileInput'){
        doImport(e.target.files[0]);
        e.target.value = '';
      }
    });
  }

  /* ---------------- password gate ---------------- */
  function sha256Hex(text){
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }
  (function(){
    var lockScreen = document.getElementById('lock-screen');
    if(!APP_LOCK_HASH){ startApp(); return; }
    var sessionKey = 'appUnlocked__' + (APP_STORAGE_ID || 'default');
    if(sessionStorage.getItem(sessionKey) === '1'){ startApp(); return; }
    document.getElementById('lock-title').textContent = APP_NAME || 'Locked';
    lockScreen.style.display = 'flex';
    var form = document.getElementById('lock-form');
    var input = document.getElementById('lock-input');
    var errorEl = document.getElementById('lock-error');
    setTimeout(function(){ input.focus(); }, 50);
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var typed = input.value;
      if(!typed){ return; }
      sha256Hex(typed).then(function(hex){
        if(hex.toLowerCase() === String(APP_LOCK_HASH).toLowerCase()){
          try{ sessionStorage.setItem(sessionKey, '1'); }catch(e){}
          lockScreen.style.display = 'none';
          startApp();
        } else {
          errorEl.style.display = 'block';
          input.value = '';
          input.focus();
        }
      }).catch(function(){
        /* crypto.subtle needs a secure context (https, or a file:// page in most browsers still
           allows it — but if it's ever unavailable, fail open rather than permanently locking
           someone out of their own data with no way in). */
        errorEl.textContent = "This browser can't check the password here — try opening the file directly (not through a preview) or in a different browser.";
        errorEl.style.display = 'block';
      });
    });
  })();

  document.addEventListener('keydown', function(e){
    if(e.target && e.target.id === 'lock-input' && document.getElementById('lock-error')){
      document.getElementById('lock-error').style.display = 'none';
    }
  });
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(err){
        console.warn('Service worker registration failed (app still works, just without offline caching):', err);
      });
    });
  }
</script>
