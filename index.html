    /* ---------------- SOFA-style fund split helpers (charity only) ---------------- */
    function fundSplitByGiver(year){
      return activeGivers().map(function(g){
        var ft = fundTypeOfGiver(g.id);
        var row = { id:g.id, name:g.name, fundType:ft, byFund:{}, total:0 };
        cfg().fundTypes.forEach(function(f){ row.byFund[f] = 0; });
        var inc = sumBy(entriesInYear(state.incomeEntries, year).filter(function(e){ return e.giverId===g.id; }), function(e){ return e.amount; });
        row.byFund[ft] = inc; row.total = inc;
        return row;
      }).filter(function(r){ return Math.abs(r.total)>0.005; });
    }
    function fundSplitByExpenseCategory(year){
      var cats = catListFor('expense').filter(function(c){return c.active!==false;}).sort(function(a,b){return a.order-b.order;});
      var firstFund = cfg().fundTypes[0];
      return cats.map(function(cat){
        var row = { id:cat.id, name:cat.name, byFund:{}, total:0 };
        cfg().fundTypes.forEach(function(f){ row.byFund[f] = 0; });
        entriesInYear(state.expenseEntries, year).filter(function(e){ return e.categoryId===cat.id; }).forEach(function(e){
          if(e.allocations && Object.keys(e.allocations).length){
            Object.keys(e.allocations).forEach(function(gid){
              var ft = fundTypeOfGiver(gid);
              row.byFund[ft] += Number(e.allocations[gid])||0;
            });
            var un = unallocated(e);
            if(Math.abs(un)>0.005) row.byFund[firstFund] += un;
          } else {
            row.byFund[firstFund] += Number(e.amount)||0;
          }
        });
        row.total = sumBy(cfg().fundTypes, function(f){ return row.byFund[f]; });
        return row;
      }).filter(function(r){ return Math.abs(r.total)>0.005; });
    }
    function asOfDateForYear(year){ return year===fiscalYearKey(todayISO()) ? todayISO() : fyEnd(year); }

    /* ---------------- SOFA (charity, fund columns) / Income & Expenditure (church, flat) ---------------- */
    function renderSOFA(){
      var c = cfg();
      var year = currentYear(), prevYear = prevYearKey(year);
      return c.hasFundColumns ? renderSOFAFundColumns(year, prevYear, c) : renderIncomeExpenditure(year, prevYear, c);
    }
    function renderSOFAFundColumns(year, prevYear, c){
      var funds = c.fundTypes;
      var giverRows = fundSplitByGiver(year);
      var catRows = fundSplitByExpenseCategory(year);
      var prevGiverTotal = sumBy(fundSplitByGiver(prevYear), function(r){return r.total;});
      var prevCatTotal = sumBy(fundSplitByExpenseCategory(prevYear), function(r){return r.total;});
      var incTotals = {}, expTotals = {};
      funds.forEach(function(f){
        incTotals[f] = sumBy(giverRows, function(r){return r.byFund[f];});
        expTotals[f] = sumBy(catRows, function(r){return r.byFund[f];});
      });
      var incGrand = sumBy(funds, function(f){return incTotals[f];});
      var expGrand = sumBy(funds, function(f){return expTotals[f];});
      var fb = fundBreakdown(year);

      function fundHeadRow(){
        return '<tr><th>'+esc(c.giverNoun)+' / Category</th>' + funds.map(function(f){ return '<th style="text-align:right;">'+esc(f)+'</th>'; }).join('') + '<th style="text-align:right;">Total</th><th style="text-align:right;">Prior Year</th></tr>';
      }
      function fundRow(name, byFund, total, prevTotal, bold){
        var cells = funds.map(function(f){ return '<td class="num-col">'+fmtMoney(byFund[f])+'</td>'; }).join('');
        return '<tr'+(bold?' style="font-weight:700;"':'')+'><td>'+esc(name)+'</td>'+cells+'<td class="num-col">'+fmtMoney(total)+'</td><td class="num-col" style="color:var(--ink-soft);">'+fmtMoney(prevTotal)+'</td></tr>';
      }
      var giverBody = giverRows.length ? giverRows.map(function(r){ return fundRow(r.name, r.byFund, r.total, null); }).join('') : '<tr><td colspan="'+(funds.length+3)+'"><div class="empty">No incoming resources recorded yet.</div></td></tr>';
      var catBody = catRows.length ? catRows.map(function(r){ return fundRow(r.name, r.byFund, r.total, null); }).join('') : '<tr><td colspan="'+(funds.length+3)+'"><div class="empty">No resources expended recorded yet.</div></td></tr>';
      var incTotalRow = fundRow('Total incoming resources', incTotals, incGrand, prevGiverTotal, true);
      var expTotalRow = fundRow('Total resources expended', expTotals, expGrand, prevCatTotal, true);
      var netByFund = {}; funds.forEach(function(f){ netByFund[f] = incTotals[f]-expTotals[f]; });
      var netRow = fundRow('Net income / (expenditure)', netByFund, incGrand-expGrand, prevGiverTotal-prevCatTotal, true);

      var bfByFund = {}, cfByFund = {};
      funds.forEach(function(f){ bfByFund[f] = fundOpeningTotal(state.balances, f); cfByFund[f] = bfByFund[f] + (fb[f]?fb[f].net:0); });
      var totalBF = sumBy(funds, function(f){return bfByFund[f];});
      var totalCF = sumBy(funds, function(f){return cfByFund[f];});
      var balBody =
        fundRow('Fund balances brought forward', bfByFund, totalBF, null) +
        fundRow('Net movement for the year', netByFund, incGrand-expGrand, null) +
        fundRow('Fund balances carried forward', cfByFund, totalCF, null, true);

      return topbar('Statement of Financial Activities', fiscalYearLabel(year) + ' · vs ' + fiscalYearLabel(prevYear), true) +
        '<div class="content">' +
          '<div class="banner info">◈ Incoming resources by '+esc(c.giverNoun.toLowerCase())+', resources expended by category — each split across '+funds.join('/')+' funds. Prior Year shows that row’s total for '+fiscalYearLabel(prevYear)+'.</div>' +
          '<div class="panel panel-pad" style="margin-top:14px;"><div class="section-title"><h2>Incoming Resources</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead>'+fundHeadRow()+'</thead><tbody>'+giverBody+'</tbody><tfoot>'+incTotalRow+'</tfoot></table></div></div>' +
          '<div class="panel panel-pad" style="margin-top:14px;"><div class="section-title"><h2>Resources Expended</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead>'+fundHeadRow()+'</thead><tbody>'+catBody+'</tbody><tfoot>'+expTotalRow+'</tfoot></table></div></div>' +
          '<div class="panel panel-pad" style="margin-top:14px;"><div class="section-title"><h2>Net Income / (Expenditure) &amp; Fund Movements</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead>'+fundHeadRow()+'</thead><tbody>'+netRow+balBody+'</tbody></table></div></div>' +
        '</div>';
    }
    function renderIncomeExpenditure(year, prevYear, c){
      function row(label, cur, prev, bold, cls){
        return '<div class="stmt-row'+(bold?' total':'')+'"><span class="stmt-label">'+esc(label)+'</span>' +
          '<span class="stmt-amt'+(cls?(' '+cls):'')+'">'+fmtMoney(cur)+'</span>' +
          '<span class="stmt-amt" style="color:var(--ink-soft);">'+fmtMoney(prev)+'</span></div>';
      }
      var incRows = categoryRows(entriesInYear(state.incomeEntries, year), state.incomeCats).filter(function(r){return r.total>0.005;});
      var prevIncRows = categoryRows(entriesInYear(state.incomeEntries, prevYear), state.incomeCats);
      var expRows = categoryRows(entriesInYear(state.expenseEntries, year), state.expenseCats).filter(function(r){return r.total>0.005;});
      var prevExpRows = categoryRows(entriesInYear(state.expenseEntries, prevYear), state.expenseCats);
      function prevFor(list, id){ var m = list.find(function(x){return x.id===id;}); return m ? m.total : 0; }
      var incTotal = sumBy(incRows, function(r){return r.total;});
      var prevIncTotal = sumBy(prevIncRows, function(r){return r.total;});
      var expTotal = sumBy(expRows, function(r){return r.total;});
      var prevExpTotal = sumBy(prevExpRows, function(r){return r.total;});
      var incLines = incRows.length ? incRows.map(function(r){ return row(r.name, r.total, prevFor(prevIncRows, r.id), false, 'income'); }).join('') : '<div class="stmt-row"><span class="stmt-label">No income recorded yet</span><span class="stmt-amt">£0.00</span><span class="stmt-amt"></span></div>';
      var expLines = expRows.length ? expRows.map(function(r){ return row(r.name, r.total, prevFor(prevExpRows, r.id), false, 'expense'); }).join('') : '<div class="stmt-row"><span class="stmt-label">No expenditure recorded yet</span><span class="stmt-amt">£0.00</span><span class="stmt-amt"></span></div>';
      return topbar(c.hasFundColumns ? 'Statement of Financial Activities' : 'Income & Expenditure Account', fiscalYearLabel(year) + ' · vs ' + fiscalYearLabel(prevYear), true) +
        '<div class="content">' +
          '<div class="panel panel-pad"><div class="statement with-prior-year">' +
            '<div class="stmt-row" style="font-weight:600;color:var(--ink-soft);"><span class="stmt-label"></span><span class="stmt-amt">'+esc(fiscalYearLabel(year))+'</span><span class="stmt-amt">'+esc(fiscalYearLabel(prevYear))+'</span></div>' +
            '<div class="stmt-section-title">Income</div>' + incLines + row('Total Income', incTotal, prevIncTotal, true, 'income') +
            '<div class="stmt-section-title">Expenditure</div>' + expLines + row('Total Expenditure', expTotal, prevExpTotal, true, 'expense') +
            row('★ Surplus / (Deficit) for the Year', incTotal-expTotal, prevIncTotal-prevExpTotal, true, (incTotal-expTotal)>=0?'income':'expense') +
          '</div></div>' +
        '</div>';
    }

    /* ---------------- Balance Sheet (fund breakdown for charity, general/asset fund for church) — both with a Prior Year column ---------------- */
    function renderBalanceSheet(){
      var c = cfg();
      var year = currentYear(), prevYear = prevYearKey(year);
      var asOf = asOfDateForYear(year), prevAsOf = fyEnd(prevYear);
      var cash = cashAsOf(asOf), prevCash = cashAsOf(prevAsOf);
      var assetBreakdown = assetCategoryTotalsAsOf(asOf).filter(function(r){return r.total>0.005;});
      var totalAssets = totalAssetsAsOf(asOf), prevTotalAssets = totalAssetsAsOf(prevAsOf);
      function row(label, cur, prev, bold){
        return '<div class="stmt-row'+(bold?' total':'')+'"><span class="stmt-label">'+esc(label)+'</span><span class="stmt-amt">'+fmtMoney(cur)+'</span><span class="stmt-amt" style="color:var(--ink-soft);">'+fmtMoney(prev)+'</span></div>';
      }
      var assetLines = assetBreakdown.length ? assetBreakdown.map(function(r){ return row(r.name, r.total, (assetCategoryTotalsAsOf(prevAsOf).find(function(x){return x.id===r.id;})||{total:0}).total); }).join('') : '<div class="stmt-row"><span class="stmt-label">None recorded yet</span><span class="stmt-amt">£0.00</span><span class="stmt-amt"></span></div>';

      var body;
      if(c.hasFundColumns){
        var funds = c.fundTypes;
        var bal = balancesForYear(year), prevBal = peekBalances(prevYear);
        var fbCur = fundBreakdown(year), fbPrev = fundBreakdown(prevYear);
        function fundClosing(balances, fb, ft){ return fundOpeningTotal(balances, ft) + (fb[ft] ? fb[ft].net : 0); }
        var fundRows = funds.map(function(ft){ return row(ft+' fund', fundClosing(bal, fbCur, ft), fundClosing(prevBal, fbPrev, ft)); }).join('');
        var totalFunds = sumBy(funds, function(ft){ return fundClosing(bal, fbCur, ft); });
        var prevTotalFunds = sumBy(funds, function(ft){ return fundClosing(prevBal, fbPrev, ft); });
        body =
          '<div class="stmt-section-title">Fixed Assets</div>' + assetLines + row('Total Fixed Assets', totalAssets, prevTotalAssets, true) +
          '<div class="stmt-section-title">Current Assets</div>' + row('Cash & bank balance', cash, prevCash, true) +
          row('★ Total Assets', totalAssets+cash, prevTotalAssets+prevCash, true) +
          '<div class="stmt-section-title">Represented by — Charity Funds</div>' + fundRows +
          row('Fixed assets (within funds)', totalAssets, prevTotalAssets) +
          row('★ Total Charity Funds', totalFunds+totalAssets, prevTotalFunds+prevTotalAssets, true);
      } else {
        var bal2 = balancesForYear(year), prevBal2 = peekBalances(prevYear);
        var openingTotalCur = openingTotal(bal2), openingTotalPrev = openingTotal(prevBal2);
        var incTot = sumBy(entriesInYear(state.incomeEntries, year), function(e){return e.amount;});
        var expTot = sumBy(entriesInYear(state.expenseEntries, year), function(e){return e.amount;});
        var incTotP = sumBy(entriesInYear(state.incomeEntries, prevYear), function(e){return e.amount;});
        var expTotP = sumBy(entriesInYear(state.expenseEntries, prevYear), function(e){return e.amount;});
        var surplus = incTot-expTot, surplusP = incTotP-expTotP;
        var generalFundCF = openingTotalCur + surplus, generalFundCFP = openingTotalPrev + surplusP;
        body =
          '<div class="stmt-section-title">Fixed Assets</div>' + assetLines + row('Total Fixed Assets', totalAssets, prevTotalAssets, true) +
          '<div class="stmt-section-title">Current Assets</div>' + row('Cash & bank balance', cash, prevCash, true) +
          row('★ Total Assets', totalAssets+cash, prevTotalAssets+prevCash, true) +
          '<div class="stmt-section-title">General Fund</div>' +
          row('Balance brought forward', openingTotalCur, openingTotalPrev) +
          row('Surplus / (Deficit) for the year', surplus, surplusP) +
          row('Balance carried forward', generalFundCF, generalFundCFP, true) +
          '<div class="stmt-section-title">Fixed Asset Fund</div>' + row('Fixed asset fund', totalAssets, prevTotalAssets, true) +
          row('★ Total Funds', generalFundCF+totalAssets, generalFundCFP+prevTotalAssets, true);
      }
      var openFields = openingFieldsFor();
      var curBal = balancesForYear(year);
      var openFieldLabels = { openingBank:'Opening Bank balance (£)', openingCash:'Opening Cash in hand (£)' };
      if(c.hasFundColumns){ c.fundTypes.forEach(function(ft){ openFieldLabels['opening'+ft] = 'Opening '+ft+' fund (£)'; }); }
      var openingForm = openFields.map(function(f){
        return '<div class="field narrow"><label for="bal-open-'+f+'">'+esc(openFieldLabels[f]||f)+'</label><input type="number" id="bal-open-'+f+'" data-open-field="'+f+'" step="0.01" value="'+(curBal[f]||'')+'" placeholder="0.00"></div>';
      }).join('');
      return topbar('Balance Sheet', 'As at '+asAtLabel(year)+' · vs '+fmtDate(prevAsOf), true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print">' +
            '<div class="section-title"><h2>Opening balances for '+esc(fiscalYearLabel(year))+'</h2><span class="desc">Carried forward automatically once you close a year — edit here only to correct or set up the first year</span>' +
              '<button class="btn btn-ghost btn-sm" type="button" data-action="copy-balances-forward" style="margin-left:auto;">⭱ Copy last year forward</button></div>' +
            '<div class="balance-form">'+openingForm+'</div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="statement with-prior-year">' +
            '<div class="stmt-row" style="font-weight:600;color:var(--ink-soft);"><span class="stmt-label"></span><span class="stmt-amt">'+esc(asAtLabel(year))+'</span><span class="stmt-amt">'+esc(fmtDate(prevAsOf))+'</span></div>' +
            body +
          '</div></div>' +
        '</div>';
    }

    /* ---------------- Trial Balance (receipts-and-payments — ties by construction) ---------------- */
    function renderTrialBalance(){
      var c = cfg();
      var year = currentYear();
      var asOf = asOfDateForYear(year);
      var openingBal = balancesForYear(year);
      var opening = openingTotal(openingBal);
      var incTotal = sumBy(entriesInYear(state.incomeEntries, year), function(e){return e.amount;});
      var expTotal = sumBy(entriesInYear(state.expenseEntries, year), function(e){return e.amount;});
      var cash = opening + incTotal - expTotal;
      var fixedAssets = totalAssetsAsOf(asOf);
      var totalAssetsSum = cash + fixedAssets;
      var fundsBlock;
      if(c.hasFundColumns){
        var fb = fundBreakdown(year);
        var fundRows = c.fundTypes.map(function(ft){
          var closing = fundOpeningTotal(openingBal, ft) + (fb[ft]?fb[ft].net:0);
          return '<div class="stmt-row"><span class="stmt-label">'+esc(ft)+' fund</span><span class="stmt-amt">'+fmtMoney(closing)+'</span></div>';
        }).join('');
        var totalFunds = sumBy(c.fundTypes, function(ft){ return fundOpeningTotal(openingBal, ft) + (fb[ft]?fb[ft].net:0); });
        fundsBlock = '<div class="stmt-section-title">Charity Funds (from Balance Sheet)</div>' + fundRows +
          '<div class="stmt-row"><span class="stmt-label">Fixed assets (within funds)</span><span class="stmt-amt">'+fmtMoney(fixedAssets)+'</span></div>' +
          '<div class="stmt-row total"><span class="stmt-label">= Total Charity Funds</span><span class="stmt-amt">'+fmtMoney(totalFunds+fixedAssets)+'</span></div>';
        var variance = totalAssetsSum - (totalFunds+fixedAssets);
      } else {
        var surplus = incTotal - expTotal;
        var generalFundCF = opening + surplus;
        fundsBlock = '<div class="stmt-section-title">Funds (from Balance Sheet)</div>' +
          '<div class="stmt-row"><span class="stmt-label">General fund</span><span class="stmt-amt">'+fmtMoney(generalFundCF)+'</span></div>' +
          '<div class="stmt-row"><span class="stmt-label">Fixed asset fund</span><span class="stmt-amt">'+fmtMoney(fixedAssets)+'</span></div>' +
          '<div class="stmt-row total"><span class="stmt-label">= Total Funds</span><span class="stmt-amt">'+fmtMoney(generalFundCF+fixedAssets)+'</span></div>';
        variance = totalAssetsSum - (generalFundCF+fixedAssets);
      }
      var ok = Math.abs(variance) < 0.5;
      return topbar('Trial Balance', 'As at '+asAtLabel(year), true) +
        '<div class="content">' +
          '<div class="two-col">' +
            '<div class="panel panel-pad"><div class="statement">' +
              '<div class="stmt-section-title">Assets (from Balance Sheet)</div>' +
              '<div class="stmt-row"><span class="stmt-label">Cash &amp; bank balance</span><span class="stmt-amt">'+fmtMoney(cash)+'</span></div>' +
              '<div class="stmt-row"><span class="stmt-label">Fixed assets (at cost)</span><span class="stmt-amt">'+fmtMoney(fixedAssets)+'</span></div>' +
              '<div class="stmt-row total"><span class="stmt-label">= Total Assets</span><span class="stmt-amt">'+fmtMoney(totalAssetsSum)+'</span></div>' +
            '</div></div>' +
            '<div class="panel panel-pad"><div class="statement">' + fundsBlock + '</div></div>' +
          '</div>' +
          '<div class="banner '+(ok?'info':'warn')+'" style="margin-top:16px;">'+(ok?'✅ This is a receipts-and-payments book — Total Assets always equals Total Funds by construction ('+fmtMoney(variance)+' variance).':'⚠ Variance of '+fmtMoney(variance)+' — check opening balances and that every fixed asset and transaction is recorded.')+'</div>' +
        '</div>';
    }

    /* ---------------- Cash Flow Statement (direct method + monthly fiscal buckets) ---------------- */
    function fiscalMonthRange(year, offset){
      var idx = fyStartMonthIdx();
      var total = idx + offset;
      var y = Number(year) + Math.floor(total/12);
      var mi = total % 12;
      var start = y+'-'+pad2(mi+1)+'-01';
      var total2 = total+1;
      var y2 = Number(year) + Math.floor(total2/12);
      var mi2 = total2 % 12;
      var end = dayBefore(y2+'-'+pad2(mi2+1)+'-01');
      return { start:start, end:end, label: MONTH_NAMES_SHORT[mi]+' '+y };
    }
    function bucketsFor(period, year){
      var months = []; for(var i=0;i<12;i++) months.push(fiscalMonthRange(year, i));
      if(period==='month') return months;
      var groupSize = period==='quarter' ? 3 : (period==='half' ? 6 : 12);
      var out = [];
      for(var j=0;j<12;j+=groupSize){
        var slice = months.slice(j, j+groupSize);
        out.push({ label: slice[0].label + (slice.length>1 ? (' – '+slice[slice.length-1].label) : ''), start: slice[0].start, end: slice[slice.length-1].end });
      }
      return out;
    }
    function bucketTotals(bucket){
      var inc = sumBy(state.incomeEntries.filter(function(e){ return e.date>=bucket.start && e.date<=bucket.end; }), function(e){return e.amount;});
      var exp = sumBy(state.expenseEntries.filter(function(e){ return e.date>=bucket.start && e.date<=bucket.end; }), function(e){return e.amount;});
      return { income:inc, expense:exp, net:inc-exp };
    }
    function renderCashFlow(){
      var year = currentYear();
      var opening = openingTotal(balancesForYear(year));
      var incRows = categoryRows(entriesInYear(state.incomeEntries, year), state.incomeCats).filter(function(r){return r.total>0.005;});
      var expRows = categoryRows(entriesInYear(state.expenseEntries, year), state.expenseCats).filter(function(r){return r.total>0.005;});
      var totalIn = sumBy(incRows, function(r){return r.total;});
      var totalOut = sumBy(expRows, function(r){return r.total;});
      function row(label, value, bold){
        return '<div class="stmt-row'+(bold?' total':'')+'"><span class="stmt-label">'+esc(label)+'</span><span class="stmt-amt">'+fmtMoney(value)+'</span></div>';
      }
      var recLines = incRows.length ? incRows.map(function(r){return row(r.name, r.total);}).join('') : '<div class="stmt-row"><span class="stmt-label">None recorded yet</span><span class="stmt-amt">£0.00</span></div>';
      var payLines = expRows.length ? expRows.map(function(r){return row(r.name, r.total);}).join('') : '<div class="stmt-row"><span class="stmt-label">None recorded yet</span><span class="stmt-amt">£0.00</span></div>';
      var buckets = bucketsFor('month', year);
      var monthlyRows = buckets.map(function(b){
        var t = bucketTotals(b);
        return '<tr><td>'+esc(b.label)+'</td><td class="num-col income">'+fmtMoney(t.income)+'</td><td class="num-col expense">'+fmtMoney(t.expense)+'</td><td class="num-col" style="color:'+(t.net>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(t.net)+'</td></tr>';
      }).join('');
      return topbar('Cash Flow Statement', fiscalYearLabel(year) + ' · direct method', true) +
        '<div class="content">' +
          '<div class="panel panel-pad"><div class="statement">' +
            row('Opening Cash & Bank Balance', opening, true) +
            '<div class="stmt-section-title">Receipts</div>' + recLines + row('Total Receipts', totalIn, true) +
            '<div class="stmt-section-title">Payments</div>' + payLines + row('Total Payments', totalOut, true) +
            row('Net Cash Movement in Period', totalIn-totalOut, true) +
            row('★ Closing Cash & Bank Balance', opening+totalIn-totalOut, true) +
          '</div></div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Monthly movement</h2><span class="desc">'+esc(fiscalYearLabel(year))+', by fiscal month</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Month</th><th style="text-align:right;">Receipts</th><th style="text-align:right;">Payments</th><th style="text-align:right;">Net</th></tr></thead><tbody>'+monthlyRows+'</tbody></table></div>' +
          '</div>' +
        '</div>';
    }

    /* ---------------- Compare Years ---------------- */
    function renderCompare(){
      var years = availableYears();
      var nextYear = String(Number(years[years.length-1])+1);
      var allYears = years.concat(years.indexOf(nextYear)===-1 ? [nextYear] : []);
      var selected = (state.compareYears && state.compareYears.length) ? state.compareYears.filter(function(y){return allYears.indexOf(y)>-1;}) : years.slice(-2);
      if(!selected.length) selected = allYears.slice(-1);
      var period = state.comparePeriod || 'quarter';
      var border = 'border-left:2px solid var(--rule-strong);';

      var head = '<th>Period</th>' + selected.map(function(y){ return '<th colspan="3" style="text-align:center;'+border+'">'+esc(fiscalYearLabel(y))+'</th>'; }).join('');
      var subhead = '<th></th>' + selected.map(function(){ return '<th style="text-align:right;'+border+'">Income</th><th style="text-align:right;">Expenditure</th><th style="text-align:right;">Net</th>'; }).join('');
      var bucketsByYear = {}; selected.forEach(function(y){ bucketsByYear[y] = bucketsFor(period, y); });
      var rowCount = bucketsByYear[selected[0]] ? bucketsByYear[selected[0]].length : 0;
      var rows = '';
      for(var i=0;i<rowCount;i++){
        var label = bucketsByYear[selected[0]][i].label;
        var cells = selected.map(function(y){
          var b = bucketsByYear[y][i];
          var t = b ? bucketTotals(b) : {income:0,expense:0,net:0};
          return '<td class="num-col income" style="'+border+'">'+fmtMoney(t.income)+'</td><td class="num-col expense">'+fmtMoney(t.expense)+'</td><td class="num-col" style="color:'+(t.net>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(t.net)+'</td>';
        }).join('');
        rows += '<tr><td>'+esc(label)+'</td>'+cells+'</tr>';
      }
      var totalCells = selected.map(function(y){
        var inc = sumBy(entriesInYear(state.incomeEntries, y), function(e){return e.amount;});
        var exp = sumBy(entriesInYear(state.expenseEntries, y), function(e){return e.amount;});
        var net = inc-exp;
        return '<td class="num-col income" style="'+border+'"><strong>'+fmtMoney(inc)+'</strong></td><td class="num-col expense"><strong>'+fmtMoney(exp)+'</strong></td><td class="num-col" style="color:'+(net>=0?'var(--income)':'var(--danger)')+';"><strong>'+fmtMoney(net)+'</strong></td>';
      }).join('');
      var checkboxes = allYears.map(function(y){
        var checked = selected.indexOf(y)>-1;
        return '<label style="display:inline-flex; align-items:center; gap:6px; margin-right:14px; font-size:12.5px;"><input type="checkbox" data-compare-year="'+y+'"'+(checked?' checked':'')+'> '+esc(fiscalYearLabel(y))+'</label>';
      }).join('');
      var periodOptions = ['month','quarter','half','year'].map(function(p){
        var labels = {month:'Month', quarter:'Quarter', half:'Half-year', year:'Full year'};
        return '<option value="'+p+'"'+(p===period?' selected':'')+'>'+labels[p]+'</option>';
      }).join('');

      return topbar('Compare Years', selected.map(fiscalYearLabel).join(' vs ')) +
        '<div class="content">' +
          '<div class="panel panel-pad">' +
            '<div class="section-title"><h2>Years to compare</h2><span class="desc">Pick two or more</span></div>' +
            '<div>'+checkboxes+'</div>' +
            '<div class="field" style="margin-top:12px;max-width:220px;"><label for="compare-period">Group by</label><select id="compare-period">'+periodOptions+'</select></div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:18px;">' +
            '<div class="table-wrap"><table class="ledger"><thead><tr>'+head+'</tr><tr>'+subhead+'</tr></thead>' +
            '<tbody>'+rows+'</tbody>' +
            '<tfoot><tr><td>Full year</td>'+totalCells+'</tr></tfoot>' +
            '</table></div>' +
          '</div>' +
        '</div>';
    }

    /* ---------------- General Ledger ---------------- */
    function renderGeneralLedger(){
      var year = currentYear();
      var yStart = fyStart(year);
      var c = cfg();
      function moveRow(date, label, amount, bal){
        return '<tr><td>'+fmtDate(date)+'</td><td>'+esc(label)+'</td>' +
          '<td class="num-col income">'+(amount>0?fmtMoney(amount):'')+'</td>' +
          '<td class="num-col expense">'+(amount<0?fmtMoney(-amount):'')+'</td>' +
          '<td class="num-col"><strong>'+fmtMoney(bal)+'</strong></td></tr>';
      }
      var running = cashAsOf(dayBefore(yStart));
      var cashRows = '<tr><td>'+fmtDate(yStart)+'</td><td>Balance brought forward</td><td></td><td></td><td class="num-col"><strong>'+fmtMoney(running)+'</strong></td></tr>';
      entriesInYear(allCashMovements(), year).forEach(function(m){ running += m.amount; cashRows += moveRow(m.date, m.label, m.amount, running); });

      function catSections(kind){
        var cats = catListFor(kind);
        var entries = entriesInYear(entriesFor(kind), year);
        var byCat = {};
        cats.forEach(function(cat){ byCat[cat.id] = { id:cat.id, name:cat.name, group:cat.group||'', order:cat.order||0, entries:[] }; });
        entries.forEach(function(e){
          var r = byCat[e.categoryId];
          if(!r){ r = byCat[e.categoryId] = { id:e.categoryId, name:(e.categoryName||'Unfiled')+' (removed)', group:'', order:9999, entries:[] }; }
          r.entries.push(e);
        });
        var accounts = Object.keys(byCat).map(function(k){return byCat[k];}).filter(function(a){return a.entries.length;}).sort(function(a,b){return a.order-b.order;});
        if(!accounts.length) return '<div class="panel panel-pad" style="margin-top:16px;"><div class="empty">No '+(kind==='income'?'income':'expenditure')+' recorded yet for '+esc(fiscalYearLabel(year))+'.</div></div>';
        var body = accounts.map(function(acc){
          var total = sumBy(acc.entries, function(e){return e.amount;});
          var lines = acc.entries.map(function(e){
            return '<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description||e.giverName||'—')+(e.note?' — '+esc(e.note):'')+'</td><td class="num-col'+(kind==='income'?' income':' expense')+'">'+fmtMoney(e.amount)+'</td></tr>';
          }).join('');
          return '<div class="stmt-section-title" style="margin-top:12px;">'+esc(acc.name)+' <span style="font-weight:400;color:var(--ink-soft);">— '+fmtMoney(total)+'</span></div>' +
            '<div class="table-wrap"><table class="ledger"><tbody>'+lines+'</tbody></table></div>';
        }).join('');
        return '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>'+(kind==='income'?'Income':'Expenditure')+' Accounts</h2></div>'+body+'</div>';
      }

      return topbar('General Ledger', fiscalYearLabel(year) + ' · every account', true) +
        '<div class="content">' +
          '<div class="banner info">◈ One account per category actually used this year, plus the running cash-book balance behind every statement.</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Cash &amp; Bank Account</h2><span class="desc">Closing balance '+fmtMoney(running)+' as at '+asAtLabel(year)+'</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right;">Money In</th><th style="text-align:right;">Money Out</th><th style="text-align:right;">Balance</th></tr></thead><tbody>'+cashRows+'</tbody></table></div>' +
          '</div>' +
          catSections('income') +
          catSections('expense') +
        '</div>';
    }

    /* ---------------- Giver Profiles (contact details -- separate from financial statements) ----
       Deliberately its own page, not part of the Givers/Donors register (which is about who's
       recorded against income entries) and never referenced from renderGiverStatement (which

               (g.email||'').toLowerCase().indexOf(q)>-1 || (g.address||'').toLowerCase().indexOf(q)>-1;

            '<div class="section-title"><h2>'+esc(c.giverNoun)+' contact directory</h2><span class="desc">Kept separate from '+esc(c.giverStatementLabel).toLowerCase()+'s — never appears on a printed statement, only here</span></div>' +
            '<div class="search-box"><input type="text" id="giver-profile-search" placeholder="Search name, phone, email or address…" value="'+esc(state.giverProfileSearch||'')+'"></div>' +
          '</div>' +
          '<div class="panel" style="margin-top:14px;"><div class="panel-pad">' +

            '<tbody>'+rows+'</tbody></table></div>' +
          '</div></div>' +
        '</div>';

    /* ---------------- Donor Summary (church) ---------------- */
    function renderDonorSummary(){
      var year = currentYear();
      var q = (state.giverReportSearch||'').trim().toLowerCase();
      // '' ranks by total giving across every category (the original view); any other
      // value is an income category id, ranking donors by what they gave to just that
      // category — same table, same rank numbers, just a different pot of money.
      var rankCat = state.donorRankCategory || '';
      var cats = catListFor('income').filter(function(x){return x.active!==false;}).sort(function(a,b){return (a.order||0)-(b.order||0);});
      var selectedCat = rankCat ? cats.filter(function(c){return c.id===rankCat;})[0] : null;
      // A category picked in a select that's since been renamed/deactivated would silently
      // rank by nothing and look broken — fall back to "Total giving" rather than that.
      if(rankCat && !selectedCat) rankCat = '';

      var entries = entriesInYear(state.incomeEntries, year);
      var totalIncome = sumBy(entries, function(e){return e.amount;});
      var scopedEntries = rankCat ? entries.filter(function(e){ return e.categoryId===rankCat; }) : entries;
      var scopedTotal = rankCat ? sumBy(scopedEntries, function(e){return e.amount;}) : totalIncome;

      var byGiver = {};
      scopedEntries.forEach(function(e){
        if(!e.giverId) return;
        var r = byGiver[e.giverId];
        if(!r) r = byGiver[e.giverId] = { id:e.giverId, name:e.giverName||'—', total:0, count:0, last:null };
        r.total += Number(e.amount)||0; r.count++;
        if(!r.last || e.date>r.last) r.last = e.date;
      });
      var rows = Object.keys(byGiver).map(function(k){return byGiver[k];}).filter(function(r){return r.total>0.005;}).sort(function(a,b){return b.total-a.total;});
      if(q) rows = rows.filter(function(r){ return r.name.toLowerCase().indexOf(q)>-1; });

      var catOptions = '<option value=""'+(!rankCat?' selected':'')+'>Total giving — all categories</option>' +
        cats.map(function(c){ return '<option value="'+esc(c.id)+'"'+(c.id===rankCat?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('');
      var amtLabel = rankCat ? 'Given to '+esc(selectedCat.name) : 'Total given';
      var pctLabel = rankCat ? '% of category' : '% of income';
      var body = rows.length ? rows.map(function(r, idx){
        return '<tr><td class="num-col" style="color:var(--ink-faint);width:32px;">'+(idx+1)+'</td><td>'+esc(r.name)+'</td><td class="num-col income">'+fmtMoney(r.total)+'</td><td class="num-col">'+r.count+'</td>' +
          '<td class="num-col">'+fmtPct(scopedTotal?r.total/scopedTotal:null)+'</td><td>'+(r.last?fmtDate(r.last):'—')+'</td></tr>';
      }).join('') : '<tr><td colspan="6"><div class="empty">No giving recorded yet'+(rankCat?' in '+esc(selectedCat.name):'')+' for '+esc(fiscalYearLabel(year))+'.</div></td></tr>';
      return topbar('Donor Summary', fiscalYearLabel(year), true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print"><div class="toolbar"><div class="search-box"><input type="text" id="giver-report-search" placeholder="Search donors…" value="'+esc(state.giverReportSearch||'')+'"></div>' +
          '<div class="field" style="margin:0;max-width:230px;"><label for="donor-rank-cat">Rank by</label><select id="donor-rank-cat">'+catOptions+'</select></div></div></div>' +
          '<div class="panel panel-pad" style="margin-top:10px;"><div class="table-wrap"><table class="ledger"><thead><tr><th>#</th><th>Donor</th><th style="text-align:right;">'+amtLabel+'</th><th style="text-align:right;">Gifts</th><th style="text-align:right;">'+pctLabel+'</th><th>Last gift</th></tr></thead><tbody>'+body+'</tbody></table></div></div>' +
        '</div>';
    }

    /* ---------------- Funder Report (charity) ---------------- */
    function renderFunderReport(){
      var year = currentYear();
      var q = (state.giverReportSearch||'').trim().toLowerCase();
      var givers = activeGivers();
      var rows = givers.map(function(g){
        var income = sumBy(entriesInYear(state.incomeEntries, year).filter(function(e){return e.giverId===g.id;}), function(e){return e.amount;});
        var expenditure = sumBy(entriesInYear(state.expenseEntries, year), function(e){ return (e.allocations && e.allocations[g.id]) ? Number(e.allocations[g.id])||0 : 0; });
        var budget = budgetedAmt('income', g.id, year);
        return { g:g, income:income, expenditure:expenditure, balance:income-expenditure, budget:budget, pct: budget?income/budget:null };
      }).filter(function(r){ return !q || r.g.name.toLowerCase().indexOf(q)>-1; });
      var body = rows.length ? rows.map(function(r){
        return '<tr><td>'+esc(r.g.name)+'</td><td><span class="pill">'+esc(r.g.fundType||'')+'</span></td>' +
          '<td class="num-col income">'+fmtMoney(r.income)+'</td><td class="num-col expense">'+fmtMoney(r.expenditure)+'</td>' +
          '<td class="num-col">'+fmtMoney(r.balance)+'</td><td class="num-col">'+(r.budget?fmtMoney(r.budget):'—')+'</td>' +
          '<td class="num-col">'+(r.pct==null?'—':fmtPct(r.pct))+'</td></tr>';
      }).join('') : '<tr><td colspan="7"><div class="empty">No funders recorded yet.</div></td></tr>';

      var expCats = catListFor('expense').filter(function(x){return x.active!==false;}).sort(function(a,b){return a.order-b.order;});
      var matrixHead = '<th>Category</th>' + givers.map(function(g){ return '<th style="text-align:right;">'+esc(g.name)+'</th>'; }).join('') + '<th style="text-align:right;">Total</th>';
      var matrixRows = expCats.map(function(cat){
        var cells = givers.map(function(g){
          var amt = sumBy(entriesInYear(state.expenseEntries, year).filter(function(e){return e.categoryId===cat.id;}), function(e){ return (e.allocations && e.allocations[g.id]) ? Number(e.allocations[g.id])||0 : 0; });
          return amt;
        });
        var total = sumBy(cells, function(x){return x;});
        if(total<0.005) return '';
        return '<tr><td>'+esc(cat.name)+'</td>' + cells.map(function(a){ return '<td class="num-col">'+fmtMoney(a)+'</td>'; }).join('') + '<td class="num-col"><strong>'+fmtMoney(total)+'</strong></td></tr>';
      }).filter(function(r){return r;}).join('');

      return topbar('Funder Report', fiscalYearLabel(year), true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print"><div class="toolbar"><div class="search-box"><input type="text" id="giver-report-search" placeholder="Search funders…" value="'+esc(state.giverReportSearch||'')+'"></div></div></div>' +
          '<div class="panel panel-pad" style="margin-top:10px;"><div class="table-wrap"><table class="ledger"><thead><tr><th>Funder</th><th>Fund</th><th style="text-align:right;">Income received</th><th style="text-align:right;">Expenditure allocated</th><th style="text-align:right;">Balance remaining</th><th style="text-align:right;">Budget</th><th style="text-align:right;">% received</th></tr></thead><tbody>'+body+'</tbody></table></div></div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Expenditure by category &amp; funder</h2></div>' +
          '<div class="table-wrap"><table class="ledger"><thead><tr>'+matrixHead+'</tr></thead><tbody>'+(matrixRows||('<tr><td colspan="'+(givers.length+2)+'"><div class="empty">No allocated expenditure yet.</div></td></tr>'))+'</tbody></table></div></div>' +
        '</div>';
    }

    /* ---------------- Giver Statement / Funder Statement (per-giver, date range, printable) ---------------- */
    function renderGiverStatement(){
      var c = cfg();
      var givers = activeGivers();
      var giverId = (state.statementGiverId && givers.some(function(g){return g.id===state.statementGiverId;})) ? state.statementGiverId : (givers[0] ? givers[0].id : '');
      var year = currentYear();
      var from = state.statementFrom || fyStart(year);
      var to = state.statementTo || asOfDateForYear(year);
      var giver = giverById(giverId);
      var giverOptions = givers.map(function(g){ return '<option value="'+g.id+'"'+(g.id===giverId?' selected':'')+'>'+esc(g.name)+'</option>'; }).join('');

      var incCats = catListFor('income').filter(function(x){return x.active!==false;}).sort(function(a,b){return a.order-b.order;});
      var incEntries = state.incomeEntries.filter(function(e){ return e.giverId===giverId && e.date>=from && e.date<=to; });
      var incByCat = incCats.map(function(cat){
        var total = sumBy(incEntries.filter(function(e){return e.categoryId===cat.id;}), function(e){return e.amount;});
        return { name:cat.name, total:total };
      }).filter(function(r){
        var hideIfZero = (c.giverStatementHideIfZero||[]).some(function(h){ return h.trim().toLowerCase()===r.name.trim().toLowerCase(); });
        return !(hideIfZero && r.total<0.005);
      });
      var incTotal = sumBy(incByCat, function(r){return r.total;});
      var incRows = incByCat.map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td class="num-col income">'+fmtMoney(r.total)+'</td></tr>'; }).join('');

      var expBlock = '', expTotal = 0;
      if(c.hasFunders){
        var expCats = catListFor('expense').filter(function(x){return x.active!==false;}).sort(function(a,b){return a.order-b.order;});
        var expByCat = expCats.map(function(cat){
          var total = sumBy(state.expenseEntries.filter(function(e){ return e.categoryId===cat.id && e.date>=from && e.date<=to && e.allocations && e.allocations[giverId]; }), function(e){ return Number(e.allocations[giverId])||0; });
          return { name:cat.name, total:total };
        }).filter(function(r){return r.total>0.005;});
        expTotal = sumBy(expByCat, function(r){return r.total;});
        var expRows = expByCat.length ? expByCat.map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td class="num-col expense">'+fmtMoney(r.total)+'</td></tr>'; }).join('') : '<tr><td colspan="2"><div class="empty">No expenditure allocated to this funder in this period.</div></td></tr>';
        expBlock = '<div class="panel panel-pad" style="margin-top:14px;"><div class="section-title"><h2>Expenditure allocated</h2></div>' +
          '<div class="table-wrap"><table class="ledger"><tbody>'+expRows+'</tbody><tfoot><tr><td>Total</td><td class="num-col expense"><strong>'+fmtMoney(expTotal)+'</strong></td></tr></tfoot></table></div></div>';
      }
      var balanceRemaining = incTotal - expTotal;
      var ent = state.entities.find(function(e){ return e.id===state.currentEntityId; }) || {};
      var orgName = state.settings.main.orgName || ent.name || cfg().label;

      return topbar(c.giverStatementLabel, giver?giver.name:'', true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print"><div class="entry-form">' +
            '<div class="field"><label for="stmt-giver">'+esc(c.giverNoun)+'</label><select id="stmt-giver">'+giverOptions+'</select></div>' +
            '<div class="field"><label for="stmt-from">From</label><input type="date" id="stmt-from" value="'+from+'"></div>' +
            '<div class="field"><label for="stmt-to">To</label><input type="date" id="stmt-to" value="'+to+'"></div>' +
          '</div></div>' +
          '<div class="panel panel-pad" style="margin-top:14px;">' +
            '<div class="statement">' +
              '<div class="stmt-section-title">'+esc(orgName)+'</div>' +
              '<div class="stmt-row"><span class="stmt-label">'+esc(c.giverNoun)+'</span><span class="stmt-amt">'+esc(giver?giver.name:'—')+'</span></div>' +
              '<div class="stmt-row"><span class="stmt-label">Period</span><span class="stmt-amt">'+fmtDate(from)+' – '+fmtDate(to)+'</span></div>' +
            '</div>' +
            '<div class="table-wrap" style="margin-top:12px;"><table class="ledger"><thead><tr><th>Income category</th><th style="text-align:right;">Amount</th></tr></thead>' +
            '<tbody>'+(incRows||'<tr><td colspan="2"><div class="empty">No gifts recorded in this period.</div></td></tr>')+'</tbody>' +
            '<tfoot><tr><td>Total</td><td class="num-col income"><strong>'+fmtMoney(incTotal)+'</strong></td></tr></tfoot></table></div>' +
          '</div>' +
          expBlock +
          (c.hasFunders ? '<div class="panel panel-pad" style="margin-top:14px;"><div class="stmt-row total"><span class="stmt-label">Balance remaining</span><span class="stmt-amt">'+fmtMoney(balanceRemaining)+'</span></div></div>' : '') +
        '</div>';
    }

    /* ---------------- Management Summary (charity) ---------------- */
    function renderManagementSummary(){
      var year = currentYear(), c = cfg();
      var incTotal = sumBy(entriesInYear(state.incomeEntries, year), function(e){return e.amount;});
      var expTotal = sumBy(entriesInYear(state.expenseEntries, year), function(e){return e.amount;});
      var incBudget = sumBy(activeGivers(), function(g){ return budgetedAmt('income', g.id, year); });
      var expBudget = sumBy(catListFor('expense').filter(function(x){return x.active!==false;}), function(cat){ return budgetedAmt('expense', cat.id, year); });
      function pill(actual, budget){
        if(!budget) return '<span class="status-pill">No budget</span>';
        return actual<=budget ? '<span class="status-pill good">'+fmtPct(actual/budget)+'</span>' : '<span class="status-pill over">'+fmtPct(actual/budget)+'</span>';
      }
      var giverRows = activeGivers().map(function(g){
        var inc = sumBy(entriesInYear(state.incomeEntries, year).filter(function(e){return e.giverId===g.id;}), function(e){return e.amount;});
        var budget = budgetedAmt('income', g.id, year);
        return '<tr><td>'+esc(g.name)+'</td><td class="num-col income">'+fmtMoney(inc)+'</td><td class="num-col">'+(budget?fmtMoney(budget):'—')+'</td><td>'+pill(inc,budget)+'</td></tr>';
      }).join('');
      var groups = c.expenseGroups || [];
      var groupRows = groups.map(function(g){
        var cats = catListFor('expense').filter(function(x){return x.group===g;});
        var actual = sumBy(cats, function(cat){ return sumBy(entriesInYear(state.expenseEntries, year).filter(function(e){return e.categoryId===cat.id;}), function(e){return e.amount;}); });
        var budget = sumBy(cats, function(cat){ return budgetedAmt('expense', cat.id, year); });
        return '<tr><td>'+esc(g)+'</td><td class="num-col expense">'+fmtMoney(actual)+'</td><td class="num-col">'+(budget?fmtMoney(budget):'—')+'</td><td>'+pill(actual,budget)+'</td></tr>';
      }).join('');
      return topbar('Management Summary', fiscalYearLabel(year)) +
        '<div class="content">' +
          '<div class="stats">' +
            stat('Income vs budget', fmtMoney(incTotal), incBudget?(fmtPct(incTotal/incBudget)+' of '+fmtMoney(incBudget)):'no budget set') +
            stat('Expenditure vs budget', fmtMoney(expTotal), expBudget?(fmtPct(expTotal/expBudget)+' of '+fmtMoney(expBudget)):'no budget set') +
            stat('Net for the year', fmtMoney(incTotal-expTotal), fiscalYearLabel(year)) +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Income by funder</h2></div>' +
          '<div class="table-wrap"><table class="ledger"><thead><tr><th>Funder</th><th style="text-align:right;">Income</th><th style="text-align:right;">Budget</th><th>% received</th></tr></thead><tbody>'+(giverRows||'<tr><td colspan="4"><div class="empty">No funders yet.</div></td></tr>')+'</tbody></table></div></div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Expenditure by cost group</h2></div>' +
          '<div class="table-wrap"><table class="ledger"><thead><tr><th>Group</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Budget</th><th>% used</th></tr></thead><tbody>'+(groupRows||'<tr><td colspan="4"><div class="empty">No cost groups.</div></td></tr>')+'</tbody></table></div></div>' +
        '</div>';
    }

    /* ---------------- YTD by Category (fiscal-month breakdown) ---------------- */
    function fiscalIndex(iso){
      var d = new Date(iso+'T00:00:00');
      if(isNaN(d)) return 0;
      return (d.getMonth() - fyStartMonthIdx() + 12) % 12;
    }
    function fiscalMonthLabels(){
      var idx = fyStartMonthIdx();
      var out = []; for(var i=0;i<12;i++) out.push(MONTH_NAMES_SHORT[(idx+i)%12]);
      return out;
    }
    function categoryRowsWithMonths(entries, cats){
      var byId = {};
      cats.forEach(function(c){ byId[c.id] = { id:c.id, name:c.name, order:c.order||0, months:new Array(12).fill(0), total:0 }; });
      entries.forEach(function(e){
        var row = byId[e.categoryId];
        if(!row){ row = byId[e.categoryId] = { id:e.categoryId, name:(e.categoryName||'Unfiled')+' (removed)', order:9999, months:new Array(12).fill(0), total:0 }; }
        var idx = fiscalIndex(e.date), amt = Number(e.amount)||0;
        row.months[idx] += amt; row.total += amt;
      });
      return Object.keys(byId).map(function(k){return byId[k];}).sort(function(a,b){return a.order-b.order;});
    }
    function renderYTD(){
      var year = currentYear();
      var months = fiscalMonthLabels();
      function block(title, entries, cats, kind){
        var rows = categoryRowsWithMonths(entries, cats);
        var grandTotal = sumBy(rows, function(r){return r.total;});
        var head = '<th>Category</th>' + months.map(function(m){return '<th style="text-align:right;">'+m+'</th>';}).join('') + '<th style="text-align:right;">Total</th><th style="text-align:right;">% of total</th>';
        var body = rows.filter(function(r){return r.total>0.005;}).map(function(r){
          var pct = grandTotal ? (r.total/grandTotal*100) : 0;
          return '<tr><td>'+esc(r.name)+'</td>' +
            r.months.map(function(m){ return '<td class="num-col">'+(m ? fmtMoney(m) : '<span style="color:var(--ink-faint);">–</span>')+'</td>'; }).join('') +
            '<td class="num-col '+kind+'">'+fmtMoney(r.total)+'</td><td class="num-col">'+pct.toFixed(1)+'%</td></tr>';
        }).join('');
        var foot = '<tr><td>Total</td>' + months.map(function(m,i){ return '<td class="num-col">'+fmtMoney(sumBy(rows, function(r){return r.months[i];}))+'</td>'; }).join('') + '<td class="num-col">'+fmtMoney(grandTotal)+'</td><td></td></tr>';
        return '<div class="panel panel-pad"><div class="section-title"><h2>'+title+'</h2><span class="desc">By fiscal month, '+esc(fiscalYearLabel(year))+'</span></div>' +
          '<div class="table-wrap"><table class="ledger"><thead><tr>'+head+'</tr></thead><tbody>'+(body||'<tr><td colspan="15"><div class="empty">No entries yet.</div></td></tr>')+'</tbody><tfoot>'+foot+'</tfoot></table></div></div>';
      }
      return topbar('YTD by Category', 'Running totals for every category, month by month · '+fiscalYearLabel(year), true) +
        '<div class="content">' +
          block('Income', entriesInYear(state.incomeEntries, year), state.incomeCats, 'income') +
          '<div style="margin-top:18px;">' + block('Expenditure', entriesInYear(state.expenseEntries, year), state.expenseCats, 'expense') + '</div>' +
        '</div>';
    }

    /* ---------------- Cost / Program Analysis (with cost-per-unit) ---------------- */
    function renderProgram(){
      var year = currentYear();
      var yearInc = entriesInYear(state.incomeEntries, year);
      var yearExp = entriesInYear(state.expenseEntries, year);
      var totalInc = sumBy(yearInc, function(e){return e.amount;});
      var totalExp = sumBy(yearExp, function(e){return e.amount;});
      var expRows = categoryRows(yearExp, state.expenseCats).filter(function(r){return r.total>0.005;}).sort(function(a,b){return b.total-a.total;});
      var incRows = categoryRows(yearInc, state.incomeCats).filter(function(r){return r.total>0.005;}).sort(function(a,b){return b.total-a.total;});
      var maxExp = Math.max.apply(null, expRows.map(function(r){return r.total;}).concat([1]));
      var maxInc = Math.max.apply(null, incRows.map(function(r){return r.total;}).concat([1]));
      function bars(rows, max, total, kind){
        if(!rows.length) return '<div class="empty">Nothing recorded yet.</div>';
        return '<div class="barlist">' + rows.map(function(r){
          var pct = total ? (r.total/total*100) : 0;
          var w = (r.total/max*100);
          return '<div class="barrow '+kind+'"><div class="barrow-head"><span>'+esc(r.name)+'</span><span class="n">'+fmtMoney(r.total)+' · '+pct.toFixed(1)+'%</span></div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;"></div></div></div>';
        }).join('') + '</div>';
      }
      var months = fiscalMonthLabels();
      var monthRows = months.map(function(m,i){
        var inc = sumBy(yearInc.filter(function(e){return fiscalIndex(e.date)===i;}), function(e){return e.amount;});
        var exp = sumBy(yearExp.filter(function(e){return fiscalIndex(e.date)===i;}), function(e){return e.amount;});
        var net = inc-exp;
        return '<tr><td>'+m+'</td><td class="num-col income">'+fmtMoney(inc)+'</td><td class="num-col expense">'+fmtMoney(exp)+'</td>' +
          '<td class="num-col" style="color:'+(net>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(net)+'</td></tr>';
      }).join('');
      var unitRows = categoryRows(yearExp.filter(function(e){return e.units>0;}), state.expenseCats).filter(function(r){return r.total>0.005;});
      var unitBody = unitRows.length ? unitRows.map(function(r){
        var ents = yearExp.filter(function(e){return e.categoryId===r.id && e.units>0;});
        var totalUnits = sumBy(ents, function(e){return e.units;});
        var label = (ents[0] && ents[0].unitLabel) || 'units';
        var perUnit = totalUnits ? (r.total/totalUnits) : 0;
        return '<tr><td>'+esc(r.name)+'</td><td class="num-col">'+totalUnits+' '+esc(label)+'</td><td class="num-col expense">'+fmtMoney(r.total)+'</td><td class="num-col">'+fmtMoney(perUnit)+' / '+esc(label.replace(/s$/,''))+'</td></tr>';
      }).join('') : '';
      return topbar('Cost Analysis', 'Cost breakdowns, monthly trend, and unit cost · '+fiscalYearLabel(year), true) +
        '<div class="content">' +
          '<div class="two-col">' +
            '<div class="panel panel-pad"><div class="section-title"><h2>Cost by category</h2><span class="desc">Share of total expenditure</span></div>'+bars(expRows,maxExp,totalExp,'expense')+'</div>' +
            '<div class="panel panel-pad"><div class="section-title"><h2>Income mix</h2><span class="desc">Share of total income</span></div>'+bars(incRows,maxInc,totalInc,'income')+'</div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:18px;"><div class="section-title"><h2>Monthly trend</h2><span class="desc">Income vs. expenditure by fiscal month</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Month</th><th style="text-align:right;">Income</th><th style="text-align:right;">Expenditure</th><th style="text-align:right;">Net</th></tr></thead><tbody>'+monthRows+'</tbody></table></div>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:18px;"><div class="section-title"><h2>Cost per unit</h2><span class="desc">Categories where an entry recorded a unit count</span></div>' +
            (unitBody ? '<div class="table-wrap"><table class="ledger"><thead><tr><th>Category</th><th style="text-align:right;">Units recorded</th><th style="text-align:right;">Total spend</th><th style="text-align:right;">Avg. cost/unit</th></tr></thead><tbody>'+unitBody+'</tbody></table></div>' : '<div class="empty">No unit counts recorded yet — add one on an Expenditure entry (e.g. "40 meals") to see cost-per-unit here.</div>') +
          '</div>' +
        '</div>';
    }

    /* ---------------- Budget vs Actual ---------------- */
    function renderBudget(){
      var year = currentYear(), c = cfg();
      function inputCell(kind, refId, name, budgeted){
        return '<td class="num-col"><input type="number" min="0" step="0.01" value="'+(budgeted||'')+'" placeholder="0.00" data-budget-kind="'+kind+'" data-budget-ref="'+refId+'" data-budget-name="'+esc(name)+'" style="width:100px;text-align:right;"></td>';
      }
      var incomeBlock;
      if(c.hasFunders){
        var givers = activeGivers();
        var rows = givers.map(function(g){
          var actual = sumBy(entriesInYear(state.incomeEntries, year).filter(function(e){return e.giverId===g.id;}), function(e){return e.amount;});
          var budgeted = budgetedAmt('income', g.id, year), variance = budgeted-actual;
          return '<tr><td>'+esc(g.name)+'</td>'+inputCell('income', g.id, g.name, budgeted)+'<td class="num-col">'+fmtMoney(actual)+'</td><td class="num-col" style="color:'+(variance>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(variance)+'</td></tr>';
        }).join('');
        var totalBudget = sumBy(givers, function(g){return budgetedAmt('income', g.id, year);});
        var totalActual = sumBy(entriesInYear(state.incomeEntries, year), function(e){return e.amount;});
        incomeBlock = '<div class="table-wrap"><table class="ledger"><thead><tr><th>Funder</th><th style="text-align:right;">Budget</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Variance</th></tr></thead>' +
          '<tbody>'+(rows||'<tr><td colspan="4"><div class="empty">No funders added yet.</div></td></tr>')+'</tbody>' +
          '<tfoot><tr><td>Total</td><td class="num-col">'+fmtMoney(totalBudget)+'</td><td class="num-col">'+fmtMoney(totalActual)+'</td><td class="num-col">'+fmtMoney(totalBudget-totalActual)+'</td></tr></tfoot></table></div>';
      } else {
        var sorted = state.incomeCats.filter(function(x){return x.active!==false;}).sort(function(a,b){return a.order-b.order;});
        var rows2 = sorted.map(function(cat){
          var actual = sumBy(entriesInYear(state.incomeEntries, year).filter(function(e){return e.categoryId===cat.id;}), function(e){return e.amount;});
          var budgeted = budgetedAmt('income', cat.id, year), variance = budgeted-actual;
          return '<tr><td>'+esc(cat.name)+'</td>'+inputCell('income', cat.id, cat.name, budgeted)+'<td class="num-col">'+fmtMoney(actual)+'</td><td class="num-col" style="color:'+(variance>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(variance)+'</td></tr>';
        }).join('');
        var totalBudget2 = sumBy(sorted, function(cat){return budgetedAmt('income', cat.id, year);});
        var totalActual2 = sumBy(entriesInYear(state.incomeEntries, year), function(e){return e.amount;});
        incomeBlock = '<div class="table-wrap"><table class="ledger"><thead><tr><th>Category</th><th style="text-align:right;">Budget</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Variance</th></tr></thead>' +
          '<tbody>'+rows2+'</tbody><tfoot><tr><td>Total</td><td class="num-col">'+fmtMoney(totalBudget2)+'</td><td class="num-col">'+fmtMoney(totalActual2)+'</td><td class="num-col">'+fmtMoney(totalBudget2-totalActual2)+'</td></tr></tfoot></table></div>';
      }
      var expSorted = state.expenseCats.filter(function(x){return x.active!==false;}).sort(function(a,b){return a.order-b.order;});
      var expRows = expSorted.map(function(cat){
        var actual = sumBy(entriesInYear(state.expenseEntries, year).filter(function(e){return e.categoryId===cat.id;}), function(e){return e.amount;});
        var budgeted = budgetedAmt('expense', cat.id, year), variance = budgeted-actual;
        return '<tr><td>'+esc(cat.name)+'</td>'+inputCell('expense', cat.id, cat.name, budgeted)+'<td class="num-col">'+fmtMoney(actual)+'</td><td class="num-col" style="color:'+(variance>=0?'var(--income)':'var(--danger)')+';">'+fmtMoney(variance)+'</td></tr>';
      }).join('');
      var totalExpBudget = sumBy(expSorted, function(cat){return budgetedAmt('expense', cat.id, year);});
      var totalExpActual = sumBy(entriesInYear(state.expenseEntries, year), function(e){return e.amount;});
      var expenseBlock = '<div class="table-wrap"><table class="ledger"><thead><tr><th>Category</th><th style="text-align:right;">Budget</th><th style="text-align:right;">Actual</th><th style="text-align:right;">Variance</th></tr></thead>' +
        '<tbody>'+expRows+'</tbody><tfoot><tr><td>Total</td><td class="num-col">'+fmtMoney(totalExpBudget)+'</td><td class="num-col">'+fmtMoney(totalExpActual)+'</td><td class="num-col">'+fmtMoney(totalExpBudget-totalExpActual)+'</td></tr></tfoot></table></div>';

      return topbar('Budget vs Actual', fiscalYearLabel(year), true) +
        '<div class="content">' +
          '<div class="panel panel-pad no-print" style="margin-bottom:12px;"><button class="btn btn-ghost btn-sm" type="button" data-action="copy-budget-forward">⭱ Copy last year’s targets (only fills blanks)</button></div>' +
          '<div class="panel panel-pad"><div class="section-title"><h2>'+(c.hasFunders?'Income (by funder)':'Income')+'</h2></div>'+incomeBlock+'</div>' +
          '<div class="panel panel-pad" style="margin-top:14px;"><div class="section-title"><h2>Expenditure</h2></div>'+expenseBlock+'</div>' +
        '</div>';
    }

    /* ---------------- Categories ---------------- */
    function renderCategories(){
      var c = cfg();
      function catBlock(kind, title){
        var groups = groupsFor(kind);
        var cats = catListFor(kind).slice().sort(function(a,b){return a.order-b.order;});
        var groupOptions = groups ? groups.map(function(g){ return '<option value="'+esc(g)+'">'+esc(g)+'</option>'; }).join('') : '';
        var body;
        if(groups){
          body = groups.map(function(g){
            var list = cats.filter(function(x){return x.group===g && x.active!==false;});
            if(!list.length) return '';
            var chips = list.map(function(x){
              var used = entriesFor(kind).filter(function(e){return e.categoryId===x.id;}).length;
              return '<div class="chip'+(x.custom?' custom':'')+'"><span>'+esc(x.name)+'</span><span class="idx">'+used+'</span><button data-del-cat="'+x.id+'" data-cat-kind="'+kind+'" title="Remove category">×</button></div>';
            }).join('');
            return '<div style="margin-bottom:10px;"><div class="hint" style="margin-bottom:4px;">'+esc(g)+'</div><div class="chiplist">'+chips+'</div></div>';
          }).join('');
        } else {
          var list2 = cats.filter(function(x){return x.active!==false;});
          body = list2.length ? '<div class="chiplist">' + list2.map(function(x){
            var used = entriesFor(kind).filter(function(e){return e.categoryId===x.id;}).length;
            return '<div class="chip'+(x.custom?' custom':'')+'"><span>'+esc(x.name)+'</span><span class="idx">'+used+'</span><button data-del-cat="'+x.id+'" data-cat-kind="'+kind+'" title="Remove category">×</button></div>';
          }).join('') + '</div>' : '<div class="empty">No categories yet.</div>';
        }
        return '<div class="panel panel-pad" style="margin-top:14px;">' +
          '<div class="section-title"><h2>'+title+'</h2><span class="desc">'+cats.filter(function(x){return x.active!==false;}).length+' categories</span></div>' +
          '<form data-cat-form="'+kind+'" style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;" autocomplete="off">' +
            '<input type="text" placeholder="New category name…" data-cat-input="'+kind+'" style="flex:1; min-width:140px; padding:8px 11px; border-radius:7px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink);" required>' +
            (groups ? '<select data-cat-group-input="'+kind+'" style="padding:8px 11px; border-radius:7px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink);" required>'+groupOptions+'</select>' : '') +

    /* ---------------- Fixed Assets (at cost — no depreciation) ---------------- */
    function renderAssets(){
      var year = currentYear();
      var asOf = asOfDateForYear(year);
      var q = state.assetSearch.trim().toLowerCase();
      var cats = state.assetCats.slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
      var catOptions = cats.filter(function(x){return x.active!==false;}).map(function(x){ return '<option value="'+x.id+'">'+esc(x.name)+'</option>'; }).join('');
      var rows = state.assets.slice().sort(function(a,b){ return (b.dateAcquired||'').localeCompare(a.dateAcquired||'') || (b.createdAt||'').localeCompare(a.createdAt||''); });
      if(q) rows = rows.filter(function(a){ return (a.description||'').toLowerCase().indexOf(q)>-1 || (a.categoryName||'').toLowerCase().indexOf(q)>-1; });
      var breakdown = assetCategoryTotalsAsOf(asOf).filter(function(r){return r.total>0.005;});
      var totalCost = sumBy(state.assets, function(a){return a.value;});

      var catChips = cats.length ? '<div class="chiplist">' + cats.map(function(c2){
        var used = state.assets.filter(function(a){return a.categoryId===c2.id;}).length;
        return '<div class="chip'+(c2.custom?' custom':'')+'"><span>'+esc(c2.name)+'</span><span class="idx">'+used+'</span><button data-del-assetcat="'+c2.id+'" title="Remove category">×</button></div>';
      }).join('') + '</div>' : '<div class="empty">No asset categories yet.</div>';

      var tableRows = rows.length ? rows.map(function(a){
        return '<tr><td>'+esc(a.description||'—')+'</td><td><span class="pill">'+esc(a.categoryName)+'</span></td>' +
          '<td class="num-col">'+fmtMoney(a.value)+'</td><td>'+(a.dateAcquired?fmtDate(a.dateAcquired):'—')+'</td>' +
          '<td class="note">'+esc(a.note||'')+'</td>' +
          '<td class="actions"><button class="btn btn-ghost btn-sm" data-del-asset="'+a.id+'">Delete</button></td></tr>';
      }).join('') : '<tr><td colspan="6"><div class="empty">'+(q?'No assets match "'+esc(state.assetSearch)+'".':'No fixed assets recorded yet.')+'</div></td></tr>';

      var breakdownRows = breakdown.length ? breakdown.map(function(r){ return '<tr><td>'+esc(r.name)+'</td><td class="num-col"><strong>'+fmtMoney(r.total)+'</strong></td></tr>'; }).join('') : '';

      return topbar('Fixed Assets', cats.length+' categories · '+fmtMoney(totalCost)+' at cost as at '+asAtLabel(year)) +
        '<div class="content">' +
          '<div class="banner info">◈ Assets are held at cost, receipts-and-payments style — no depreciation is calculated. A fixed asset can also be added automatically from an Expenditure entry by ticking "this purchase is a fixed asset".</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>Asset categories</h2></div>' +
            '<form id="assetcat-form" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;" autocomplete="off">' +
              '<input type="text" id="assetcat-name" placeholder="New category name…" style="flex:1;min-width:140px;padding:8px 11px;border-radius:7px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);" required>' +
              '<button class="btn btn-primary btn-sm" type="submit">＋ Add</button>' +
            '</form>' + catChips +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;">' +
            '<div class="section-title"><h2>Add an asset</h2><span class="desc">Recorded at cost, on the date acquired</span></div>' +
            '<form class="entry-form" id="asset-form" autocomplete="off">' +
              '<div class="field wide"><label for="asset-desc">Description</label><input type="text" id="asset-desc" placeholder="e.g. Laptop for admin office" required></div>' +
              '<div class="field"><label for="asset-cat">Category</label><select id="asset-cat" required><option value="" disabled selected>Choose…</option>'+catOptions+'</select></div>' +
              '<div class="field"><label for="asset-value">Cost (£)</label><input type="number" id="asset-value" min="0" step="0.01" placeholder="0.00" required></div>' +
              '<div class="field"><label for="asset-date">Date acquired</label><input type="date" id="asset-date" required value="'+todayISO()+'"></div>' +
              '<div class="field wide"><label for="asset-note">Note (optional)</label><input type="text" id="asset-note" placeholder="e.g. serial number, location…"></div>' +
              '<div class="field"><button class="btn btn-primary" type="submit">＋ Add asset</button></div>' +
            '</form>' +
          '</div>' +
          '<div class="panel panel-pad" style="margin-top:16px;"><div class="section-title"><h2>By category, as at '+asAtLabel(year)+'</h2></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Category</th><th style="text-align:right;">Cost</th></tr></thead>' +
            '<tbody>'+(breakdownRows||'<tr><td colspan="2"><div class="empty">No assets recorded yet.</div></td></tr>')+'</tbody>' +
            '<tfoot><tr><td>Total</td><td class="num-col"><strong>'+fmtMoney(totalCost)+'</strong></td></tr></tfoot></table></div>' +
          '</div>' +
          '<div class="panel" style="margin-top:18px;"><div class="panel-pad">' +
            '<div class="toolbar"><div class="search-box"><input type="text" id="asset-search" placeholder="Search by description or category…" value="'+esc(state.assetSearch)+'"></div>' +
            '<span class="count-badge">'+rows.length+' of '+state.assets.length+' assets</span></div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Description</th><th>Category</th><th style="text-align:right;">Cost</th><th>Acquired</th><th>Note</th><th></th></tr></thead>' +
            '<tbody>'+tableRows+'</tbody></table></div>' +
          '</div></div>' +
        '</div>';
    }
